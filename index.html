      // set to. matSt only gets its real values AFTER each one actually
      // applies, matching how every other caller already does it.
      // A wanted value that is not actually in the model (stale subset snapshot, removed material)
      // falls back to the container's first available option instead of leaving it blank.
      Object.entries(_initDesiredMatSt).forEach(([c,m0])=>{const m=_wceResolveWantedMat(c,m0);applyMat(c,m);matSt[c]=m;});
      // Pre-advance any cycleShowMode:'current' toggle whose FIRST state is
      // exactly what's about to be showing by default anyway (camera, HDRI,
      // Variant, Global Set, Material Subset, or Geometry Subset) -- without
      // this, the toggle's own click handler applies states[0] again on the
      // very first click (that's what 'current' mode does: apply what's
      // currently shown, then advance for next time), which is a redundant
      // no-op since it's already showing, making the first click look like
      // it did nothing. Every click after that works correctly, since by
      // then the toggle really has moved on to a state that ISN'T already
      // showing. Mirrors the exact same cascade priority the real
      // default-application code below uses -- Variant, if valid, is the
      // ONLY one of Variant/Global Set/Material Subset/Geometry Subset
      // that's actually applied -- so this never skips a state that was
      // never genuinely pre-applied. window.WCE_OVERLAYS is populated here
      // via a direct call, not by waiting for buildUI() to do it moments
      // later, since this has to run before ANY toggle is first built.
      _wceApplyDeviceOverrides();
      (function _wcePreAdvanceCurrentModeToggles(){
        const defVariantName = CFG.default_variant;
        const variantIsActive = !!(defVariantName && varData[defVariantName]);
        const defCameraName = ((CFG.cameras&&CFG.cameras.static)||[]).find(c=>c.default);
        const defCamName = defCameraName ? defCameraName.name : null;
        const defHdri = (CFG.hdris||[]).find(h=>h.default);
        const defHdriFile = defHdri ? defHdri.file : null;
        const defGlobalSet = (!variantIsActive && CFG.default_global_set) ? CFG.default_global_set : null;
        const defMatSubsetNames = variantIsActive ? null :
          new Set((CFG.default_mat_subsets||[]).map(d=>d.name));
        const defGeoState = variantIsActive ? null : (CFG.default_geo_state||{});

        function isPreApplied(st){
          if(!st || !st.type) return false;
          if(st.type==='camera')     return defCamName!=null && st.target===defCamName;
          if(st.type==='hdri')       return defHdriFile!=null && st.target===defHdriFile;
          if(st.type==='variant')    return variantIsActive && st.target===defVariantName;
          if(st.type==='global_set') return !!defGlobalSet && st.target===defGlobalSet.name;
          if(st.type==='mat_subset') return !!defMatSubsetNames && defMatSubsetNames.has(st.target);
          if(st.type==='geo_subset'){
            if(!defGeoState) return false;
            // Same deep state-comparison already used further below to
            // mark the default geo-package pill active -- reused here
            // rather than exporting a second, parallel "default subset
            // name" field that could drift out of sync with it.
            const gp=(CFG.geometry_subsets||[]).find(g=>g.name===st.target);
            const pst=gp&&gp.state; if(!pst) return false;
            const keys=Object.keys(pst);
            return keys.length>0 && keys.every(p=>defGeoState[p]===pst[p]);
          }
          return false;
        }

        (window.WCE_OVERLAYS||[]).forEach(o=>{
          if(o.type==='toggle' && o.cycleShowMode==='current' && (o.states||[]).length>1
             && isPreApplied(o.states[0])){
            o.activeIndex = 1;
          }
        });
      })();
      buildUI();
      if(window.WCE_OFFLINE_PREVIEW && !new URLSearchParams(window.location.search).has('wce_mobile_frame')){
        // wce_mobile_frame means this exact page is loaded INSIDE the
        // Mobile Portrait/Horizontal wrapper's own phone-frame iframe (see
        // the /__wce_mobile__ server route) — Statistics and the tier
        // switcher would be unusably cramped at real phone width, and the
        // wrapper's own Device selector (above the phone frame, not in
        // here) already covers switching device/orientation, so neither
        // needs to exist inside the frame at all.
        _wceStatsInitUI();
        _wceInitVariantSwitcher();
        // The phone-frame preview needs the live preview's own server route; the offline launcher doesn't have it.
        if(!window.WCE_NO_DEVICE_SWITCHER) _wceInitDeviceSwitcher();
      }
      // Apply defaults in order — all state must be settled before marking
      // buttons. Three-tier cascade: Variant (top) > Global Set (mid,
      // material-only) > per-category Material Subset Defaults + Geo
      // Package Default (bottom). A set Variant is the ONLY default
      // applied — Global Set/Mat Subset/Geo Subset are skipped entirely
      // rather than layered underneath, since applyVariant already sets
      // everything a full snapshot needs and layering the others on top
      // risked exactly the kind of conflicting-values problem this
      // ordering avoids.
      const _defaultVariantName = CFG.default_variant;
      const _variantActive = _defaultVariantName && varData[_defaultVariantName];
      if(_variantActive){
        applyVariant(_defaultVariantName);
      } else {
        // Global Set is material-only — it never touches Geo Package,
        // only ever the per-category Material Subset Defaults below it.
        const dgs=CFG.default_global_set;
        if(dgs && dgs.state){ applyMatSubset(dgs.state, '__global_sets__'); refreshAdvMat(dgs.state); }
        else{ refreshAdvMat(matSt); }
        if(CFG.default_geo_state&&Object.keys(CFG.default_geo_state).length){
          applyGeoSubset(CFG.default_geo_state);
          if(typeof buildAdvGeo==='function') buildAdvGeo();
        }
      }
      if(typeof refreshActive==='function') refreshActive();
      if(!_variantActive && typeof refreshAdvMat==='function') refreshAdvMat(matSt);
      if(_variantActive){
        // Mark the default Variant's own button (.vc, same as
        // buildVariants()) active — nothing else needs marking, since
        // nothing else was applied in this branch.
        document.querySelectorAll('.vc').forEach(b=>{
          if(b.dataset.v===_defaultVariantName) b.classList.add('active');
        });
      } else {
        // Mark default mat-subset pills — one per category now, match name
        // AND category to avoid highlighting all pills named e.g. "GREY"
        // across different categories.
        (CFG.default_mat_subsets||[]).forEach(dms=>{
          document.querySelectorAll('.pb2[data-sc]').forEach(b=>{
            if(b.textContent.trim()===dms.name && b.dataset.sc===dms.category)
              b.classList.add('active');
          });
        });
        // Mark default Global Set button (a .gb, same as any Full
        // Configurations button — see buildGlobalSets()) active, if one applied.
        const dgs=CFG.default_global_set;
        if(dgs){
          document.querySelectorAll('.gb').forEach(b=>{
            if(b.dataset.gn===dgs.name) b.classList.add('active');
          });
        }
        // Mark default geo-package pill: compare package state dict directly
        // against CFG.default_geo_state (same format) — reliable, no geoSt
        // key mismatch. Only meaningful here (inside the non-Variant
        // branch) — when Variant is active, whatever geometry it set has
        // nothing to do with CFG.default_geo_state, so marking a "default"
        // geo-package pill in that case would be misleading.
        (CFG.geometry_subsets||[]).forEach((gpkg,gi)=>{
          const pst=gpkg.state||{};
          const dst=CFG.default_geo_state||{};
          if(!Object.keys(pst).length) return;
          const match=Object.entries(pst).every(([p,c])=>dst[p]===c);
          if(match){ const b=document.querySelector(`.pb2[data-gi="${gi}"]`); if(b) b.classList.add('active'); }
        });
      }
      // Mark active HDRI button. Matched by name, not file — item.file can
      // now be shared between two panels pointing at the same underlying
      // image (see the export-time dedup), so matching by file alone would
      // incorrectly highlight every panel sharing that file at once.
      document.querySelectorAll('.pb2[data-hf]').forEach(b=>{
        const isActive=b.dataset.name===_hdriActiveName
          ||(!_hdriActiveName&&(CFG.hdris||[]).find(h=>h.default)?.name===b.dataset.name);
        b.classList.toggle('active',!!isActive);
      });
      // Mirrors all of the button-marking just above, but onto the matching
      // THUMBNAIL overlays an artist placed on the canvas (via the UI
      // Designer) instead of the side panel's own .vc/.pb2/.gb elements —
      // without this, a thumbnail representing the exact same default
      // action never showed as selected on page load, only after an actual
      // click applied it. Same comparisons as above, just resolved against
      // an overlay's own o.name/o.type instead of a button's dataset.
      (window.WCE_OVERLAYS||[]).forEach(o=>{
        const el=document.querySelector(`[data-overlay-id="${o.id}"]`);
        if(!el || !el.classList.contains('wce-overlay-thumb')) return;
        let isDefault=false;
        if(o.type==='variant'){
          isDefault = !!(_variantActive && o.name===_defaultVariantName);
        } else if(o.type==='mat_subset' && !_variantActive){
          const sub=(CFG.mat_subsets||[]).find(s=>s.name===o.name);
          isDefault = !!(sub && (CFG.default_mat_subsets||[]).some(dms=>dms.name===sub.name&&dms.category===sub.category));
        } else if(o.type==='global_set' && !_variantActive){
          const dgs=CFG.default_global_set;
          isDefault = !!(dgs && o.name===dgs.name);
        } else if(o.type==='geo_subset' && !_variantActive){
          const gp=(CFG.geometry_subsets||[]).find(g=>g.name===o.name);
          const pst=gp&&gp.state, dst=CFG.default_geo_state||{};
          isDefault = !!(pst && Object.keys(pst).length && Object.entries(pst).every(([p,c])=>dst[p]===c));
        } else if(o.type==='hdri'){
          isDefault = o.name===_hdriActiveName || (!_hdriActiveName && (CFG.hdris||[]).find(h=>h.default)?.name===o.name);
        }
        if(isDefault) el.classList.add('active');
      });
      if(typeof _wceSyncThumbHighlights==='function') _wceSyncThumbHighlights();
      root.visible=true;
      // Startup-phase text (the Designer's subBoot / default "READY") has
      // done its job now that the model is actually up — clear it so it
      // doesn't linger in the corner through the live view. Placed inside
      // this try block (not alongside the unconditional _resolveModelReady()
      // below) so it never wipes out the 'UI ERROR' text the catch just
      // below sets if this block itself fails.
      stEl.textContent='';
      requestRender(1000);   // ensure the freshly-loaded model is drawn
    }catch(uiErr){console.error('[WCE] UI error:',uiErr);stEl.textContent='UI ERROR';}
    // Unconditional — outside the try/catch above, so a failure in that
    // unrelated UI-highlighting code still lets the deferred HDRI proceed
    // to load rather than leaving _modelReadyPromise hanging forever.
    _resolveModelReady();
}

// Converts a variant name ('current'/'high'/'medium'/'low'/'verylow') into
// its actual file path. 'current' is the one irregular case — it's the
// plain default model file at the export root (or Normal subfolder), not a
// per-variant subfolder pattern like the other four. Folder names are an
// explicit map, not a generic capitalize-first-letter transform — 'verylow'
// needs "VeryLow" (capital L too), which a generic transform would get wrong.
const _WCE_VARIANT_FOLDER_NAMES = {high:'High', medium:'Medium', low:'Low', verylow:'VeryLow'};
function _wceVariantPath(variant){
  if(variant === 'current') return 'Highest/b645b7e8b94e.gltf';
  const token = CFG.model_token || 'Highest/b645b7e8b94e.gltf'.replace(/^.*\//,'').replace(/\.[^.]+$/,'');
  const ext = CFG.model_ext || 'Highest/b645b7e8b94e.gltf'.split('.').pop();
  const folderName = _WCE_VARIANT_FOLDER_NAMES[variant] || (variant.charAt(0).toUpperCase()+variant.slice(1));
  return folderName+'/'+token+'_'+variant+'.'+ext;
}

// ── Performance Stats Overlay ─────────────────────────────────────────────
// FPS/frame-time are measured directly via performance.now() deltas between
// frames — fully accurate, the same technique tools like stats.js use. CPU
// is the fraction of each frame's time budget actually spent doing work on
// the main thread (rendering + everything else in tick()) versus idle — a
// real, measured signal, not an estimate. GPU is the render-command
// execution time reported by the browser's own WebGL timer query extension
// where the browser supports it (inconsistent across browsers — some have
// deprecated it over timing-attack security concerns, so this always shows
// "unavailable" rather than a fake number when unsupported).
//
// Display refresh is throttled independently of frame-data collection — the
// graph buffer collects a new sample every single frame (so the graph line
// itself stays smooth and accurate), but the TEXT (FPS/ms/CPU/GPU numbers)
// only actually repaints roughly every 350ms, since repainting numbers on
// every rendered frame updates far faster than is actually readable.
const _WCE_STATS_TEXT_REFRESH_MS = 350;
let _wceStatsLastTextUpdate = 0;

function _wceStatsInitUI(){
  const btn = document.createElement('button');
  btn.id = 'wce-stats-toggle';
  btn.textContent = 'Show Statistics';
  _wceStatsApplyWinButtonStyle(btn);
  document.body.appendChild(btn);

  const panel = document.createElement('div');
  panel.id = 'wce-stats-panel';
  panel.style.cssText = 'position:fixed;z-index:10000;'+
    'background:rgba(240,240,240,.97);color:#111;border:1px solid #888;border-radius:4px;'+
    'padding:10px;font-family:Arial,Helvetica,sans-serif;font-size:12px;width:220px;display:none;'+
    'box-shadow:0 2px 8px rgba(0,0,0,.3);';
  panel.innerHTML =
    '<div id="wce-stats-drag" style="display:flex;justify-content:space-between;margin-bottom:8px;cursor:move;user-select:none;font-weight:bold">'+
      '<span>Performance</span>'+
      '<span id="wce-stats-close" style="cursor:pointer;padding:0 4px">✕</span>'+
    '</div>'+
    '<canvas id="wce-stats-graph" width="196" height="46" style="width:100%;display:block;background:#000;border-radius:2px;margin-bottom:8px"></canvas>'+
    '<div id="wce-stats-fps" style="font-size:20px;font-weight:bold;line-height:1.2"></div>'+
    '<div id="wce-stats-frametime" style="color:#555;margin-bottom:4px"></div>'+
    '<div id="wce-stats-cpu" style="color:#333"></div>'+
    '<div id="wce-stats-gpu" style="color:#333"></div>'+
    '<div id="wce-stats-render" style="color:#333;margin-top:4px;border-top:1px solid #ccc;padding-top:4px"></div>';
  document.body.appendChild(panel);

  // Default positions — button top-left, panel just below it.
  btn.style.left='16px'; btn.style.top='16px';
  panel.style.left='16px'; panel.style.top='56px';

  function _wceOpenPanel(){
    panel.style.display = 'block';
    _wceStats.enabled = true;
    _wceStats.frameTimes = []; _wceStats.lastFrameStart = null;
    sessionStorage.setItem('wce_stats_open', '1');
  }
  function _wceClosePanel(){
    panel.style.display = 'none';
    _wceStats.enabled = false;
    sessionStorage.removeItem('wce_stats_open');
  }

  btn.addEventListener('click', ()=>{
    if(btn.dataset.wceDragged === '1'){ btn.dataset.wceDragged=''; return; }   // a drag isn't a click
    const showing = panel.style.display !== 'none';
    if(showing) _wceClosePanel(); else _wceOpenPanel();
  });
  document.getElementById('wce-stats-close').onclick = _wceClosePanel;

  // Both draggable, moving as ONE linked pair — dragging either element
  // keeps their relative offset, so grabbing the button drags the panel
  // with it and vice versa, per the requested behavior.
  _wceStatsMakeDraggablePair(btn, panel);

  // Auto-reopens after a variant-switch page reload — sessionStorage
  // survives a full reload (unlike in-memory JS state), which a fresh
  // page load otherwise has no way to know about. This is the site's own,
  // independent exported output — a different context from Claude.ai's
  // own artifact-preview sandbox, where browser storage is disallowed.
  if(sessionStorage.getItem('wce_stats_open') === '1') _wceOpenPanel();
}

function _wceStatsApplyWinButtonStyle(btn){
  btn.style.cssText = 'position:fixed;z-index:10001;'+
    'font-family:Arial,Helvetica,sans-serif;font-size:12px;color:#000;'+
    'background:linear-gradient(to bottom,#f5f5f5,#e1e1e1);'+
    'border:1px solid #adadad;border-radius:2px;'+
    'padding:6px 12px;cursor:move;user-select:none;'+
    'box-shadow:inset 1px 1px 0 #fff, 1px 1px 2px rgba(0,0,0,.15);';
  btn.addEventListener('mousedown', ()=>{ btn.style.background='linear-gradient(to bottom,#e1e1e1,#d0d0d0)'; });
  window.addEventListener('mouseup', ()=>{ btn.style.background='linear-gradient(to bottom,#f5f5f5,#e1e1e1)'; });
}

function _wceStatsMakeDraggablePair(btn, panel){
  let dragging=false, lastX=0, lastY=0, moved=false;
  function onDown(e){
    dragging=true; moved=false; lastX=e.clientX; lastY=e.clientY;
    e.preventDefault();
  }
  btn.addEventListener('pointerdown', onDown);
  document.addEventListener('pointerdown', e=>{
    if(e.target.closest && e.target.closest('#wce-stats-drag')) onDown(e);
  });
  window.addEventListener('pointermove', e=>{
    if(!dragging) return;
    const dx=e.clientX-lastX, dy=e.clientY-lastY;
    if(Math.abs(dx)>2 || Math.abs(dy)>2) moved=true;
    lastX=e.clientX; lastY=e.clientY;
    [btn, panel].forEach(el=>{
      const r=el.getBoundingClientRect();
      el.style.left=(r.left+dx)+'px'; el.style.top=(r.top+dy)+'px';
    });
  });
  window.addEventListener('pointerup', ()=>{
    if(dragging && moved) btn.dataset.wceDragged='1';   // suppress the click that follows a real drag
    dragging=false;
  });
}

function _wceStatsRenderOverlay(){
  const canvas = document.getElementById('wce-stats-graph');
  if(!canvas) return;   // panel not yet built

  // Graph redraws every frame for smooth motion — only the text below is
  // throttled, since a scrolling line reads fine at full frame rate but
  // rapidly-changing numbers don't.
  const ctx = canvas.getContext('2d');
  const w=canvas.width, h=canvas.height;
  ctx.clearRect(0,0,w,h);
  const samples = _wceStats.frameTimes;
  if(samples.length>=2){
    const maxMs = Math.max(33, ...samples);
    const y60 = h - Math.min(1, 16.67/maxMs)*h;
    ctx.strokeStyle='rgba(0,0,0,.2)'; ctx.lineWidth=1; ctx.beginPath();
    ctx.moveTo(0,y60); ctx.lineTo(w,y60); ctx.stroke();
    ctx.strokeStyle='#2ecc40'; ctx.lineWidth=1.5; ctx.beginPath();
    samples.forEach((v,i)=>{
      const x=(i/(samples.length-1))*w, y=h-Math.min(1,v/maxMs)*h;
      if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    });
    ctx.stroke();
  }

  const now = performance.now();
  if(now - _wceStatsLastTextUpdate < _WCE_STATS_TEXT_REFRESH_MS) return;
  _wceStatsLastTextUpdate = now;

  const fpsEl = document.getElementById('wce-stats-fps');
  const fps = Math.round(_wceStats.fps);
  fpsEl.textContent = fps+' FPS';
  fpsEl.style.color = fps>=50 ? '#1a8a1a' : (fps>=30 ? '#c98a00' : '#c0392b');
  document.getElementById('wce-stats-frametime').textContent = _wceStats.frameTimeMs.toFixed(2)+' ms/frame';
  document.getElementById('wce-stats-cpu').textContent = 'CPU: '+_wceStats.cpuPct.toFixed(1)+'%';
  document.getElementById('wce-stats-gpu').textContent = _wceStats.gpuSupported
    ? ('GPU: '+(_wceStats.gpuMs!=null ? _wceStats.gpuMs.toFixed(2)+' ms' : '—'))
    : 'GPU: unavailable in this browser';
  // Three.js's own built-in counters — free to read, no extra render cost.
  // Calls is the actual draw call count for the last frame; geometries/
  // textures are how many currently live in GPU memory (both drop when
  // something gets disposed, e.g. an old material-clone swap).
  const _ri = renderer.info;
  document.getElementById('wce-stats-render').innerHTML =
    'Draw calls: '+_ri.render.calls+'<br>'+
    'Triangles: '+_ri.render.triangles.toLocaleString()+'<br>'+
    'Geometries: '+_ri.memory.geometries+' &nbsp; Textures: '+_ri.memory.textures;
}

// ── Top-center variant switcher ───────────────────────────────────────────
// Fully independent of the Statistics panel — switching variants never
// requires opening it. Every tier always shows in the same fixed layout;
// whichever weren't actually checked for this export appear visibly
// disabled/greyed rather than being omitted, keeping the layout consistent
// export to export. Clicking a variant does a genuine page reload with
// ?preview_variant=<key> — reusing the exact same, already-correct
// initialization path a fresh page load goes through, rather than trying
// to patch materials/armatures/textures into an already-running scene.
function _wceInitVariantSwitcher(){
  const available = CFG.available_variants || ['current'];
  const tiers = [
    {key:'current', label:'Highest'},
    {key:'high',    label:'High'},
    {key:'medium',  label:'Medium'},
    {key:'low',     label:'Low'},
    {key:'verylow', label:'Very Low'},
  ];
  const params = new URLSearchParams(window.location.search);
  const activeVariant = params.get('preview_variant') || 'current';

  const bar = document.createElement('div');
  bar.id = 'wce-variant-switcher';
  bar.style.cssText = 'position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:10000;'+
    'display:flex;gap:6px;font-family:Arial,Helvetica,sans-serif;';

  let dragging=false, moved=false, lastX=0, lastY=0;
  function onDown(e){
    dragging=true; moved=false; lastX=e.clientX; lastY=e.clientY;
    // Once dragged, positioning switches to plain left/top — the initial
    // centering transform only makes sense before the user has ever moved it.
    if(bar.style.transform){
      const r = bar.getBoundingClientRect();
      bar.style.transform = ''; bar.style.left=r.left+'px'; bar.style.top=r.top+'px';
    }
  }
  window.addEventListener('pointermove', e=>{
    if(!dragging) return;
    const dx=e.clientX-lastX, dy=e.clientY-lastY;
    if(Math.abs(dx)>2 || Math.abs(dy)>2) moved=true;
    lastX=e.clientX; lastY=e.clientY;
    const r=bar.getBoundingClientRect();
    bar.style.left=(r.left+dx)+'px'; bar.style.top=(r.top+dy)+'px';
  });
  window.addEventListener('pointerup', ()=>{ dragging=false; });

  tiers.forEach(t=>{
    const isAvailable = available.includes(t.key);
    const isActive = t.key === activeVariant;
    const b = document.createElement('button');
    b.textContent = t.label;
    b.disabled = !isAvailable;
    // Windows-button look, adapted per state: active = pressed-in (darker,
    // inset shadow), available = standard raised button, disabled = flat,
    // muted — matching how Windows itself renders a disabled control.
    if(!isAvailable){
      b.style.cssText = 'padding:6px 12px;font-size:11px;border-radius:2px;cursor:not-allowed;'+
        'font-family:Arial,Helvetica,sans-serif;color:#999;background:#e8e8e8;border:1px solid #ccc;';
    } else if(isActive){
      b.style.cssText = 'padding:6px 12px;font-size:11px;border-radius:2px;cursor:move;'+
        'font-family:Arial,Helvetica,sans-serif;color:#000;'+
        'background:linear-gradient(to bottom,#d8d8d8,#c3c3c3);border:1px solid #999;'+
        'box-shadow:inset 1px 1px 2px rgba(0,0,0,.25);';
    } else {
      b.style.cssText = 'padding:6px 12px;font-size:11px;border-radius:2px;cursor:move;'+
        'font-family:Arial,Helvetica,sans-serif;color:#000;'+
        'background:linear-gradient(to bottom,#f5f5f5,#e1e1e1);border:1px solid #adadad;'+
        'box-shadow:inset 1px 1px 0 #fff, 1px 1px 2px rgba(0,0,0,.15);';
    }
    b.addEventListener('pointerdown', onDown);   // every button can drag the bar, disabled or not
    if(isAvailable){
      b.addEventListener('click', ()=>{
        if(moved) return;   // a drag isn't a click — the pointerup handler already stopped the drag
        if(isActive) return;
        const url = new URL(window.location.href);
        if(t.key==='current') url.searchParams.delete('preview_variant');
        else url.searchParams.set('preview_variant', t.key);
        window.location.href = url.toString();
      });
    }
    bar.appendChild(b);
  });
  document.body.appendChild(bar);
}

// ── Device selector — Desktop / Mobile Portrait / Mobile Horizontal ────────
// Positioned at the top-right corner (right:16px;top:16px), mirroring
// exactly where the Statistics toggle already sits at the top-left
// (left:16px;top:16px) — a previous version positioned this next to the
// tier switcher instead, computed from its rendered width, which worked
// but didn't match that established "controls live in the corners" layout
// convention the rest of this debug UI already follows.
function _wceInitDeviceSwitcher(){
  const params = new URLSearchParams(window.location.search);
  const activeDevice = 'desktop';   // this code path never runs INSIDE the mobile frame itself
  const devices = [
    {key:'desktop',    label:'Desktop'},
    {key:'portrait',   label:'Mobile Portrait'},
    {key:'horizontal', label:'Mobile Horizontal'},
  ];

  const bar = document.createElement('div');
  bar.id = 'wce-device-switcher';
  bar.style.cssText = 'position:fixed;top:16px;right:16px;z-index:10000;'+
    'display:flex;gap:6px;font-family:Arial,Helvetica,sans-serif;';

  let dragging=false, moved=false, lastX=0, lastY=0;
  function onDown(e){
    dragging=true; moved=false; lastX=e.clientX; lastY=e.clientY;
    if(bar.style.transform && bar.style.transform!=='none'){
      const r = bar.getBoundingClientRect();
      bar.style.transform=''; bar.style.left=r.left+'px'; bar.style.top=r.top+'px';
    }
  }
  window.addEventListener('pointermove', e=>{
    if(!dragging) return;
    const dx=e.clientX-lastX, dy=e.clientY-lastY;
    if(Math.abs(dx)>2 || Math.abs(dy)>2) moved=true;
    lastX=e.clientX; lastY=e.clientY;
    const r=bar.getBoundingClientRect();
    bar.style.left=(r.left+dx)+'px'; bar.style.top=(r.top+dy)+'px';
  });
  window.addEventListener('pointerup', ()=>{ dragging=false; });

  devices.forEach(dv=>{
    const isActive = dv.key === activeDevice;
    const b = document.createElement('button');
    b.textContent = dv.label;
    if(isActive){
      b.style.cssText = 'padding:6px 12px;font-size:11px;border-radius:2px;cursor:move;'+
        'font-family:Arial,Helvetica,sans-serif;color:#000;'+
        'background:linear-gradient(to bottom,#d8d8d8,#c3c3c3);border:1px solid #999;'+
        'box-shadow:inset 1px 1px 2px rgba(0,0,0,.25);';
    } else {
      b.style.cssText = 'padding:6px 12px;font-size:11px;border-radius:2px;cursor:move;'+
        'font-family:Arial,Helvetica,sans-serif;color:#000;'+
        'background:linear-gradient(to bottom,#f5f5f5,#e1e1e1);border:1px solid #adadad;'+
        'box-shadow:inset 1px 1px 0 #fff, 1px 1px 2px rgba(0,0,0,.15);';
    }
    b.addEventListener('pointerdown', onDown);
    if(!isActive){
      b.addEventListener('click', ()=>{
        if(moved) return;
        if(dv.key==='desktop') return;   // already here — Mobile navigates TO the wrapper, Desktop has no wrapper to leave
        const url = new URL(window.location.origin+'/__wce_mobile__');
        url.searchParams.set('device', dv.key);
        const variant = params.get('preview_variant');
        if(variant) url.searchParams.set('preview_variant', variant);
        window.location.href = url.toString();
      });
    }
    bar.appendChild(b);
  });
  document.body.appendChild(bar);
}

// Two-stage mobile detection, shared by the variant-tier cap below and the
// phone/tablet zoom lock: touch alone is NOT enough — a touch-enabled
// Windows/macOS laptop still has a real desktop-class GPU and a mouse or
// trackpad it can fall back on, so it must never get bucketed the same way
// a phone or tablet does. Test 1 (hover) already excludes those laptops in
// the overwhelming majority of cases (their trackpad/mouse reports real
// hover support even with a touchscreen present) — Test 2 (OS) is the
// backstop for the remaining edge cases (e.g. a 2-in-1 currently in tablet
// mode with no pointer attached), so only a device that BOTH lacks hover
// AND is actually running a mobile OS ever counts as mobile. iPads/Android
// tablets deliberately land in the same bucket as phones here — they don't
// have real discrete/desktop-class GPUs either, so the same caps apply.
function _wceIsMobileOS(){
  const ua = navigator.userAgent || '';
  if(/Android/i.test(ua)) return true;
  if(/iPhone|iPod|iPad/i.test(ua)) return true;
  // Modern iPadOS (13+) masquerades as desktop Safari on "Macintosh" in the
  // UA string — a real Mac never reports multi-touch, so that's the only
  // remaining way to tell them apart.
  if(navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1) return true;
  return false;
}
function _wceIsMobileDevice(){
  // Test override: ?preview_device=mobile (or phone / tablet) behaves as a phone for every rule that asks, ?preview_device=desktop as a computer.
  // It changes the decisions only (effects, tier cap, zoom lock, anti-aliasing, ocean), never the page layout, which comes from CSS.
  try{
    const _pd=new URLSearchParams(window.location.search).get('preview_device');
    if(_pd==='mobile' || _pd==='phone' || _pd==='tablet') return true;
    if(_pd==='desktop') return false;
  }catch(_e){}
  const hasHover = window.matchMedia('(hover: hover)').matches;
  if(hasHover) return false;   // Test 1: real hover present — a capable laptop/desktop, touchscreen or not
  return _wceIsMobileOS();     // Test 2: no hover — only actually mobile if the OS agrees
}

// Heuristic only — there's no reliable way to read a visitor's actual GPU
// strength from the browser. Touch-only (no real hover) is the strongest
// available signal for phone/tablet; CPU core count is broadly supported;
// device memory is Chrome/Edge-only (undefined elsewhere), so it can only
// ever refine the guess, never be depended on alone.
//
// Score-based, not fixed thresholds: a hardcoded set of cutoffs (e.g. "≤4
// cores → Medium, >4 → Default") silently breaks depending on which
// variants happen to be checked for a given export — a tier the thresholds
// never produce as an output is unreachable even if it was exported, and
// which tier that is changes depending on the combination. Computing a
// continuous 0-100 score and distributing it evenly across however many
// variants are ACTUALLY available guarantees every checked combination is
// fully reachable, regardless of which subset of Default/High/Medium/Low/
// Very Low that turns out to be.
function _wceDetectDeviceTier(){
  const cores = navigator.hardwareConcurrency || 4;
  const mem = navigator.deviceMemory;   // undefined on Safari/Firefox

  let score = Math.min(100, Math.max(0, (cores-2)/(16-2)*100));
  if(mem !== undefined){
    const memScore = Math.min(100, Math.max(0, (mem-2)/(16-2)*100));
    score = (score+memScore)/2;
  }

  const order = ['verylow','low','medium','high','current'];
  let eligible = order.filter(v => (CFG.available_variants||['current']).includes(v));
  if(eligible.length === 0){
    // Nothing in the standard tier order matched what was actually
    // exported. Rather than assuming 'current' exists — an artist can
    // legitimately export only a specific tier (e.g. only Medium) and never
    // 'current' at all, and hardcoding 'current' here would then resolve to
    // a variant that was never actually built — fall back to whatever
    // CFG.available_variants genuinely lists, only reaching for 'current'
    // as an absolute last resort if that's empty too.
    eligible = (CFG.available_variants && CFG.available_variants.length) ? CFG.available_variants.slice() : ['current'];
  }

  // Genuinely mobile devices (phones/tablets — see _wceIsMobileDevice above)
  // never exceed Medium — capped here regardless of score, not by clamping
  // the score itself, so a mobile device with a high capability score still
  // lands on the BEST tier available up to (and never past) Medium, rather
  // than being pushed toward Low/Very Low unnecessarily.
  if(_wceIsMobileDevice()){
    const mIdx = eligible.indexOf('medium');
    if(mIdx !== -1) eligible = eligible.slice(0, mIdx+1);
    else eligible = eligible.filter(v => v === 'low' || v === 'verylow');
    if(eligible.length === 0){
      // Same reasoning as the fallback above — don't assume anything
      // exists that isn't actually in CFG.available_variants.
      const _capFallback = order.filter(v=>(CFG.available_variants||['current']).includes(v));
      eligible = _capFallback.length ? [_capFallback[0]]
        : ((CFG.available_variants && CFG.available_variants.length) ? [CFG.available_variants[0]] : ['current']);
    }
  }

  const bucket = 100/eligible.length;
  const idx = Math.min(eligible.length-1, Math.floor(score/bucket));
  return eligible[idx];
}

// View Online can pass ?preview_variant=high/medium/low/current to force a
// specific variant for manual preview — takes priority over auto-detection
// whenever present. With no override (a real visitor, not a preview
// session), the variant is chosen automatically from detected device
// capability instead. _wceDetectDeviceTier() already only ever selects from
// CFG.available_variants, so its result is always valid — no separate
// fallback/re-check needed on top of it.
function _wceResolveModelFile(){
  const params = new URLSearchParams(window.location.search);
  const forced = params.get('preview_variant');
  const variant = forced ? forced : _wceDetectDeviceTier();
  return _wceVariantPath(variant);
}
const _actualModelFile = _wceResolveModelFile();

if(window.WCE_DESIGNER_MODE){

// ── SCENE HELPERS ────────────────────────────────────────────────────────

function findNode(name){
  let res=null;
  const s=name.replace(/ /g,'_');
  if(root) root.traverse(o=>{if(o.name===name||o.name===s) res=o;});
  if(res) return res;
  // Blender's glTF exporter doesn't consistently pick ONE treatment for the
  // dot in a Blender-auto-numbered duplicate name (e.g. "shell#370.001") --
  // sometimes it becomes an underscore ("shell#370_001", tried first below,
  // since that was the first confirmed case), and sometimes the dot is
  // stripped with nothing put in its place ("shell#370001"), confirmed
  // directly against a real export -- a name with no dot is untouched
  // either way, so both are safe, exact-match-only fallbacks (see
  // _wceSectionFindExact, which already relies on the same two
  // substitutions for Section View bounds objects). Without this, any
  // part/light whose Blender name happens to end in ".001"/".002"/etc.
  // could silently fail every findNode() lookup -- GEO_TOGGLE, geo
  // subsets, variants -- while an identically-configured part with no dot
  // in its name works fine, which is exactly what makes this bug so easy
  // to miss.
  const dotSan=name.replace(/\./g,'_');
  const dotStrip=name.replace(/\./g,'');
  if(dotSan===name && dotStrip===name) return null;
  const dotSanS=dotSan.replace(/ /g,'_');
  const dotStripS=dotStrip.replace(/ /g,'_');
  if(root) root.traverse(o=>{if(o.name===dotSan||o.name===dotSanS||o.name===dotStrip||o.name===dotStripS) res=o;});
  return res;
}

// GEO_TOGGLE/GEO_FLICKER need this fallback specifically for Area lights:
// findNode() only searches inside root (the glTF model's own hierarchy), but
// Area lights are rebuilt as RectAreaLights added directly to the top-level
// scene (see the area_lights loader) — siblings of root, not descendants of
// it, so a plain findNode() call can never see them.
function _findGeoTarget(name){
  const n=findNode(name);
  if(n) return n;
  const s=name.replace(/ /g,'_');
  return _areaLights.find(l=>l.name===name||l.name===s) || null;
}

function applyVariant(name){

          qsa('.pb2[data-sc]').forEach(x=>x.classList.remove('active'));b.classList.add('active');refreshAdvMat(s.state);};
        g.appendChild(b);});
      sms.appendChild(g);
    });
  }else buildMatSubs();
  document.getElementById('vl').textContent=name.replace(/_/g,' ').toUpperCase();
  buildAdvGeo();refreshAdvMat(matSt);refreshActive();
  try{ window._wceVariantLast={name:name, st:_wceStateSig()}; }catch(e){}
}
function applyMatSubset(st,categoryKey){Object.entries(st).forEach(([c,m0])=>{const m=_wceResolveWantedMat(c,m0);applyMat(c,m,categoryKey);matSt[c]=m;});refreshActive();if(typeof _updateAnnotationVisibility==='function')_updateAnnotationVisibility();
  try{ window._wceMatSetLast={sig:JSON.stringify(st), st:_wceStateSig()}; }catch(e){}}
function resolveMatName(n){return(CFG.mat_name_map&&CFG.mat_name_map[n])?CFG.mat_name_map[n]:n;}
// -- Missing-material fallback -----------------------------------------------
// A Mat Subset / Global Set / Variant stores a snapshot of {container: material}. If that
// material was later removed from the container (or never made it into the model), applyMat finds
// nothing and silently does nothing -- leaving the container on its blank pass-through placeholder.
// Every caller that applies a *wanted* value now runs it through this first: a name that is not in
// the loaded model is replaced by the container's first option that is, with a console warning,
// and matSt then records what was really applied.
function _wceMatResolvable(m){ return !!m && !!(matMap[resolveMatName(m)]||matMap[m]); }
function _wceContainerOpts(c){
  const all=CFG.containers_all||{};
  if(all[c]) return all[c];
  const up=String(c).toUpperCase(), bare=up.indexOf('MAT_')===0?up.slice(4):up;
  const ks=Object.keys(all);
  for(let i=0;i<ks.length;i++){
    const ku=ks[i].toUpperCase(), kb=ku.indexOf('MAT_')===0?ku.slice(4):ku;
    if(kb===bare) return all[ks[i]];
  }
  return [];
}
const _wceMatFallbackSeen={};
function _wceResolveWantedMat(c,m){
  if(typeof m!=='string' || !m || _wceMatResolvable(m)) return m;
  const fb=_wceContainerOpts(c).find(_wceMatResolvable);
  if(!fb) return m;   // light-linked label / unknown container: nothing real to fall back to
  const k=c+'|'+m;
  if(!_wceMatFallbackSeen[k]){
    _wceMatFallbackSeen[k]=1;
    console.warn('[WCE] Material "'+m+'" for container "'+c+'" was not found in the model -- falling back to "'+fb+'" (re-Sync and re-save the subset).');
  }
  return fb;
}
const cloneCache={};
function _wceGetMatClone(container,matName,srcMat,resolved,needsAO){
  // AO is baked per-mesh vertex data, entirely independent of which
  // color/option a container is showing — a single container can
  // perfectly well span both AO-baked and non-baked parts at once. So
  // each (container, option) pair gets up to TWO clones here, one for
  // meshes with baked AO and one for meshes without, rather than one
  // shared instance whose vertexColors flag would otherwise have to be
  // fought over by whichever mesh happened to touch it last.
  const key=needsAO?'ao':'plain';
  if(!cloneCache[container]) cloneCache[container]={};
  if(!cloneCache[container][matName]) cloneCache[container][matName]={};
  if(!cloneCache[container][matName][key]){
    const clone=srcMat.clone();
    clone.name=srcMat.name+'__wce_'+container+'_'+matName+(needsAO?'_ao':'');
    clone.vertexColors=needsAO;
    // A freshly-created clone otherwise has no clippingPlanes at all,
    // regardless of whether Section View cuts are already active when a
    // visitor picks a new paint color afterward — _wceSectionRebuild()
    // only ever iterates the meshes that already existed at the time it
    // last ran, so it can't retroactively reach a clone made after it.
    if(typeof _sectionActivePlanes!=='undefined' && _sectionActivePlanes.length) clone.clippingPlanes=_sectionActivePlanes;
    const pbr=(CFG.mat_colors||{})[matName]||(CFG.mat_colors||{})[resolved];
    if(pbr){
      if(pbr.color) clone.color.setRGB(pbr.color[0],pbr.color[1],pbr.color[2]);
      if(pbr.metallic!=null) clone.metalness=pbr.metallic;
      if(pbr.roughness!=null) clone.roughness=pbr.roughness;
      if(pbr.emissive) clone.emissive.setRGB(pbr.emissive[0],pbr.emissive[1],pbr.emissive[2]);
      if(pbr.emissiveIntensity!=null) clone.emissiveIntensity=pbr.emissiveIntensity;
      // Clearcoat/sheen/transmission/ior/specular: no-ops on a plain (non-physical)
      // material, since it has no such property to set -- correcting them here is
      // still needed on any material that DOES have them, or they'd stay at
      // whichever raw value the clone inherited, uncorrected forever.
      if(pbr.clearcoat!=null) clone.clearcoat=pbr.clearcoat;
      if(pbr.clearcoatRoughness!=null) clone.clearcoatRoughness=pbr.clearcoatRoughness;
      if(pbr.sheen!=null) clone.sheen=pbr.sheen;
      if(pbr.sheenRoughness!=null) clone.sheenRoughness=pbr.sheenRoughness;
      if(pbr.transmission!=null) clone.transmission=pbr.transmission;
      if(pbr.ior!=null) clone.ior=pbr.ior;
      if(pbr.specularIntensity!=null) clone.specularIntensity=pbr.specularIntensity;
    }
    clone.needsUpdate=true;
    // Snapshot the intended target so transitions always lerp toward the true
    // destination (not a value left over from an interrupted tween). ||0 below is
    // only a NaN guard for a plain material with no such property at all -- it has
    // no visual effect there either way, since the property does nothing on it.
    clone.userData.wceTarget={
      color:clone.color.clone(),
      metalness:clone.metalness,
      roughness:clone.roughness,
      emissive:(clone.emissive?clone.emissive.clone():new THREE.Color(0,0,0)),
      clearcoat:clone.clearcoat||0,
      clearcoatRoughness:clone.clearcoatRoughness||0,
      sheen:clone.sheen||0,
      sheenRoughness:clone.sheenRoughness||0,
      transmission:clone.transmission||0,
      ior:clone.ior||0,
      specularIntensity:clone.specularIntensity||0,
    };
    cloneCache[container][matName][key]=clone;
  }
  return cloneCache[container][matName][key];
}
function applyMat(container,matName,categoryKey){
  // Already in this exact state -- clicking (or a sequence/overlay
  // re-applying) the same value again should do nothing at all, not
  // replay a Dissolve/Wave/Scale/Flip transition pointlessly. matSt is
  // kept in sync by every single caller immediately after calling
  // applyMat, so this always reflects the true current value here.
  if(matSt[container]===matName) return;
  if(!root){
    console.error('[WCE DIAGNOSTIC] applyMat FAILED — no root loaded yet. container:', container, '| matName:', matName);
    return;
  }
  // Keep the AR clone's materials in sync with the live root.
  if(typeof _arModel!=='undefined' && _arModel && root){
    const srcM=[]; root.traverse(o=>{if(o.isMesh)srcM.push(o);});
    const dstM=[]; _arModel.traverse(o=>{if(o.isMesh)dstM.push(o);});
    srcM.forEach((sm,i)=>{if(dstM[i])dstM[i].material=sm.material;});
  }

  const srcMat=matMap[resolved]||matMap[matName];

  // Mesh-material swap: only runs if a real material was actually found. A
  // light-linked container's values are plain string labels with no
  // corresponding material at all, by design -- this is expected to find
  // nothing and skip for those, NOT abort the whole function (that was the
  // earlier bug: this early-return also unconditionally blocked the
  // light-update path below, for every light-linked container, always).
  if(srcMat){
    let cu=container.toUpperCase();if(cu.startsWith('MAT_')) cu=cu.slice(4);
    const target='MAT_'+cu;
    function slotMatches(n){const u=n.toUpperCase();return u===target||u.startsWith(target+'.')||u===cu||u.startsWith(cu+'.');}

    // Materials Transition Type: a category (or Global Sets) can override
    // the global default -- categoryKey is '__global_sets__' for a Global
    // Set, the real category name for a Material Subset, or unset/null for
    // anything applied with no category context at all (e.g. the
    // Individual Materials advanced per-container picker), which always
    // just uses the global default since there's no category to look up.
    // An override entry is a small self-contained object (type plus
    // whichever direction/crossfade field that type uses) -- falling back
    // to the matching mat_* global field only when there's no override at
    // all, never mixing an override's type with the global's own options.
    const _matOverrides=CFG.mat_category_transition_overrides||{};
    const _containerOverrides=CFG.mat_container_transition_overrides||{};
    const _containerEntry=_containerOverrides[container] || null;
    // A direct material change (no categoryKey at all) always uses this container's own
    // override, if it has one. A Subset/Global Set change (categoryKey set) checks that
    // category's own override first; only when the category has none of its own does a
    // container's override get consulted at all, and even then only if that container's own
    // Scope is set to "Global override" (WCE_ContainerItem.override_scope) -- "Override when
    // triggered" (the default) never reaches a Subset/Global Set change, no matter what.
    const _overrideEntry = categoryKey
      ? ((_matOverrides[categoryKey]) || (_containerEntry && _containerEntry.global ? _containerEntry : null))
      : _containerEntry;
    const _trans=CFG.transitions||{};
    // A duration-only override (Override Transition off, Override Duration on) has no 'type'
    // of its own -- only borrow the direction/crossfade fields alongside an override that
    // actually set one, so a duration-only override still uses the global transition style.
    const _typeOverridden=!!(_overrideEntry && _overrideEntry.type);
    const matType=(_typeOverridden && _overrideEntry.type) || _trans.mat_type || 'crossfade';
    const opts={
      wave_direction:  _typeOverridden ? _overrideEntry.wave_direction  : _trans.mat_wave_direction,
      scale_direction: _typeOverridden ? _overrideEntry.scale_direction : _trans.mat_scale_direction,
      flip_direction:  _typeOverridden ? _overrideEntry.flip_direction  : _trans.mat_flip_direction,
      add_crossfade:   _typeOverridden ? !!_overrideEntry.add_crossfade : !!_trans.mat_add_crossfade,
    };
    // Independent of the type override above -- a category/container can override just the
    // timing and keep the global transition style, or vice versa.
    const matDur=(_overrideEntry && _overrideEntry.duration_ms!=null) ? _overrideEntry.duration_ms : (_TRANS.mat_ms??300);

    // Gather every mesh with a slot this container touches, and its OLD
    // material(s), before any swap happens -- Dissolve/Wave/Scale/Flip all
    // need the pre-swap state, not just Crossfade.
    const meshRecs=[];
    root.traverse(o=>{
      if(!o.isMesh) return;
      const orig=o.userData.origMatNames||[];
      const wasArr=Array.isArray(o.material);
      const oldSlots=wasArr?[...o.material]:[o.material];
      const matchIdx=[];
      for(let i=0;i<orig.length;i++){ if(slotMatches(orig[i])) matchIdx.push(i); }
      if(matchIdx.length) meshRecs.push({mesh:o, wasArr, oldSlots, matchIdx});
    });

    if(meshRecs.length){
      // Each mesh gets whichever clone variant (AO or plain) actually matches
      // its own geometry -- never one shared instance mutated to fit
      // whichever mesh happened to be processed last. Cloning + assigning
      // the new slots happens up front regardless of transition type; WHEN
      // meshRecs[i].mesh.material actually gets set to them differs below.
      const usedClones=new Set();
      const hasAOCache=new Map();
      meshRecs.forEach(rec=>{
        const o=rec.mesh;
        if(!hasAOCache.has(o)) hasAOCache.set(o, !!(o.geometry&&o.geometry.hasAttribute('color')));
        const hasAO=hasAOCache.get(o);
        const slots=rec.wasArr?[...o.material]:[o.material];
        rec.matchIdx.forEach(i=>{
          const clone=_wceGetMatClone(container,matName,srcMat,resolved,hasAO);
          slots[i]=clone;
          usedClones.add(clone);
        });
        rec.newSlots=slots;
      });

      // Shared by plain Crossfade AND by Scale/Flip's own Add Crossfade
      // option -- same colour/metallic/roughness/emissive lerp either way,
      // just possibly running alongside a transform tween instead of alone.
      // Snaps if the maps differ (can't lerp across different textures).
      function runCrossfade(){
        let fromMat=null;
        meshRecs.forEach(rec=>{ if(fromMat) return; rec.matchIdx.forEach(i=>{ if(!fromMat) fromMat=rec.oldSlots[i]; }); });
        usedClones.forEach(m=>{
          if(fromMat && fromMat!==m && (fromMat.map||null)===(m.map||null)){
            const to=m.userData.wceTarget||{color:m.color.clone(),metalness:m.metalness,roughness:m.roughness,emissive:(m.emissive?m.emissive.clone():new THREE.Color(0,0,0)),clearcoat:m.clearcoat||0,clearcoatRoughness:m.clearcoatRoughness||0,sheen:m.sheen||0,sheenRoughness:m.sheenRoughness||0,transmission:m.transmission||0,ior:m.ior||0,specularIntensity:m.specularIntensity||0};
            const from={color:fromMat.color.clone(),metalness:fromMat.metalness,roughness:fromMat.roughness,emissive:(fromMat.emissive?fromMat.emissive.clone():new THREE.Color(0,0,0)),clearcoat:fromMat.clearcoat||0,clearcoatRoughness:fromMat.clearcoatRoughness||0,sheen:fromMat.sheen||0,sheenRoughness:fromMat.sheenRoughness||0,transmission:fromMat.transmission||0,ior:fromMat.ior||0,specularIntensity:fromMat.specularIntensity||0};
            m.color.copy(from.color);
            m.metalness=from.metalness; m.roughness=from.roughness;
            if(m.emissive) m.emissive.copy(from.emissive);
            m.clearcoat=from.clearcoat; m.clearcoatRoughness=from.clearcoatRoughness;
            m.sheen=from.sheen; m.sheenRoughness=from.sheenRoughness;
            m.transmission=from.transmission; m.ior=from.ior; m.specularIntensity=from.specularIntensity;
            for(let i=_matTweens.length-1;i>=0;i--) if(_matTweens[i].mat===m) _matTweens.splice(i,1);
            _matTweens.push({mat:m,from,to,t:0,dur:matDur});
            _bumpAnim(matDur+150);
          }
        });
      }

      // Before the model has actually been revealed to the viewer (still
      // behind the loading screen), snap instantly regardless of which
      // transition type is configured -- same guard applyGeoToggle
      // already uses for its own dissolve-vs-snap decision. Without this,
      // establishing the default material state on load played the full
      // configured transition from whatever blank/placeholder material
      // the model happens to ship with, visibly, before the first real
      // frame the viewer ever sees -- a live click after load is
      // completely unaffected by this, root.visible is true by then.
      const _effType = root.visible ? matType : 'none';

      // Whatever effect this trigger uses, first finish any Dissolve/Wave still
      // running on these meshes (previously only the Dissolve/Wave branch did, so a
      // Crossfade/Scale/Flip/instant swap left the old wave animating on top).
      meshRecs.forEach(rec=>{ _wceCancelMatDissolveOn(rec.mesh); });
      // Safety net: a cached colour clone must never carry a stale wave clip plane
      // into a new swap, whatever path left it behind.
      const _wceSlotSeen=new Set();
      meshRecs.forEach(rec=>{
        rec.oldSlots.concat(rec.newSlots||[]).forEach(m=>{
          if(!m || _wceSlotSeen.has(m)) return;
          _wceSlotSeen.add(m);
          if(m.userData && m.userData.wceWaveClip && !_wceMatInActiveTween(m)) _wceResetTransMat(m,rec.mesh);
        });
      });

      if(_effType==='crossfade'){
        meshRecs.forEach(rec=>{ rec.mesh.material=rec.wasArr?rec.newSlots:rec.newSlots[0]; });
        runCrossfade();
      } else if(_effType==='dissolve' || _effType==='wave'){
        // Overlay clone holds the OLD material and dissolves out (or wipes
        // out, for Wave) while the real mesh -- now showing the NEW
        // material -- dissolves/wipes in. Texture-agnostic either way,
        // since it's fading two separate material instances, not lerping
        // shared shader uniforms. depthWrite is OFF on both for the
        // duration: with identical geometry/position/scale, both writing
        // depth at an identical depth is a self z-fight -- unstable and
        // GPU-precision-dependent frame to frame -- which is what made this
        // look like an instant snap to the target, then a flicker of the
        // old material seeming to play in reverse, then a second snap at the end.
        const dur=matDur;
        // ONE sweep for the whole container. Every mesh of a container shares the same
        // cached material, and a material can only hold one set of clip planes, so the
        // old per-mesh sweeps overwrote each other: only the last mesh's range actually
        // drove the visuals -- parts outside it flipped instantly (above) or waited
        // for the final cleanup frame and snapped (below). One box around ALL the
        // container's meshes, and one shared plane pair, fixes that.
        let _wg=null;
        if(matType==='wave'){
          const gb=new THREE.Box3(), tb=new THREE.Box3();
          meshRecs.forEach(r=>{ tb.setFromObject(r.mesh); if(!tb.isEmpty()) gb.union(tb); });
          if(gb.isEmpty()) gb.set(new THREE.Vector3(-0.5,-0.5,-0.5),new THREE.Vector3(0.5,0.5,0.5));
          const size=new THREE.Vector3(); gb.getSize(size);
          const waveCenter=new THREE.Vector3(); gb.getCenter(waveCenter);
          // waveDir points toward the START side of the reveal (the side that still
          // shows the OLD material at t=0) -- e.g. top_bottom starts at the top.
          const dirMap={top_bottom:[0,1,0], bottom_top:[0,-1,0], left_right:[-1,0,0], right_left:[1,0,0], front_back:[0,0,1], back_front:[0,0,-1]};
          const dv=dirMap[opts.wave_direction]||dirMap.top_bottom;
          const axisIdx=dv[0]!==0?0:(dv[1]!==0?1:2);
          const sizeArr=[size.x,size.y,size.z];
          // A paper-thin axis has no distance to sweep (looks like an instant snap), so
          // fall back to the container's most extended other axis.
          const others=[0,1,2].filter(a=>a!==axisIdx);
          const maxOther=Math.max(sizeArr[others[0]],sizeArr[others[1]]);
          let useAxis=axisIdx;
          if(sizeArr[axisIdx] < maxOther*0.15){
            useAxis = sizeArr[others[0]]>=sizeArr[others[1]] ? others[0] : others[1];
          }
          const axisVec=[[1,0,0],[0,1,0],[0,0,1]][useAxis];
          const sign=(dv[0]||dv[1]||dv[2])<0?-1:1;
          const waveDir=new THREE.Vector3(axisVec[0]*sign,axisVec[1]*sign,axisVec[2]*sign);
          const waveHalf=sizeArr[useAxis]/2 || 0.5;
          // Placed at their correct t=0 position immediately (a bare Plane passes
          // through the world origin and would clip wrongly for a frame).
          const posOld0=waveCenter.clone().addScaledVector(waveDir,waveHalf);
          // Old's normal points AWAY from the start side, New's TOWARD it.
          const wavePlaneOld=new THREE.Plane(waveDir.clone().negate(),0);
          wavePlaneOld.setFromNormalAndCoplanarPoint(waveDir.clone().negate(),posOld0);
          const wavePlaneNew=new THREE.Plane(waveDir.clone(),0);
          wavePlaneNew.setFromNormalAndCoplanarPoint(waveDir,posOld0);
          // One reference mesh for the whole container's sweep (every mesh's tween shares the same
          // plane pair, so they must all carry the planes along with the SAME frame): the sweep
          // follows it if the animation moves it. refInv is its world matrix at the click.
          const refMesh=meshRecs[0].mesh;
          let refInv=null;
          try{
            refMesh.updateWorldMatrix(true,false);
            if(Math.abs(refMesh.matrixWorld.determinant())>1e-12) refInv=refMesh.matrixWorld.clone().invert();
          }catch(e){ refInv=null; }
          _wg={wavePlaneOld, wavePlaneNew, waveCenter, waveDir, waveHalf, refMesh, refInv};
          if(renderer && !renderer.localClippingEnabled) renderer.localClippingEnabled=true;
        }
        meshRecs.forEach(rec=>{
          const mesh=rec.mesh;
          // (In-flight transitions on this mesh were already finished above, for every
          // mesh up front -- not one mesh at a time, which let a later mesh's reset wipe
          // a shared material that an earlier mesh had just set up.)
          // Follows the real mesh every frame (skeleton, shape keys, transform) -- see _wceMakeTransOverlay.
          const overlay=_wceMakeTransOverlay(mesh, rec.wasArr?rec.oldSlots.map(m=>m):rec.oldSlots[0]);
          const overlaySlots=Array.isArray(overlay.material)?overlay.material:[overlay.material];
          const meshSlotsNow=rec.wasArr?rec.newSlots:[rec.newSlots[0]];
          let wavePlaneOld=null, wavePlaneNew=null, waveCenter=null, waveDir=null, waveHalf=0, refMesh=null, refInv=null;
          if(_wg){ wavePlaneOld=_wg.wavePlaneOld; wavePlaneNew=_wg.wavePlaneNew; waveCenter=_wg.waveCenter; waveDir=_wg.waveDir; waveHalf=_wg.waveHalf; refMesh=_wg.refMesh; refInv=_wg.refInv; }
          rec.matchIdx.forEach(i=>{
            const om=overlaySlots[i], nm=meshSlotsNow[i];
            if(om===nm) return;   // same material on both sides: nothing to blend (would clip/hide it outright)
            if(matType==='wave'){
              // depthWrite stays untouched (true, as normal) here -- with
              // Old and New's clip regions now correctly complementary
              // (never both visible at the same pixel), there's no actual
              // z-fight left to avoid: whichever one isn't clipped away at
              // a given pixel is the ONLY one that reaches the depth test
              // there. Forcing depthWrite=false here was disabling proper
              // depth writes over a large, contiguous, growing region for
              // the whole transition -- which is what was corrupting
              // shadows/occlusion against the rest of the scene, reported
              // as broken-looking geometry.
              // Section View's cut planes are kept alongside the wave plane (not replaced).
              const _secP=_wceSectionPlanesFor(mesh)||[];
              om.clippingPlanes=[wavePlaneOld].concat(_secP); om.clipShadows=true; om.userData.wceWaveClip=true;
              nm.clippingPlanes=[wavePlaneNew].concat(_secP); nm.clipShadows=true; nm.userData.wceWaveClip=true;
            } else {
              // Dissolve genuinely needs depthWrite=false: alphaHash discards
              // a randomly-dithered FRACTION of pixels based on opacity, not
              // a hard region -- every covered pixel would otherwise still
              // write full depth despite only partially covering, corrupting
              // depth test results against itself as opacity changes frame
              // to frame. Wave has no such partial-coverage-at-full-depth
              // problem, since a clipped pixel is discarded outright, never
              // reaching the depth test at all.
              om.alphaHash=true; om.transparent=false; om.depthWrite=false; om.opacity=1; om.needsUpdate=true;
              nm.alphaHash=true; nm.transparent=false; nm.depthWrite=false; nm.opacity=0; nm.needsUpdate=true;
            }
          });
          _matDissolveTweens.push({
            overlay, mesh, matchIdx:rec.matchIdx, overlaySlots, meshSlots:meshSlotsNow,
            wave: matType==='wave', wavePlaneOld, wavePlaneNew, waveCenter, waveDir, waveHalf, refMesh, refInv,
            t:0, dur,
          });
          mesh.material=rec.wasArr?rec.newSlots:rec.newSlots[0];
        });
        if(matType==='wave'){
          // First use of a clip plane on a material needs new shader programs; compile them NOW
          // (before the first animated frame) so that stall isn't spent inside the wave itself,
          // then restart the transition clock so the stall isn't counted either.
          try{ if(typeof renderer!=='undefined' && renderer && typeof cam!=='undefined' && typeof scene!=='undefined') renderer.compile(scene,cam); }catch(e){}
          _lastTransT=performance.now();
          // The animation mixer has its own clock (_tickMixers -> _clock.getDelta()). Left alone, the
          // whole compile stall lands in the NEXT mixer step as one huge delta, so a playing animation
          // jumps ahead while the wave (whose clock is restarted above) does not -- the "freeze, then
          // jump" seen when a wave runs together with an animation. Swallow the stall here too.
          try{ _clock.getDelta(); }catch(e){}
        }
        _bumpAnim(dur+200);
      } else if(_effType==='scale'){
        // Material swap is instant (or crossfades, with Add Crossfade); a
        // brief scale pop masks it either way, independent of whether the
        // two materials share a texture or not.
        const dur=matDur;
        meshRecs.forEach(rec=>{
          rec.mesh.material=rec.wasArr?rec.newSlots:rec.newSlots[0];
          for(let i=_scaleTweens.length-1;i>=0;i--) if(_scaleTweens[i].mesh===rec.mesh) _scaleTweens.splice(i,1);
          _scaleTweens.push({mesh:rec.mesh, base:rec.mesh.scale.clone(), grow:(opts.scale_direction==='grow'), t:0, dur});
        });
        if(opts.add_crossfade) runCrossfade();
        _bumpAnim(dur+150);
      } else if(_effType==='flip'){
        // Mesh rotates edge-on to the camera and back; the material swap
        // (instant, or crossfading, with Add Crossfade) happens at the
        // midpoint, while it's effectively invisible.
        const dur=matDur;
        const vertical=(opts.flip_direction==='vertical');
        meshRecs.forEach(rec=>{
          const mesh=rec.mesh;
          for(let i=_flipTweens.length-1;i>=0;i--) if(_flipTweens[i].mesh===mesh) _flipTweens.splice(i,1);
          _flipTweens.push({mesh, vertical, baseY:mesh.rotation.y, baseX:mesh.rotation.x, applied:false, newSlots:rec.wasArr?rec.newSlots:rec.newSlots[0], t:0, dur});
        });
        if(opts.add_crossfade) runCrossfade();
        _bumpAnim(dur+150);
      } else {
        // 'none' (or anything unrecognised) -- instant snap.
        meshRecs.forEach(rec=>{ rec.mesh.material=rec.wasArr?rec.newSlots:rec.newSlots[0]; });
      }
    }
  }

  // Light path: independent of whether a real material exists -- runs for
  // every value change on every container, since a light-linked
  // container never has a material to find in the first place.
  _wceSyncLightMatLinks(container, matName);
}



function _wceSyncLightMatLinks(container, matName){
  const links=(CFG.light_mat_links||[]);
  links.forEach(link=>{
    if(link.container!==container) return;
    const entry=(link.entries||[]).find(e=>e.material_name===matName);
    if(!entry){
      // DIAGNOSTIC -- temporary. This link matched the container but no
      // entry's material_name equals the matName we were just switched to.
      // If this fires, entry.material_name (captured from PONKFIGURATOR's
      // own light_mat_links data) doesn't byte-for-byte match the string
      // applyMat() is actually being called with for this container --
      // compare the two values below character-by-character (trailing
      // space, underscore vs space, case, a stray prefix).
      console.warn('[WCE light-mat-link] no entry for matName=', JSON.stringify(matName),
        'on light', link.light_name, '-- known entries:',
        (link.entries||[]).map(e=>e.material_name));
      return;
    }
    let light=findNode(link.light_name);
    if(!light){
      // Not part of root's node tree -- likely an Area light, which lives
      // outside it entirely (added directly to the scene, see the
      // area_lights loader) and is only reachable through this bridge,
      // same mechanism already relied on for area-light geo-chain syncing.
      const s=link.light_name.replace(/ /g,'_');
      const areaLights=(typeof window!=='undefined' && window._wceAreaLights) ? window._wceAreaLights : [];
      light=areaLights.find(l=>l.name===link.light_name||l.name===s);
    }
    if(!light || !light.isLight){
      // DIAGNOSTIC -- temporary. entry matched, but no glTF node AND no
      // area light was found under link.light_name (or its "_"-swapped
      // form). Compare against the real light object names below.
      console.warn('[WCE light-mat-link] no light found for light_name=', JSON.stringify(link.light_name),
        '-- known area lights:', ((typeof window!=='undefined' && window._wceAreaLights)||[]).map(l=>l.name));
      return;
    }
    light.color.setRGB(entry.color[0], entry.color[1], entry.color[2]);
    // Area lights never go through the punctual-light traverse (they're not
    // part of the glTF node hierarchy at all -- see the area_lights loader),
    // so their baseline intensity is pre-scaled server-side with a /10
    // conversion (light.energy/10.0 in _wce_area_light_entry), NOT the /1000
    // punctual-light conversion applied client-side elsewhere. Using the
    // punctual divisor here for an area light made it come out 100x dimmer
    // than its own baseline -- match whichever conversion this light type
    // actually uses.
    const AREA_LIGHT_INTENSITY_DIVISOR = 10;
    light.intensity = entry.power / (light.isRectAreaLight ? AREA_LIGHT_INTENSITY_DIVISOR : WCE_LIGHT_INTENSITY_DIVISOR);
    // Selecting a linked material entry means "this light is on" -- force it
    // visible here too. Visibility was previously left untouched, so a light
    // whose rig wasn't the currently-active LIGHTS_<n> set (or that simply
    // started hidden) could get its color/intensity updated correctly and
    // still never render, no matter how high its power was.
    light.visible = true;
  });
}

// ── UI BUILDERS ──────────────────────────────────────────────────────────

// UI builders (buildUI..qsa) -> ui.js
</script>
<script>
/* Same-tab live reload — active only on the local preview server, never on a
   deployed (GitHub Pages) site. Polls the build token ~1×/s and hard-reloads
   this tab when a new export bumps it. */
(function(){
  var host=location.hostname;
  if(host!=='localhost'&&host!=='127.0.0.1') return;
  var tok=null;
  function poll(){
    fetch('/__wce_reload__',{cache:'no-store'}).then(function(r){return r.text();}).then(function(t){
      if(tok===null) tok=t; else if(t!==tok) location.reload();
    }).catch(function(){});
  }
  setInterval(poll,1000); poll();
})();
</script>
