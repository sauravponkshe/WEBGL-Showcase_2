// Dedicated raycaster for occlusion so we never clobber the pointer raycaster.
const _hsRay=new THREE.Raycaster();
// Metres of slack so the very surface a hotspot sits ON doesn't occlude it,
// while geometry farther in front (e.g. the far side of the car body) does.
const HOTSPOT_OCCLUSION_BIAS=0.12;
const _hsDir=new THREE.Vector3();
const _hsTmpV=new THREE.Vector3(); // pre-alloc: reused every frame instead of .clone()
// Centre + 2 samples (was a 9-point ring). With the temporal smoothing below
// and the ~12 Hz throttle, this looks identical but costs a fraction — each
// sample is a full-model raycast, so fewer samples + lower rate is the fix for
// the orbit-time stutter.
const _HS_SAMPLES=[[0,0]];   // centre only — temporal smoothing covers the rest
const _HS_NDC={x:0,y:0};
const _HS_OCC_INTERVAL_MS=100;  // recompute occlusion at ~10 Hz, not per frame
// Skip the occlusion raycast entirely while the camera is still — a directional
// view's occlusion only changes when the camera moves. This is the big win:
// during a static hold (and with render-on-demand) there are zero raycasts.
let _hsCamX=1e9,_hsCamY=1e9,_hsCamZ=1e9,_hsCamMoved=true;
let _hsFrame=0;

function _hsSampleOccluded(nx,ny,distToHs){
  if(!root||!_occluderMeshes.length) return false;
  _HS_NDC.x=nx; _HS_NDC.y=ny;
  _hsRay.setFromCamera(_HS_NDC,cam);
  _hsRay.far=Math.max(distToHs-HOTSPOT_OCCLUSION_BIAS,0.0001);
  const hits=_hsRay.intersectObjects(_occluderMeshes,false);
  for(const h of hits){
    if(!h.object||h.object.visible===false) continue;
    if(h.object.userData && h.object.userData.wce_no_occlude) continue;
    if(h.distance<distToHs-HOTSPOT_OCCLUSION_BIAS) return true;
  }
  return false;
}

function _tickHotspots(){
  _hsFrame++;
  // Stage px, not viewport px: the hotspot layer lives inside the scaled #wce-ui-stage.
  const _uiK=1/(window.__wceUiScale||1);
  const W=innerWidth*_uiK,H=innerHeight*_uiK;
  // Detect camera movement once per tick (position is enough for occlusion).
  const cp=cam.position;
  _hsCamMoved=(Math.abs(cp.x-_hsCamX)+Math.abs(cp.y-_hsCamY)+Math.abs(cp.z-_hsCamZ))>1e-4;
  if(_hsCamMoved){ _hsCamX=cp.x; _hsCamY=cp.y; _hsCamZ=cp.z; }
  hotspots.forEach((hs,idx)=>{
    if(hs.hidden){ hs.el.style.display='none'; return; }
    // Parented under an animated control at export time — follow the live
    // node instead of a frozen point. Cheap (one matrix-vector multiply),
    // so always done for tracked hotspots regardless of the static-hotspot
    // skip-optimization just below, which assumes a hotspot's own position
    // never changes on its own — not true here.
    if(hs.track){ hs.track.node.localToWorld(hs.pos.copy(hs.track.offset)); }
    // If already invisible and camera hasn't moved, nothing can have changed.
    // Skip project(), DOM write, and raycast entirely — zero cost per frame.
    if(hs.op!=null && hs.op<0.012 && !_hsCamMoved && !hs.track) return;
    if(hs._offScreen && (_hsFrame%3)!==(idx%3)){
      if(hs.op>0.012){hs.op*=0.8; hs.el.style.opacity=hs.op.toFixed(3); if(hs.op<0.012) hs.el.style.display='none';}
      return;
    }
    _hsTmpV.copy(hs.pos).project(cam);
    // Camera not valid yet on this particular tick (e.g. mid-setup during the
    // initial fly-in) — leave this marker's state completely untouched and
    // retry next tick, rather than recording a result derived from NaN.
    if(!isFinite(_hsTmpV.x)||!isFinite(_hsTmpV.y)||!isFinite(_hsTmpV.z)) return;
    let target;

    // Cheap early-out: behind the camera, or well outside the viewport
    // margin — skip the occlusion raycast entirely. With several hotspots
    // scattered around a model, most are off-screen at any given camera
    // angle, so this is the biggest win as the hotspot count grows.
    if(_hsTmpV.z>1||_hsTmpV.x<-1.3||_hsTmpV.x>1.3||_hsTmpV.y<-1.3||_hsTmpV.y>1.3){
      hs._offScreen=true; target=0;
    } else {
      hs._offScreen=false;
      const sx=(_hsTmpV.x*0.5+0.5)*W, sy=(-_hsTmpV.y*0.5+0.5)*H;
      hs.el.style.left=sx+'px';
      hs.el.style.top =sy+'px';

      // Recompute occlusion at ~10 Hz, and only while the camera is moving —
      // a still camera can't change occlusion, so we reuse the last result.
      // Stagger is spread across the full interval window relative to the
      // CURRENT hotspot count, so total raycasts/sec stays roughly constant
      // however many hotspots exist, instead of growing with the count.
      // Annotation markers go through this exact same occlusion check as
      // hotspots — hidden behind geometry the same way.
      const _nowMs=performance.now();
      const _stagger=idx*(_HS_OCC_INTERVAL_MS/Math.max(1,hotspots.length));
      if(hs.vis==null || (_hsCamMoved && (_nowMs-(hs._lastOcc||0))>=_HS_OCC_INTERVAL_MS)){
        hs._lastOcc=_nowMs+_stagger;
        _hsDir.copy(hs.pos).sub(cam.position);
        const distToHs=_hsDir.length();
        const R=hs.px||24;
        let occ=0;
        for(let i=0;i<_HS_SAMPLES.length;i++){
          const px=sx+_HS_SAMPLES[i][0]*R, py=sy+_HS_SAMPLES[i][1]*R;
          const nx=(px/W)*2-1, ny=-(py/H)*2+1;
          if(_hsSampleOccluded(nx,ny,distToHs)) occ++;
        }
        const v=1-(occ/_HS_SAMPLES.length);
        hs.vis=v*v*(3-2*v);   // smoothstep → softer edge falloff
      }
      target=hs.vis;
    }

    // Temporal smoothing of opacity removes flicker as the ray grazes edges.
    hs.op=(hs.op==null)?target:hs.op+(target-hs.op)*0.3;
    if(hs.op<0.012){
      hs.el.style.display='none';
    } else {
      hs.el.style.display='block';
      hs.el.style.opacity=hs.op.toFixed(3);
      hs.el.style.pointerEvents=hs.op>0.5?'auto':'none';
    }
  });
}


// ── IMAGE TRIGGERS ─────────────────────────────────────────────────────────
// DOM overlay approach — identical to hotspots but shows an <img> element
// instead of a pulsing ring. Transparent PNG areas show the HTML background,
// not the 3D scene, eliminating every green-tint / blending issue.
// Occlusion uses the same raycaster logic as hotspots.
const _imgTriggers=[];

function _initImageTriggers(){
  const layer=document.getElementById('hotspot-layer'); // reuse the same overlay layer
  if(!layer) return;

  function _add(def,fn){
    if(!def.image_file) return;

    const el=document.createElement('img');
    el.src='images/'+def.image_file;
    console.log('[WCE] image trigger src:',el.src,'file:',def.image_file);
    el.onerror=()=>console.error('[WCE] image trigger FAILED to load:',el.src);
    const _opStr='opacity:'+(def.image_opacity??1);
    el.style.cssText=[
      'position:absolute',
      'transform:translate(-50%,-50%)',
      _opStr,
      'cursor:pointer',
      'pointer-events:none',
      'display:none',
      'user-select:none',
      '-webkit-user-drag:none',
      'object-fit:contain',
    ].join(';');
    layer.appendChild(el);

    const p=def.image_position||[0,0,0];
    const worldPos=new THREE.Vector3(p[0],p[1],p[2]);

    // Build the quaternion that rotates the plane (same as mesh approach)
    // so we can project its corners to screen space for sizing.
    const toRad=Math.PI/180;
    const q=new THREE.Quaternion().setFromEuler(new THREE.Euler(
      Math.PI/2+(def.image_rotation_x||0)*toRad,
      (def.image_rotation_z||0)*toRad,
      -(def.image_rotation_y||0)*toRad,
      'YXZ'
    ));
    const halfW=(def.image_width??1)/2;
    const halfH=(def.image_height??1)/2;
    // Corner offset vectors in world space (used for screen-space size estimation)
    const cornerR=new THREE.Vector3(halfW,0,0).applyQuaternion(q);
    const cornerU=new THREE.Vector3(0,halfH,0).applyQuaternion(q);

    el.addEventListener('pointerdown',(e)=>{ e.stopPropagation(); fn(); });
    _imgTriggers.push({worldPos,worldW:def.image_width??1,worldH:def.image_height??1,imgOp:def.image_opacity??1,el,fn,op:0,vis:null,_lastOcc:0,track:_wceResolveTrack(def),hidden:false});
  }

  allAnimDefs().forEach(d=>{   
    if(d.trigger==='image') _add(d,()=>triggerAnim(_defId(d)));
    (d.extra_images||[]).forEach(ei=>{ _add(ei,()=>triggerAnim(_defId(d))); });
  });
  [['MAT',(CFG.mat_animations||[])], ['GEO',(CFG.geo_animations||[])]].forEach(([kind,list])=>{
    list.forEach(d=>{
      const active=d.play_mode==='step'?d.step:d.cycle;
      const fire=d.play_mode==='step'?(()=>_matGeoStep(kind,d)):(()=>triggerMatGeoAnim(kind, d.source_key));
      if(active.trigger_type==='image') _add(active,fire);
      (active.extra_images||[]).forEach(ei=>{ _add(ei,fire); });
    });
  });
  const cin=camCfg.cinematic||{};
  if(cin.trigger==='image') _add(cin,()=>{
    (_camSeq['Cinematic']&&_camSeq['Cinematic'].playing) ? _stopCameraSequence('Cinematic') : _startCameraSequence('Cinematic');
  });
  (CFG.sounds||[]).forEach(d=>{
    if(d.trigger_type==='image') _add(d,()=>_wceSoundFire(d));
    (d.extra_images||[]).forEach(ei=>{ _add(ei,()=>_wceSoundFire(d)); });
  });
  ((CFG.animations||{}).sequences||[]).forEach(s=>{
    if(s.trigger==='image') _add(s,()=>executeSequence(s.name));
  });
  (camCfg.camera_sequences||[]).forEach(s=>{
    if(s.trigger==='image') _add(s,()=>{
      (_camSeq[s.name]&&_camSeq[s.name].playing) ? _stopCameraSequence(s.name) : _startCameraSequence(s.name);
    });
  });
}

function _tickImgTriggers(){
  if(!_imgTriggers.length) return;
  const _uiK=1/(window.__wceUiScale||1);   // stage px, see _tickHotspots
  const W=innerWidth*_uiK, H=innerHeight*_uiK;
  const _nowMs=performance.now();
  const _OCC_MS=100;

  _imgTriggers.forEach((it,idx)=>{
    // Explicit override, checked first and unconditionally -- mirrors
    // hs.hidden in _tickHotspots. Image triggers never had an equivalent
    // "just hide it, full stop" flag before this -- everything else here
    // is opacity/occlusion-driven fading, which presentation mode setting
    // style.display directly could never survive past the next frame.
    if(it.hidden){ it.el.style.display='none'; return; }
    // Parented under an animated control at export time — follow the live
    // node instead of a frozen point (see _wceResolveTrack / _tickHotspots,
    // same mechanism shared across hotspots/annotations/image triggers).
    if(it.track){ it.track.node.localToWorld(it.worldPos.copy(it.track.offset)); }
    if(it.op!=null && it.op<0.012 && !_hsCamMoved && !it.track){ it.el.style.display='none'; return; }
    if(it._offScreen && (_hsFrame%2)!==(idx%2)){
      if(it.op>0.012){it.op*=0.8; it.el.style.opacity=it.op.toFixed(3);}
      return;
    }
    _hsTmpV.copy(it.worldPos).project(cam);

    // Behind camera or well off-screen
    if(_hsTmpV.z>1||_hsTmpV.x<-1.4||_hsTmpV.x>1.4||_hsTmpV.y<-1.4||_hsTmpV.y>1.4){
      it._offScreen=true; it.op=(it.op??0)*0.7;
      if(it.op<0.012){ it.el.style.display='none'; }
      return;
    }
    it._offScreen=false;

    const sx=(_hsTmpV.x*0.5+0.5)*W;
    const sy=(-_hsTmpV.y*0.5+0.5)*H;

    // Occlusion check — throttled to ~10Hz, skipped when camera is still
    const _stagger=idx*(_OCC_MS/Math.max(1,_imgTriggers.length));
    if(it.vis==null||(_hsCamMoved&&(_nowMs-(it._lastOcc||0))>=_OCC_MS)){
      it._lastOcc=_nowMs+_stagger;
      _hsDir.copy(it.worldPos).sub(cam.position);
      const dist=_hsDir.length();
      _hsRay.set(cam.position,_hsDir.normalize());
      _hsRay.far=dist-HOTSPOT_OCCLUSION_BIAS;
      const hits=_hsRay.intersectObjects(_occluderMeshes,false);
      it.vis=hits.length===0?1:0;
    }

    const target=it.vis??0;
    it.op=(it.op==null)?target:it.op+(target-it.op)*0.3;

    if(it.op<0.012){
      it.el.style.display='none';
      return;
    }

    // Compute pixel size from world dimensions + camera distance.
    // This gives perspective-correct stable scaling (same as how any 3D
    // object appears to resize as you orbit) without jitter from corner
    // projection artifacts.
    const dist=Math.max(0.1, cam.position.distanceTo(it.worldPos));
    const tanHalfFov=Math.tan(cam.fov*Math.PI/360);
    const pxH=Math.max(20,(it.worldH/(dist*tanHalfFov*2))*H);
    const pxW=Math.max(20,(it.worldW/(dist*tanHalfFov*2*cam.aspect))*W);

    it.el.style.display='block';
    it.el.style.left=sx+'px';
    it.el.style.top =sy+'px';
    it.el.style.width =(Math.max(20,pxW))+'px';
    it.el.style.height=(Math.max(20,pxH))+'px';
    it.el.style.opacity=(it.op*it.imgOp).toFixed(3);
    it.el.style.pointerEvents=it.op>0.5?'auto':'none';
  });
}


// Helper for adding ad-hoc hotspot triggers (used by buildSequenceUI).

// Declared before the render loop (which references it) to avoid a temporal

let _wceOcean=null;
(async function _wceOceanInit(){

    }catch(_e){}

})();

(function tick(){
  requestAnimationFrame(tick);
  const _wceFrameStart = _wceStats.enabled ? performance.now() : 0;
  if(_xrActive) return;   // XR drives its own loop
  _wceRecomputeCamPolarBounds();
  _tickIdleTurntable();
  _tickTurntable();
  _tickMixers();
  _wceApplyFollowers();
  const _tdtRaw=(performance.now()-_lastTransT)/1000; const _tdt=Math.min(0.05,_tdtRaw); const _tdtReal=Math.min(0.5,_tdtRaw); _lastTransT=performance.now();
  _tickTransitions(_tdt);

  const _activeSeqSt = _activeCamSeqName ? _camSeq[_activeCamSeqName] : null;
  if(_activeSeqSt && _activeSeqSt.flying) _tickCamSeqFly(_activeCamSeqName, _tdt);
  if(_activeSeqSt && _activeSeqSt.playing && !_activeSeqSt.transitioning && _activeSeqSt.nodes[_activeSeqSt.idx]){
    const cNode = _activeSeqSt.nodes[_activeSeqSt.idx];
    cNode.getWorldPosition(cam.position);
    cNode.getWorldQuaternion(cam.quaternion);
    const fw = new THREE.Vector3(0,0,-1).applyQuaternion(cam.quaternion);
    // 'dist' was never declared in the original singular-cinematic version of
    // this block (a ReferenceError, thrown every frame during playback --
    // aborted the rest of tick() including rendering). Computed locally
    // instead: distance from the live camera position to this sequence's own
    // savedTarget (captured once in _startCameraSequence(), before this
    // block starts overwriting ctrl.target every frame), with the same
    // >0.1 floor-to-5 fallback the original ternary already had.
    const _lookDist = cam.position.distanceTo(_activeSeqSt.savedTarget);
    ctrl.target.copy(cam.position).add(fw.multiplyScalar(_lookDist > 0.1 ? _lookDist : 5));
    // Animated focal length: sample the current camera's optional fov_track
    // at the SAME clip-local time currentAction is already at (kept in step
    // with the transform animation by _beginSegmentPlayback), then run it
    // through the same physical focal->vFov conversion the static/fly-to
    // cameras already use, so a zooming segment reads identically to a
    // zooming static one.
    const _fovTrack = _activeSeqSt.fovTracks[_activeSeqSt.idx];
    if(_fovTrack && _activeSeqSt.currentAction){
      const _focalNow = _wceSampleFovTrack(_fovTrack, _activeSeqSt.currentAction.time);
      const _vFovNow = _computeVFov(_focalNow, _activeSeqSt.sensorWidths[_activeSeqSt.idx]);
      if(_vFovNow!=null){
        cam.fov=_vFovNow; cam.updateProjectionMatrix();
        _activeCamFocal=_focalNow; _activeCamSensor=_activeSeqSt.sensorWidths[_activeSeqSt.idx];
      }
    }
  } else if(_activeSeqSt && _activeSeqSt.playing){
    // Mid-transition (dip fade or fly tween): the camera is being driven by
    // _dip()'s fade or _tickCamSeqFly() above, not by clip-following -- skip
    // OrbitControls entirely rather than falling into the free-orbit branch
    // below, which would fight either of those for control of the camera.
  } else {
    // ctrl.update() runs every frame — keeps OrbitControls internal spherical
    // state synced so there is never stale state between flies.
    // _tickFly() runs AFTER and overrides the position for the fly arc.
    _applyCamDistanceLock();
    ctrl.update();
    _correctCamDistanceLock();
    _wceApplyZoomBoundsClamp();
    // Safety net: OrbitControls' internal math can produce Infinity/NaN if
    // its orbit radius ever gets too close to zero (this happened with an
    // earlier, too-aggressive Lock Tumble/Pan value) — once corrupted, the
    // camera never recovers on its own. Restore from the last known-good
    // position instead of leaving it (and everything that projects through
    // it, like hotspots) permanently broken.
    if(!isFinite(cam.position.x)||!isFinite(cam.position.y)||!isFinite(cam.position.z)
       ||!isFinite(ctrl.target.x)||!isFinite(ctrl.target.y)||!isFinite(ctrl.target.z)){
      if(_camHasGoodState){
        cam.position.copy(_camLastGoodPos);
        ctrl.target.copy(_camLastGoodTarget);
      } else {
        // Never had a valid frame at all (e.g. broken from the very first
        // position set at script load) — nothing to restore from, so fall
        // back to a hardcoded, always-safe default instead of staying stuck.
        cam.position.set(0,2,10);
        ctrl.target.set(0,0.8,0);
      }
      ctrl.minDistance=Math.max(ctrl.minDistance,0.05);
      ctrl.maxDistance=Math.max(ctrl.maxDistance,0.05);
      ctrl.update();
    } else {
      _camLastGoodPos.copy(cam.position);
      _camLastGoodTarget.copy(ctrl.target);
      _camHasGoodState=true;
    }
    if(_flyPending){
      _flyFromPos.copy(cam.position); _flyFromTgt.copy(ctrl.target);
      _flyToPos.copy(_flyDestPos); _flyToTgt.copy(_flyDestTgt);
      _flyFromFov=cam.fov; _flyToFov=_flyDestFov;
      // Outgoing camera's distance lock is cleared HERE — not synchronously
      // inside flyToCamera() when the button was clicked — for exactly the
      // same reason the dip-to-black fix defers it: this frame's earlier
      // _wceRecomputeCamPolarBounds()/ctrl.update() calls (above) already
      // ran using the STILL-locked state, against the OLD camera's real
      // position. A locked (Zoom/Pan, Place) camera anchors ctrl.target to
      // a point ~0.02 units from itself (see _wceEngageZoomPanLock) — if
      // the lock were cleared before those calls, that near-zero distance
      // combines with the floor/roof formula to produce a degenerate,
      // sometimes NEGATIVE maxPolarAngle, and ctrl.update() would visibly
      // snap the outgoing camera to phi≈0 (straight overhead) for this one
      // frame — becoming the very position _flyFromPos below captures as
      // the fly's own starting point. Clearing it only now, after that
      // capture, means this frame's clamp still correctly saw the locked
      // camera as exempt, and _flyFromPos is the camera's true, unsnapped
      // position.
      _camDistanceLocked=false;
      _wceSetZoomEnabled(true);
      if(_flyDestSound) SFX.playFile(_flyDestSound);
      _flyPending=false; _flyActive=true; _flyT=0; _lastFlyTickMs=performance.now();
    }
    if(_flyActive){
      const _flyDt=Math.min(0.05,(performance.now()-_lastFlyTickMs)/1000); _lastFlyTickMs=performance.now();
      _tickFly(_flyDt);
      cam.lookAt(ctrl.target);
    } else {
    // Re-asserted again here, not just before the earlier update() call above
    // — this second update() is the one actually processing live user input
    // (rotation/zoom), and several other things run in between the two
    // calls each frame. Without reasserting immediately before this one too,
    // the lock could still be bypassed right where it mattered most.
    _applyCamDistanceLock();
    ctrl.update();
    _correctCamDistanceLock();
    _wceApplyZoomBoundsClamp();
    // Clamp pan target. Shift cam.position by the same delta so orbit
    // relationship is preserved with no visual jump. Also drain any
    // residual damped pan offset stored in OrbitControls.
    // Locked cameras are excluded entirely — this clamps against the
    // model's general bounding box, which has no awareness of a specific,
    // deliberately close/precise locked shot. It doesn't break the locked
    // DISTANCE (position and target shift by the same delta, preserving the
    // radius between them) — but it silently relocates where that fixed
    // view is centered, which is exactly a locked camera drifting off its
    // configured shot even while technically staying "locked" to wherever
    // it drifted to.
    if(_panMin!==null && !_camDistanceLocked){
      const _dx=Math.max(_panMin.x,Math.min(_panMax.x,ctrl.target.x))-ctrl.target.x;
      const _dy=Math.max(_panMin.y,Math.min(_panMax.y,ctrl.target.y))-ctrl.target.y;
      const _dz=Math.max(_panMin.z,Math.min(_panMax.z,ctrl.target.z))-ctrl.target.z;
      if(_dx||_dy||_dz){
        ctrl.target.x+=_dx; ctrl.target.y+=_dy; ctrl.target.z+=_dz;
        cam.position.x+=_dx; cam.position.y+=_dy; cam.position.z+=_dz;
        // Drain residual pan offset if OrbitControls exposes it
        if(ctrl._panOffset) ctrl._panOffset.set(0,0,0);
      }
    }
  }
  }

  // Ocean: simulate, then keep the draw window open while it animates.
  if(_wceOcean){
    try{ _wceOcean.tick(_tdt, _tdtReal); _animActiveUntil=Math.max(_animActiveUntil,performance.now()+250); }
    catch(e){ console.error('[WCE] Ocean tick failed, switching it off:', e); try{ _wceOcean.dispose(); }catch(_e){} _wceOcean=null; }
  }

  // Continuous activity keeps the draw window open; otherwise we draw only for
  // the short window opened by interaction / camera damping (requestRender).
  const _now=performance.now();
  // Called unconditionally, not inline in the || chain below — it has a
  // position-tracking side effect that must run every single frame, which
  // short-circuit evaluation could otherwise skip whenever an earlier
  // condition in that chain is already true.
  const _settling=_cameraStillSettling();
  const _active = _flyActive || _turntableActive || (_activeCamSeqName && _camSeq[_activeCamSeqName] && _camSeq[_activeCamSeqName].playing) || _hoverOn
                || _now<_animActiveUntil || Object.keys(_segWatch).length>0
                || _matTweens.length>0 || _geoTweens.length>0 || _userInteracting
                || _matDissolveTweens.length>0 || _scaleTweens.length>0 || _flipTweens.length>0
                || _settling;
  if(_active) _renderUntil=_now+100;

  if(_now<=_renderUntil){
    if(dofPass) _wceUpdateDofFocus();
    if(noisePass) noisePass.uniforms.time.value = _now*0.001;
    _wceUpdateDynamicRenderPriority();
    _wceRenderSsaoMask();
    _wceRenderTsaoMask();
    const _wceGpuQuery = _wceStatsBeginGpuQuery();
    renderer.info.reset();   // once per frame, since autoReset is off — see the comment where autoReset gets disabled
    _wceMainPass.accumulating=false; _wceMainPass.accumCount=0;   // a real frame: any idle refinement starts over
    comp.render();
    _wceStatsEndGpuQuery(_wceGpuQuery);

    // scene (including the AR clone) and causes the frame-rate drop you saw.
    if(!_xrActive) try{ _tickHotspots(); }catch(e){ console.error('[WCE] Hotspot tick failed:', e); }

    // average (see WceAccumRenderPass). Stops by itself after idleFrames frames.

  }

    _wceStatsPollGpuQueries();
    const _wceNow = performance.now();
    if(_wceStats.lastFrameStart != null){
      const _delta = _wceNow - _wceStats.lastFrameStart;
      _wceStats.frameTimeMs = _delta;
      _wceStats.fps = _delta>0 ? 1000/_delta : 0;
      _wceStats.frameTimes.push(_delta);

    if(typeof _wceStatsRenderOverlay==='function') _wceStatsRenderOverlay();
  }
})();

// Android/WebXR — immersive-ar with floor hit-test and tap-to-place.
async function _startWebXR(){
  if(!root || _xrSession){ return; }
  const btn=document.getElementById('ar-btn');
  if(btn) btn.disabled=true;
  try{
    _xrFrameErrored=false;
    _xrSession=await navigator.xr.requestSession('immersive-ar',{
      requiredFeatures:['hit-test'],
      optionalFeatures:['dom-overlay','local-floor','light-estimation'],
      domOverlay:{root:document.body}
    });

    _xrActive=true;
    renderer.xr.enabled=true;
    await renderer.xr.setSession(_xrSession);

    _arBgBackup=scene.background; scene.background=null;
    _arEnvBackup=scene.environment; scene.environment=null;
    if(typeof _groundSky!=='undefined' && _groundSky) _groundSky.visible=false;
    if(root) root.visible=false;

    // Real-world light estimation: replaces the studio HDRI entirely with
    // lighting derived from the device's actual camera feed, so the placed
    // model reads as if it's really sitting in the room, not lit by
    // whatever environment was active in the regular web viewer. Falls back
    // to Three.js's own ambient/hemisphere default if the device doesn't
    // support the 'light-estimation' feature — never left unlit.
    _arEstimatedLight=new XREstimatedLight(renderer);
    _arEstimatedLight.addEventListener('estimationstart',()=>{
      scene.add(_arEstimatedLight);
      if(_arEstimatedLight.environment) scene.environment=_arEstimatedLight.environment;
    });
    _arEstimatedLight.addEventListener('estimationend',()=>{
      scene.remove(_arEstimatedLight);
      scene.environment=_arEnvBackup;
    });

    const rg=new THREE.RingGeometry(0.07,0.09,32).rotateX(-Math.PI/2);
    _arReticle=new THREE.Mesh(rg,new THREE.MeshBasicMaterial({color:0x39c5ff}));
    _arReticle.matrixAutoUpdate=false; _arReticle.visible=false; scene.add(_arReticle);

    _arModel=root.clone(true); _arModel.visible=false;
    // Geometry only — strip any lights that came along in the clone (punctual
    // point/spot/sun lights baked into the GLB are descendants of root, so a
    // plain deep clone copies them too). AR is meant to rely entirely on the
    // device's real-world light estimation above, not re-create the studio
    // lighting rig on top of it.
    (function _stripArLights(o){
      const lights=[];
      o.traverse(n=>{ if(n.isLight) lights.push(n); });
      lights.forEach(n=>{ if(n.parent) n.parent.remove(n); });
    })(_arModel);
    const box=new THREE.Box3().setFromObject(root);
    const sz=box.getSize(new THREE.Vector3());
    const maxd=Math.max(sz.x,sz.y,sz.z)||1;
    const targetMetres=1.0;
    _arModel.scale.setScalar(targetMetres/maxd);
    (function _syncMats(s,d){
      const sm=[],dm=[];
      s.traverse(o=>{if(o.isMesh)sm.push(o);});
      d.traverse(o=>{if(o.isMesh)dm.push(o);});
      sm.forEach((m,i)=>{if(dm[i])dm[i].material=m.material;});
    })(root,_arModel);
    scene.add(_arModel); _arPlaced=false;

    let exit=document.getElementById('ar-exit');
    if(!exit){exit=document.createElement('button');exit.id='ar-exit';exit.style.cssText='position:fixed;top:14px;right:14px;z-index:10000;padding:8px 14px;background:rgba(0,0,0,.6);border:1px solid #fff;border-radius:4px;color:#fff;font-family:Rajdhani,sans-serif;font-size:11px;letter-spacing:.16em;text-transform:uppercase;cursor:pointer';document.body.appendChild(exit);}
    exit.textContent='Exit AR'; exit.style.display='block';
    exit.onclick=()=>{ try{_xrSession?.end();}catch(e){} };

    let hint=document.getElementById('ar-hint');
    if(!hint){hint=document.createElement('div');hint.id='ar-hint';hint.style.cssText='position:fixed;left:50%;transform:translateX(-50%);bottom:64px;z-index:10000;padding:8px 14px;background:rgba(0,0,0,.6);color:#fff;border-radius:4px;font-family:Rajdhani,sans-serif;font-size:11px;letter-spacing:.08em;text-align:center';document.body.appendChild(hint);}
    hint.textContent='Point at the floor, then tap to place'; hint.style.display='block';

    try{ _xrRefSpace=await _xrSession.requestReferenceSpace('local-floor'); }
    catch(e){ _xrRefSpace=await _xrSession.requestReferenceSpace('local'); }

    renderer.setAnimationLoop(_onXRFrame);

    console.error('[WCE] AR setup failed:',e);

    if(btn) btn.disabled=false;
  }
}

function _onXRFrame(t,frame){
  try{
    if(frame&&_xrHitSource&&_xrRefSpace){
      const hits=frame.getHitTestResults(_xrHitSource);

function _endWebXR(){

const PONK_ENCRYPTED = false;
const PONK_EXTERNAL = true;
const PONK_KEY = "";

function _ponkHexToBytes(hex) {
  const out = new Uint8Array(hex.length / 2);
  for (let i = 0; i < out.length; i++) out[i] = parseInt(hex.substr(i * 2, 2), 16);
  return out;
}
let _ponkKeyPromise = null;
function _ponkGetKey() {
  if (!_ponkKeyPromise) {
    _ponkKeyPromise = crypto.subtle.importKey('raw', _ponkHexToBytes(PONK_KEY), 'AES-GCM', false, ['decrypt']);
  }
  return _ponkKeyPromise;
}
function _ponkUrl(url) {
  return url.replace(/\.(glb|gltf|json)$/i, '.ponk');
}
async function _ponkFetchDecrypt(url) {
  const resp = await fetch(url);
  if (!resp.ok) throw new Error('PONK fetch failed: ' + url + ' (' + resp.status + ')');
  const buf = await resp.arrayBuffer();
  const bytes = new Uint8Array(buf);
  const magic = String.fromCharCode(bytes[0], bytes[1], bytes[2], bytes[3]);
  if (magic !== 'PONK') throw new Error('Bad PONK magic in ' + url + ': ' + magic);
  const iv = bytes.subarray(4, 16);
  const ciphertext = bytes.subarray(16);
  const key = await _ponkGetKey();
  return await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, ciphertext);
}
async function _ponkFetchJSON(url) {
  const plaintext = await _ponkFetchDecrypt(_ponkUrl(url));
  return JSON.parse(new TextDecoder('utf-8').decode(plaintext));

const _PONK_GLB_MAGIC = 0x46546C67;
const _PONK_JSON_CHUNK = 0x4E4F534A;
const _PONK_BIN_CHUNK = 0x004E4942;

// Rebuilds a byte-for-byte-standard GLB in memory from the packed
// manifest+payload, so GLTFLoader.parse() below sees a completely
// ordinary GLB and every existing feature (findNode, applyMat, section
// view, hotspots, camera rig, skinning/animation) needs zero changes.
function _ponkRebuildBin(manifest, payloadBytes) {
  const out = new Uint8Array(manifest.binLength);
  const outView = new DataView(out.buffer);
  let cursor = 0;
  for (const region of manifest.regions) {
    if (region.type === 'raw') {
      out.set(payloadBytes.subarray(cursor, cursor + region.byteLength), region.byteOffset);
      cursor += region.byteLength;
    } else {
      const { compCount, count, scale, offset, byteOffset } = region;
      for (let vi = 0; vi < count; vi++) {
        for (let ci = 0; ci < compCount; ci++) {
          const q = payloadBytes[cursor] | (payloadBytes[cursor + 1] << 8);
          const qSigned = q >= 0x8000 ? q - 0x10000 : q;
          cursor += 2;
          const fval = scale[ci] !== 0 ? (qSigned + 32767) * scale[ci] + offset[ci] : offset[ci];
          outView.setFloat32(byteOffset + (vi * compCount + ci) * 4, fval, true);
        }
      }
    }
  }
  return out;
}

function _ponkBuildGlbArrayBuffer(gltfJson, binBytes) {
  const jsonStr = JSON.stringify(gltfJson);
  let jsonBytes = new TextEncoder().encode(jsonStr);
  const jsonPad = (4 - (jsonBytes.length % 4)) % 4;
  if (jsonPad) {
    const padded = new Uint8Array(jsonBytes.length + jsonPad);
    padded.set(jsonBytes);
    padded.fill(0x20, jsonBytes.length); // glTF spec: JSON chunk padded with spaces
    jsonBytes = padded;
  }
  const binPad = (4 - (binBytes.length % 4)) % 4;
  let paddedBin = binBytes;
  if (binPad) {
    paddedBin = new Uint8Array(binBytes.length + binPad); // zero-padded per spec
    paddedBin.set(binBytes);
  }
  const totalLen = 12 + 8 + jsonBytes.length + (paddedBin.length ? 8 + paddedBin.length : 0);
  const out = new ArrayBuffer(totalLen);
  const view = new DataView(out);
  let offset = 0;
  view.setUint32(offset, _PONK_GLB_MAGIC, true); offset += 4;
  view.setUint32(offset, 2, true); offset += 4;
  view.setUint32(offset, totalLen, true); offset += 4;
  view.setUint32(offset, jsonBytes.length, true); offset += 4;
  view.setUint32(offset, _PONK_JSON_CHUNK, true); offset += 4;
  new Uint8Array(out, offset, jsonBytes.length).set(jsonBytes); offset += jsonBytes.length;
  if (paddedBin.length) {
    view.setUint32(offset, paddedBin.length, true); offset += 4;
    view.setUint32(offset, _PONK_BIN_CHUNK, true); offset += 4;
    new Uint8Array(out, offset, paddedBin.length).set(paddedBin); offset += paddedBin.length;
  }
  return out;
}

function _ponkDecodeGeometry(plaintextArrayBuffer) {
  const bytes = new Uint8Array(plaintextArrayBuffer);
  const view = new DataView(plaintextArrayBuffer);
  const manifestLen = view.getUint32(0, true);
  const manifestBytes = bytes.subarray(4, 4 + manifestLen);
  const manifest = JSON.parse(new TextDecoder('utf-8').decode(manifestBytes));
  const payload = bytes.subarray(4 + manifestLen);
  const binBytes = _ponkRebuildBin(manifest, payload);
  return _ponkBuildGlbArrayBuffer(manifest.gltf, binBytes);
}

async function _ponkFetchModel(url) {
  const plaintext = await _ponkFetchDecrypt(_ponkUrl(url));
  return _ponkDecodeGeometry(plaintext);
}

// ── External Textures + Encrypt Data: .gltf/.bin/textures come as
// separate encrypted files rather than one packed model. setURLModifier
// can't be async (three.js's internal loaders call it expecting an
// immediate string back), so everything referenced by the gltf JSON gets
// pre-fetched and pre-decrypted into blob: URLs before parse() runs,
// rather than decrypted on demand as GLTFLoader requests each one.
// The entry-point manifest uses the same _ponkUrl() replace-style rule as
// packed mode (folder/<name>.gltf -> folder/<name>.ponk) since it's the
// one thing the client has to derive before decrypting anything. Its own
// .bin buffer and every texture instead get a random opaque filename
// decided at export time, looked up via manifest.fileMap (original uri ->
// actual encrypted filename) — not derivable from a rule, since a naming
// rule based on the original filename (e.g. foo.jpg -> foo.jpg.ponk) is
// exactly the kind of hint this exists to avoid, and .gltf/.bin sharing a
// basename would collide under the same replace-style rule this uses for
// the entry point.
async function _ponkFetchGltfExternal(gltfUrl, loader) {
  const manifestPlain = await _ponkFetchDecrypt(_ponkUrl(gltfUrl));
  const manifest = JSON.parse(new TextDecoder('utf-8').decode(manifestPlain));
  const gltfJson = manifest.gltf;
  const fileMap = manifest.fileMap || {};
  const baseDir = gltfUrl.includes('/') ? gltfUrl.slice(0, gltfUrl.lastIndexOf('/') + 1) : '';
  const urlMap = new Map();

  const bufferUri = (gltfJson.buffers && gltfJson.buffers[0] && gltfJson.buffers[0].uri) || null;
  if (bufferUri && fileMap[bufferUri]) {
    const payloadPlain = await _ponkFetchDecrypt(baseDir + fileMap[bufferUri]);
    const binBytes = _ponkRebuildBin(manifest, new Uint8Array(payloadPlain));
    const binBlob = new Blob([binBytes], { type: 'application/octet-stream' });
    urlMap.set(baseDir + bufferUri, URL.createObjectURL(binBlob));
  }

  const mimeByExt = { png: 'image/png', jpg: 'image/jpeg', jpeg: 'image/jpeg', webp: 'image/webp' };
  for (const img of (gltfJson.images || [])) {
    if (!img.uri || !fileMap[img.uri]) continue; // bufferView-embedded or unmapped — no fetch needed
    const imgPlain = await _ponkFetchDecrypt(baseDir + fileMap[img.uri]);
    const ext = img.uri.split('.').pop().toLowerCase();
    const imgBlob = new Blob([imgPlain], { type: mimeByExt[ext] || 'application/octet-stream' });
    urlMap.set(baseDir + img.uri, URL.createObjectURL(imgBlob));
  }

  loader.manager.setURLModifier((url) => urlMap.has(url) ? urlMap.get(url) : url);
  return new Promise((resolve, reject) => {
    loader.parse(gltfJson, baseDir, resolve, reject);
  });
}

// ── Section View — up to 3 independent axis clipping planes (X/Y/Z), each
// either a Hollow Cut (just clips, see-through into the interior) or a
// Solid Cap (also renders a colored cross-section at the cut), using the
// same stencil technique as three.js's own official
// webgl_clipping_stencil example. Entirely presence-based: CFG.section_view
// only ever contains keys for axes explicitly enabled in Blender; nothing
// here does anything at all otherwise. Plane convention deliberately
// matches that reference exactly (normal pointing in the NEGATIVE
// direction per axis, so 'constant' is directly the world-space cut
// coordinate with no sign flip) rather than re-deriving it, since getting
// a clipping-plane sign backwards is easy to get subtly wrong.
const _sectionAxes={};        // axisKey -> {active, position, plane}
let _sectionModelBox=null;
let _sectionClippableMeshes=null;   // null = no restriction (falls back to the GEOMETRIES ancestor check) — otherwise a Set of the exact meshes bounds_objects scoped the cut to
let _sectionActivePlanes=[];    // read by applyMat's clone hook so a freshly-cloned material picks up whichever cuts are currently active

function _wceSectionAxisNormal(axisKey){
  return axisKey==='x' ? new THREE.Vector3(-1,0,0)
       : axisKey==='y' ? new THREE.Vector3(0,-1,0)
       : new THREE.Vector3(0,0,-1);
}

function _wceSectionConstant(axisKey, percent){
  if(!_sectionModelBox) return 0;
  const lo=_sectionModelBox.min[axisKey], hi=_sectionModelBox.max[axisKey];
  const t=Math.min(1,Math.max(0,percent/100));
  return lo + (hi-lo)*t;
}

// Exact-match only, on purpose — a bounds object the artist picked in
// Blender should either be found precisely or skipped entirely, never
// fuzzy/prefix-matched against a similarly-named object (e.g. Plane vs
// Plane_01 vs Plane.001, which Blender's own duplicate-numbering makes
// easy to end up with). The one thing this DOES account for: Blender's
// dot-numbered duplicate names (Plane.001) are commonly sanitized to an
// underscore (Plane_001) by the glTF exporter, so that one specific,
// known substitution is tried as a second exact attempt — nothing looser.
function _wceSectionFindExact(name){
  if(!root) return null;
  let found=null;
  root.traverse(o=>{ if(!found && o.name===name) found=o; });
  if(found) return found;
  const sanitized=name.replace(/\./g,'_');
  if(sanitized!==name){
    root.traverse(o=>{ if(!found && o.name===sanitized) found=o; });
    if(found) return found;
  }
  // Blender's glTF exporter doesn't consistently pick ONE treatment for the
  // dot in a Blender-auto-numbered duplicate name ("tire.007") -- sometimes
  // it becomes an underscore ("tire_007", handled above), and sometimes the
  // dot is stripped with nothing put in its place ("tire007"), confirmed
  // directly against a real export. Trying both instead of just one covers
  // either behavior without needing to know which one a given Blender/
  // exporter version actually uses.
  const stripped=name.replace(/\./g,'');
  if(stripped!==name){
    root.traverse(o=>{ if(!found && o.name===stripped) found=o; });
  }
  return found;
}

// The bounding box of JUST this object's own geometry, in world space —
// deliberately NOT recursing into children (unlike Box3.expandByObject,
// which walks the whole descendant hierarchy by default). A selected
// object's bounds should only ever reflect what was actually selected.
function _wceSectionOwnBox(obj){
  if(!obj || !obj.isMesh || !obj.geometry) return null;
  obj.updateWorldMatrix(true,false);
  if(!obj.geometry.boundingBox) obj.geometry.computeBoundingBox();
  if(!obj.geometry.boundingBox) return null;
  return obj.geometry.boundingBox.clone().applyMatrix4(obj.matrixWorld);
}

// True only if `o` (or one of its ancestors) sits inside the GEOMETRIES
// collection — the actual product geometry. Used to keep Section View's
// clipping planes off everything else in the scene (ground planes,
// backdrop dressing, light rigs in ENVIRONMENTS_/LIGHTS_), which should
// never be cut just because the product is.
function _wceSectionIsProductMesh(o){
  let cur=o;
  while(cur){
    if(cur.name==='GEOMETRIES') return true;
    cur=cur.parent;
  }
  return false;
}

function _wceSectionRebuild(){
  if(!root) return;
  const order=['x','y','z'];
  const activeAxes=order.filter(k=>_sectionAxes[k] && _sectionAxes[k].active);
  _sectionActivePlanes=activeAxes.map(k=>_sectionAxes[k].plane);
  root.traverse(o=>{
    if(!o.isMesh || !o.material) return;
    const mats=Array.isArray(o.material)?o.material:[o.material];
    // Explicitly reset to empty for anything out of scope (not just "skip"
    // it) — guarantees it's never left clipped from an earlier state.
    // Bounds objects, when configured, take precedence over the general
    // GEOMETRIES check — restricting the cut to just what was picked.
    const inScope = _sectionClippableMeshes ? _sectionClippableMeshes.has(o) : _wceSectionIsProductMesh(o);
    const planes = inScope ? _sectionActivePlanes : [];
    mats.forEach(m=>{ if(m) m.clippingPlanes=planes; });
  });
  if(typeof requestRender==='function') requestRender(500);
}

function wceSectionSetActive(axisKey, active){
  const ax=_sectionAxes[axisKey]; if(!ax) return;
  ax.active=!!active;
  _wceSectionRebuild();
}

function wceSectionSetPosition(axisKey, percent){
  const ax=_sectionAxes[axisKey]; if(!ax) return;
  ax.position=percent;
  ax.plane.constant=_wceSectionConstant(axisKey, percent);
  if(typeof requestRender==='function') requestRender(300);
}

function _wceInitSectionView(modelBox){
  const cfg=CFG.section_view||{};
  if(!Object.keys(cfg).length) return;   // no axis was ever enabled — presence-based, do nothing at all
  let effectiveBox=null;
  if(cfg.bounds_objects && cfg.bounds_objects.length){
    // Artist picked specific objects in Blender. A single traversal per
    // listed object now drives BOTH the 0-100% range AND what's clippable
    // -- every mesh found anywhere under a listed object (itself, or any
    // descendant, since picking an Empty that groups several parts should
    // bring all of them along) is added to both at once. These used to
    // come from two different traversals with two different scopes: the
    // range only ever looked at a listed object's OWN geometry (an Empty
    // always contributed nothing), while clippability recursed into every
    // descendant regardless. When an Empty's children extended beyond
    // whatever the directly-selected meshes alone spanned, the range never
    // covered them, so a mesh could sit entirely outside the calibrated
    // 0-100% span -- always fully clipped away (looked permanently
    // invisible) or never clipped at all, depending on which side of the
    // (miscalibrated) plane it fell on, and different meshes landing on
    // different sides is exactly what looked like "some parts cut, some
    // not." Unifying the scope guarantees every clippable mesh falls
    // inside the same range that clips it.
    const customBox=new THREE.Box3();
    const clippable=new Set();
    let foundAny=false;
    cfg.bounds_objects.forEach(name=>{
      const n=_wceSectionFindExact(name);
      if(!n){
        console.warn('[WCE] Section View: bounds object \''+name+'\' was not found — ignoring it.');
        return;
      }
      let meshFound=false;
      n.traverse(o=>{
        if(!o.isMesh) return;
        clippable.add(o);
        meshFound=true;
        const b=_wceSectionOwnBox(o);
        if(b){ customBox.union(b); foundAny=true; }
      });
      if(!meshFound){
        console.warn('[WCE] Section View: bounds object \''+name+'\' has no mesh geometry, its own or in its children — ignoring it.');
      }
    });
    if(clippable.size){ _sectionClippableMeshes=clippable; }
    if(foundAny && !customBox.isEmpty()){ effectiveBox=customBox; }
  }
  if(!effectiveBox){
    // Nothing usable was configured — fall back to the GEOMETRIES
    // collection in the model (the actual product geometry), NOT the
    // whole scene: that would also sweep up ground planes, environment
    // set-pieces, and anything else living outside GEOMETRIES.
    const geoBox=new THREE.Box3();
    let foundAny=false;
    root.traverse(o=>{
      if(o.name==='GEOMETRIES'){ geoBox.expandByObject(o); foundAny=true; }
    });
    effectiveBox = (foundAny && !geoBox.isEmpty()) ? geoBox : modelBox;
  }
  _sectionModelBox=effectiveBox;
  ['x','y','z'].forEach(axisKey=>{
    const a=cfg[axisKey];
    if(!a) return;
    const plane=new THREE.Plane(_wceSectionAxisNormal(axisKey), 0);
    _sectionAxes[axisKey]={
      active:!!a.startup_enabled,
      position:(a.startup_position!=null?a.startup_position:50),
      plane,
    };
    plane.constant=_wceSectionConstant(axisKey, _sectionAxes[axisKey].position);
  });
  renderer.localClippingEnabled=true;
  _wceSectionRebuild();
  if(typeof buildSectionViewUI==='function') buildSectionViewUI();
}
window._wceSectionSetActive=wceSectionSetActive;
window._wceSectionSetPosition=wceSectionSetPosition;
window._wceSectionAxes=_sectionAxes;

// ── Animated Textures: the GLB carries one still frame of each video texture; swap it for the playing video ──
// CFG.anim_textures: [{material, src, loop, blend:'normal'|'screen'|'multiply', sound, slots:['map','emissiveMap']}]
// Screen removes blacks, Multiply removes whites. Both draw the video itself (no scene lighting on it) so black / white
// really is the neutral colour of the blend; the helper nodes that show this in Blender are not part of the export.
const _wceAnimTexVideos=[];
function _wceAnimTexApply(){
  const list=CFG.anim_textures||[];
  if(!list.length) return;
  list.forEach(function(it){
    const m=matMap[it.material];
    if(!m){ console.warn('[WCE] Animated texture: no material named "'+it.material+'" in the model'); return; }
    const v=document.createElement('video');
    v.crossOrigin='anonymous'; v.preload='auto'; v.loop=!!it.loop; v.muted=true; v.defaultMuted=true; v.playsInline=true;
    v.setAttribute('playsinline',''); v.setAttribute('webkit-playsinline','');
    v.src=it.src;
    const vt=new THREE.VideoTexture(v);
    vt.colorSpace=THREE.SRGBColorSpace; vt.flipY=false; vt.generateMipmaps=false;
    vt.minFilter=THREE.LinearFilter; vt.magFilter=THREE.LinearFilter;
    (it.slots&&it.slots.length?it.slots:['map']).forEach(function(k){
      const old=m[k];
      if(!old && k!=='map') return;
      if(old){
        vt.wrapS=old.wrapS; vt.wrapT=old.wrapT;
        vt.offset.copy(old.offset); vt.repeat.copy(old.repeat); vt.center.copy(old.center); vt.rotation=old.rotation;
        if(old.channel!=null) vt.channel=old.channel;
      }
      m[k]=vt;
    });
    if(it.blend==='screen' || it.blend==='multiply'){
      m.transparent=true; m.depthWrite=false;
      if(it.blend==='screen'){
        m.blending=THREE.CustomBlending; m.blendEquation=THREE.AddEquation;
        m.blendSrc=THREE.OneFactor; m.blendDst=THREE.OneMinusSrcColorFactor;
        m.blendSrcAlpha=THREE.OneFactor; m.blendDstAlpha=THREE.OneMinusSrcAlphaFactor;
      } else {
        m.blending=THREE.MultiplyBlending;
      }
      m.onBeforeCompile=function(sh){
        sh.fragmentShader=sh.fragmentShader.replace('#include <opaque_fragment>','gl_FragColor=vec4(diffuseColor.rgb+totalEmissiveRadiance,diffuseColor.a);');
      };
      m.customProgramCacheKey=function(){ return 'wce-animtex-'+it.blend; };
    }
    m.needsUpdate=true;

    function start(){ const p=v.play(); if(p&&p.catch) p.catch(function(){}); }
    // The page renders on demand: keep asking for frames for as long as this video is playing.
    function tick(){
      if(!v.paused && !v.ended && typeof requestRender==='function') requestRender(120);
      if(v.ended && !v.loop) return;
      if(v.requestVideoFrameCallback) v.requestVideoFrameCallback(tick); else setTimeout(tick,40);
    }
    tick();
    start();

    let gesture=false;
    function syncSound(){
      if(!it.sound){ v.muted=true; return; }
      let on=true;
      try{ if(window.WCE_SFX && typeof window.WCE_SFX.isOn==='function') on=!!window.WCE_SFX.isOn(); }catch(e){}
      v.muted=!(gesture && on);
    }
    // Browsers only allow sound (and, on some phones, any playback) after the visitor has touched the page.
    ['pointerdown','touchend','click','keydown'].forEach(function(ev){
      window.addEventListener(ev,function(){
        gesture=true; syncSound();
        if(v.paused && !v.ended) start();
      },{capture:true,passive:true,once:true});
    });
    window.addEventListener('wce-sfx-toggle',syncSound);
    syncSound();
    _wceAnimTexVideos.push(v);
  });
  document.addEventListener('visibilitychange',function(){
    _wceAnimTexVideos.forEach(function(v){
      if(document.hidden) v.pause(); else if(!v.ended) { const p=v.play(); if(p&&p.catch) p.catch(function(){}); }
    });
  });
}

async function _onModelLoaded(gltf){
    root=gltf.scene; root.visible=false; scene.add(root);
    // Fixed transparency draw order (see the Culling tab's "Transparency
    // Draw Order" section) -- overrides three.js's default per-frame,
    // distance-from-camera transparent sort with a fixed priority instead.
    // That default sort is the wrong tool for a rigid model: two glass/
    // decal surfaces that overlap on screen have a real-world front-to-
    // back relationship that never actually changes as the camera orbits,
    // only their apparent camera-distance ordering flickers -- which is
    // what makes one blend on top of the other at some angles and not
    // others. renderOrder is compared BEFORE distance in three.js's own
    // transparent sort, so once set here it holds at every angle. Applied
    // to every mesh under the named node (not just the node itself), since
    // a "container" can be a parent Empty/Group with several child meshes.
    // Does nothing for two faces of the SAME double-sided mesh fighting
    // each other -- that's one draw call three.js can't reorder internally;
    // that case needs splitting into two single-sided objects first, each
    // then getting its own priority here.
    Object.entries(CFG.render_priority||{}).forEach(([nm, order])=>{
      const n=findNode(nm);
      if(!n){ console.warn('[WCE] Render Priority: no scene node found for "'+nm+'"'); return; }
      n.traverse(o=>{ if(o.isMesh) o.renderOrder=order; });
    });
    // Dynamic transparency draw order -- the fixed map just above assumes
    // the real front-to-back relationship between two overlapping
    // transparent parts never changes, which fails for parts like left vs.
    // right mirror glass: whichever one is genuinely nearer the camera
    // swaps as the camera/turntable rotates, so a fixed number would be
    // backwards for half the rotation. Resolved once here into
    // {node, meshes} pairs (meshes pre-flattened so the per-frame update
    // below never has to traverse); actually ranked every frame in
    // _wceUpdateDynamicRenderPriority, right before render.
    // Dynamic transparency draw order -- the fixed map just above assumes
    // the real front-to-back relationship between two overlapping
    // transparent parts never changes, which fails for parts like left vs.
    // right mirror glass: whichever one is genuinely nearer the camera
    // swaps as the camera/turntable rotates, so a fixed number would be
    // backwards for half the rotation. Each GROUP is resolved once here,
    // independently, into {entries: [{node, meshes, box}]} (meshes
    // pre-flattened, and box pre-computed from actual geometry -- see the
    // comment on _wceDynamicRenderPriorityGroups above for why the closest
    // point ON the box is measured every frame instead of a fixed interior
    // point like the node's own pivot or the box's center); each group is
    // then actually ranked, against only its own members, every frame in
    // _wceUpdateDynamicRenderPriority, right before render.
    (CFG.render_priority_dynamic_groups||[]).forEach(groupDef=>{
      const entries=[];
      (groupDef.members||[]).forEach(nm=>{
        const n=findNode(nm);
        if(!n){ console.warn('[WCE] Render Priority (Dynamic, group "'+groupDef.name+'"): no scene node found for "'+nm+'"'); return; }
        const meshes=[];
        n.traverse(o=>{ if(o.isMesh) meshes.push(o); });
        const box=new THREE.Box3().setFromObject(n);
        entries.push({node:n, meshes, box});
      });
      if(entries.length<2){
        console.warn('[WCE] Render Priority (Dynamic, group "'+groupDef.name+'"): fewer than 2 objects resolved -- nothing to rank, skipping this group');
        return;
      }
      _wceDynamicRenderPriorityGroups.push({name:groupDef.name, entries});
    });
    // SSAO exclude list: findNode() needs `root` populated (just above), so
    // this can't resolve any earlier than here — see _wceRenderSsaoMask and
    // the _ssaoExcludeMeshes declaration further up for how this list is
    // used. _ssaoMaskAllMeshes is collected in the SAME traversal since the
    // mask render needs to swap materials on every mesh, excluded or not.
    // A name that fails to resolve is skipped, same as every other
    // name-based lookup in this file — but logged here specifically,
    // because a silently-empty exclude list is the single most common way
    // this feature looks like it's "not working": nothing throws, the mask
    // just never has anything to draw. Check window._ssaoExcludeMeshes.length
    // in the browser console if SSAO still darkens an object you excluded.
    if(_ssaoExcludedNames.length){
