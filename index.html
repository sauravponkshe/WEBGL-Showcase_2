  // Blur's sample spacing is computed in texels, so it has to be refreshed
  // on resize too or the blur radius would silently drift in screen-space
  // size as the viewport changes shape.
  _ssaoBoostPass.uniforms.texelSize.value.set(1/innerWidth,1/innerHeight);
  _updateFXAA();
  if(_prChanged) _wceAaApply();   // MSAA is gated on the pixel ratio, so re-decide
  requestRender(400);
}
window.addEventListener('resize',_wceHandleResize);
// The camera's initial aspect/FOV (set at construction time, above) is
// computed from innerWidth/innerHeight at the exact moment that line of
// script runs — which can be BEFORE the browser has actually finished its
// layout pass (confirmed directly: aspect measured ~1.806 at that point vs
// the correct ~1.092 once layout genuinely settles). Rather than depend on
// a native resize event happening to fire afterward to correct it — not
// guaranteed on every device/browser, and this is exactly what was leaving
// the camera's FOV wrong (and things like the ground plane out of frame)
// on a first load that never triggered one — the exact same recalculation
// explicitly runs once more here, deferred long enough for layout to have
// actually settled.
setTimeout(_wceHandleResize, 50);

const raycaster=new THREE.Raycaster();
const mouse=new THREE.Vector2();

// ── ANIMATION SYSTEM ─────────────────────────────────────────────────────

const animState={}, animMixers={}, animClips={};
window.animState=animState;
const _clock=new THREE.Clock();

// Per-control/combo ping-pong direction (+1 / -1), mirrors core pingpong_dir.
const _pingDir={};
// Active segment watchers keyed by mixer key: {action, target, dir}. The tick
// loop stops an action exactly at `target` clip-time (LoopOnce only clamps at a
// clip's natural end, so interior state holds need a manual watcher).
const _segWatch={};
window._segWatch=_segWatch;         // expose so ui.js executeSequence can observe it
const _segBtnMap={};   // clip key → anim def name
const _animBtnKeys={};  // def name → Set of live clip keys
window._animBtnKeys=_animBtnKeys;  // expose to ui.js (button highlight tracking)

// Keep Playing state — _keepPlayingActive[name] is true only while a control/
// combo is actively auto-advancing right now (false/absent = idle or
// deliberately paused). _pausedSegments[name] holds exactly where an
// in-flight step was frozen, so resuming continues from that precise point
// instead of restarting the step or skipping to the next state entirely.
// _keepPlayingWatchers[name] is the requestAnimationFrame handle polling for
// "has the current step finished, and should the next one fire" — one per
// name, never stacked.
const _keepPlayingActive={};
const _pausedSegments={};
const _keepPlayingWatchers={};

// Hover toggle (perpetual): two baked clips — "Hover" (rise/drop) and
// "HoverLoop" (seamless bob+spin loop). Captured by _initAnimMixers.
let _hoverMixer=null,_hoverRiseClip=null,_hoverLoopClip=null;
let _hoverOn=false,_hoverLoopAction=null;

// ── Built-in mode coordination ────────────────────────────────────────────
// Explode and Hover are whole-vehicle "modes" that own many of the same parts.
// Triggering anything else must take over from them, so the user never has to
// stop them manually. We snap an interrupted mode back to its rest pose using
// the clip's own frame 0 (robust — no scene-graph name lookups needed).
const _builtinActive={Explode:false,Hover:false};

function _snapToClipStart(mixer,clip){
  if(!mixer||!clip) return;
  mixer.stopAllAction();
  const a=mixer.clipAction(clip);
  a.reset(); a.enabled=true; a.weight=1; a.timeScale=1; a.time=0; a.play();
  mixer.update(0);            // apply frame 0 (rest) to the bound nodes
  mixer.stopAllAction();
}

function _resetBuiltin(name){
  if(name==='Hover'){
    _snapToClipStart(_hoverMixer,_hoverRiseClip);   // grounded pose
    _hoverOn=false; _hoverLoopAction=null;
  } else {   // Explode
    delete _segWatch[_resolveAnimKey(name)];
    _snapToClipStart(animMixers[name],(animClips[name]||[])[0]);  // assembled pose
    animState[name]=0;
    const sp=document.querySelector(`.anim-btn[data-anim-id="control:${name}"] .anim-state`);
    if(sp) sp.textContent='[0/1]';
  }
  const b=document.querySelector(`.anim-btn[data-anim-id="control:${name}"]`);
  if(b) b.classList.remove('playing');
  _builtinActive[name]=false;
}

function _stopOtherBuiltins(name){
  ['Explode','Hover'].forEach(b=>{ if(b!==name && _builtinActive[b]) _resetBuiltin(b); });
}

// Snap a single control/combo-member to its rest pose (clip frame 0) and stop
// its mixer so a clamped action stops writing.
function _snapControlToRest(cn){
  const k=_resolveAnimKey(cn);
  delete _segWatch[k];
  _snapToClipStart(animMixers[k],(animClips[k]||[])[0]);
  animState[cn]=0; animState[k]=0;
  const b=document.querySelector(`.anim-btn[data-anim-id="control:${cn}"]`);
  if(b) b.classList.remove('playing');
}

// Return every regular control and combo to rest. Called when a built-in mode
// (Explode / Hover) starts, so it takes over the vehicle cleanly instead of
// stacking on top of whatever controls were left open.
function _resetAllRegular(){
  // Primary triggers
  allAnimDefs().forEach(def=>{
    if(def.builtin) return;                       // skip the Explode/Hover entries
    if(Array.isArray(def.members)) def.members.forEach(_snapControlToRest);
    else _snapControlToRest(def.name);
    animState[_defStateKey(def)]=0;
    const b=document.querySelector(`.anim-btn[data-anim-id="${_defId(def)}"]`);
    if(b){
      b.classList.remove('playing');
      const sp=b.querySelector('.anim-state');
      if(sp) sp.textContent=_animLabel(def,0);
    }
  });
}

function toggleHover(def){
  if(!_hoverMixer||!_hoverRiseClip) return;
  const btn=document.querySelector(`.anim-btn[data-anim-id="${_defId(def)}"]`);
  if(!_hoverOn){
    // ── Turn ON: play the rise once, then cross-fade into the perpetual loop.
    _stopOtherBuiltins('Hover');     // take over from Explode if it's active
    _resetAllRegular();              // and from any open controls/combos
    _hoverOn=true; _builtinActive.Hover=true;
    if(btn) btn.classList.add('playing');
    if(def.sounds && def.sounds[1]) SFX.playFile(def.sounds[1]);
    _hoverMixer.stopAllAction();
    const rise=_hoverMixer.clipAction(_hoverRiseClip);
    rise.setLoop(THREE.LoopOnce,1); rise.clampWhenFinished=true;
    rise.reset(); rise.enabled=true; rise.timeScale=1; rise.time=0; rise.play();
    if(_hoverLoopClip){
      const loop=_hoverMixer.clipAction(_hoverLoopClip);
      loop.setLoop(THREE.LoopRepeat,Infinity); loop.clampWhenFinished=false;
      _hoverLoopAction=loop;
      const onFin=(e)=>{
        if(e.action!==rise) return;
        _hoverMixer.removeEventListener('finished',onFin);
        if(!_hoverOn) return;          // user already toggled off mid-rise
        loop.reset(); loop.enabled=true; loop.timeScale=1; loop.play();
        rise.crossFadeTo(loop,0.3,false);
      };
      _hoverMixer.addEventListener('finished',onFin);
    }
  } else {
    // ── Turn OFF: cross-fade from the loop into the reversed rise (= drop).
    _hoverOn=false; _builtinActive.Hover=false;
    if(btn) btn.classList.remove('playing');
    const drop=_hoverMixer.clipAction(_hoverRiseClip);  // same action instance
    drop.setLoop(THREE.LoopOnce,1); drop.clampWhenFinished=true;
    drop.enabled=true; drop.paused=false;
    drop.timeScale=-1; drop.time=_hoverRiseClip.duration; drop.play();
    if(_hoverLoopAction){ _hoverLoopAction.crossFadeTo(drop,0.3,false); _hoverLoopAction=null; }
    // The drop/cross-fade plays after _hoverOn is already false — keep drawing.
    if(typeof _animActiveUntil!=='undefined') _animActiveUntil=performance.now()+1200;
  }
}

function allAnimDefs(){
  const c=CFG.animations||{};
  return [...(c.controls||[]),...(c.combos||[])];
}

// ── Control / combo identity ──────────────────────────────────────────────
// A control and a combo can have the SAME name (a combo "HOOD" driving a control "HOOD"). They are different
// things, so each has an id -- "control:HOOD" / "combo:HOOD" (exported as def.id, derived here for older
// configs). Everything that belongs to ONE trigger is keyed by that id: its button, its keep-playing flags, its
// ping-pong direction, and a combo's own step counter. What is NOT per-trigger stays keyed by the part's own
// name: a control's state IS its part's state (animState[partName]), shared with every combo that drives it.
function _defId(def){ return def.id || ((Array.isArray(def.members)?'combo:':'control:')+def.name); }
function _defStateKey(def){ return Array.isArray(def.members) ? _defId(def) : def.name; }
// "combo:HOOD" / "control:HOOD" find exactly that definition. A bare name (older callers) finds the first
// match, controls before combos -- what every lookup used to do.
function _animDefByRef(ref){
  const defs=allAnimDefs();
  const exact=defs.find(d=>_defId(d)===ref);
  if(exact) return exact;
  const bare=String(ref).replace(/^(control|combo):/,'');
  return defs.find(d=>d.name===bare);
}
function _animBtn(id){ return document.querySelector('.anim-btn[data-anim-id="'+id+'"]'); }

// Button label for a control/combo at a given state index: "<state name> [i/max]".
// state_names come from core.py (per-state for controls; derived+deduped for
// combos). Falls back to the bare counter when no name is present.
// _animLabel -> ui.js
// Compute the next state index, mirroring core.py OBJECT_OT_AnimSetTrigger:
//   • <=1 state  → always 0
//   • 2 states   → plain toggle 0↔1 (reverse-close), regardless of mode. This
//                  keeps built-ins and simple open/close controls behaving as a
//                  bidirectional toggle.
//   • >2 states  → LOOP (0→1→…→N-1→0→1→…, each step a normal eased transition)
//                  or PINGPONG (0→1→…→N-1→…→1→0→…).
function _stepState(prev,total,mode,name){
  if(total<=1) return {next:0};
  if(total===2) return {next:(prev+1)%2};
  if(mode==='PINGPONG'){
    let dir=_pingDir[name]??1;
    if(prev>=total-1&&dir===1) dir=-1;
    else if(prev<=0&&dir===-1) dir=1;
    _pingDir[name]=dir;
    return {next:Math.max(0,Math.min(prev+dir,total-1))};
  }
  // LOOP — wrap back to state 0 the same way every other step happens: a
  // normal eased transition from wherever we are now, not an instant,
  // invisible teleport that skips straight past it to state 1.
  if(prev>=total-1) return {next:0};
  return {next:prev+1};
}

function triggerAnim(ref, _isAutoAdvance){
  const defs=allAnimDefs();
  const def=_animDefByRef(ref);      // "combo:HOOD" / "control:HOOD"; a bare name finds the first match
  if(!def) return;
  const name=_defId(def);            // everything per-trigger below (flags, button, direction) is keyed by this id

  // Hover is a perpetual on/off toggle, handled by its own state machine.
  if(def.builtin==='hover'){ toggleHover(def); return; }

  // GEO_TOGGLE / GEO_FLICKER: pure mesh show/hide, driven entirely by the
  // viewer's existing client-side dissolve fade (_geoDissolveNode) — no
  // AnimationMixer, no glTF animation clip involved at all. That's what
  // makes this possible without hitting the KHR_animation_pointer wall that
  // blocks animating material/light properties: this never touches glTF
  // animation data in the first place. Keep Playing has no meaning for
  // these (nothing to loop), so they're excluded from that branch entirely.
  if(def.anim_type==='GEO_TOGGLE'){ _triggerGeoToggle(def); return; }
  if(def.anim_type==='GEO_FLICKER'){ _triggerGeoFlicker(def); return; }

  // Keep Playing: this trigger becomes a Play/Pause toggle instead of a
  // state-stepper. _isAutoAdvance is only ever true when this call comes
  // from the auto-chain watcher itself (see _scheduleKeepPlayingCheck)
  // advancing an already-running loop to its next step — a real click (or
  // Play from Startup's initial call) always means "toggle play/pause",
  // never "take one more step".
  if(def.keep_playing && !_isAutoAdvance){
    if(_keepPlayingActive[name]){
      _pauseKeepPlaying(name);
      return;
    }
    _keepPlayingActive[name]=true;
    if(_pausedSegments[name]){
      // Resuming from an exact mid-step pause — continue from there rather
      // than starting a fresh step from the last completed state.
      _resumeKeepPlaying(name);
      return;
    }
    _stepAnim(name,def,defs);
    _scheduleKeepPlayingCheck(name);
    return;
  }

  _stepAnim(name,def,defs);
}

function _stepAnim(name,def,defs){
  _stopOtherBuiltins(def.name);       // the built-in modes are identified by their own name

  const total=def.states??2;
  const mode=def.playback_mode||'LOOP';

  // Resolve what to drive FIRST, and snapshot each drive's TRUE current state
  // before anything below overwrites animState. A control drives itself with
  // its own state_fracs; a combo fans out to its members, each with its own
  // member_fracs. Members with fewer states clamp (index capped to their
  // frac list length). The snapshot is essential: for a single control the
  // resolved key is usually the same string as its own name, so reading
  // animState[key] AFTER animState[name] is set below would read the value
  // that was just overwritten — collapsing mFrom to equal mTo and causing an
  // instant snap instead of a smooth transition.
  let drives;
  if(Array.isArray(def.members)){
    drives=def.members.map(m=>({
      m, key:_resolveAnimKey(m),
      fracs:(def.member_fracs&&def.member_fracs[m])||[0,1]
    }));
  }else{
    drives=[{m:def.name, key:_resolveAnimKey(def.name), fracs:def.state_fracs||[0,1]}];
  }
  const _snapshot=drives.map(d=>animState[d.key]??0);

  // A combo's own animState[name] is a separate counter from what its
  // members are actually showing, and can silently drift out of sync
  // whenever a member gets moved through its own individual button (or
  // anything else) rather than through the combo itself -- stepping from
  // that stale counter could accidentally land on a target that already
  // matches the members' real position, producing an invisible no-op
  // click, with the combo's own counter still advancing regardless --
  // only catching up, and finally animating, on the NEXT click. Deriving
  // the combo's prev from what its members are actually showing right
  // now avoids that drift entirely. A standalone control has no such
  // desync risk (it only ever drives itself), so it keeps using its own
  // tracked animState[name] exactly as before.
  const prev = Array.isArray(def.members) ? Math.max(0,..._snapshot) : (animState[def.name]??0);
  const {next}=_stepState(prev,total,mode,name);

  animState[_defStateKey(def)]=next;   // a control: its part's state; a combo: its own counter (by id)

  // This trigger's OWN button only. Controls and combos are visually and
  // functionally independent — a combo never lights up an individual part's
  // button (and vice versa), even if the combo internally drives that part.
  // Button lit only while drives are actively transitioning in _segWatch.
  // Decision is deferred until after drives.forEach so we can check which
  // keys actually entered _segWatch (zero-length holds do not).
  const _trigBtn=document.querySelector(`.anim-btn[data-anim-id="${name}"]`);

  if(def.builtin==='explode'){
    _builtinActive.Explode=(next!==0);
    if(next!==0) _resetAllRegular();   // take over from any open controls/combos
  }

  // Whether this click actually moves anything -- a no-op (already sitting exactly where this step
  // would take it) should stay silent, same standard as the button's own "playing" light below.
  let _anyMoved=false;
  drives.forEach(({m,key,fracs},_i)=>{
    // A combo member might itself be a GEO_TOGGLE/GEO_FLICKER control — those
    // don't go through _playMemberSegment at all (no mixer, no glTF clip),
    // so route them the same way the standalone early-return above does.
    const mDef=Array.isArray(def.members)?defs.find(d=>d.name===m && !Array.isArray(d.members)):def;   // members are always CONTROLS
    if(mDef&&mDef.anim_type==='GEO_TOGGLE'){
      const nodes=(mDef.geo_nodes||[]).map(_findGeoTarget).filter(Boolean);
      const tgt=next>0?1:0;
      if((animState[mDef.name]?1:0)!==tgt) _anyMoved=true;   // actually flips visibility, not already there
      animState[mDef.name]=tgt;   // keep this member's OWN state in sync so a
      nodes.forEach(node=>{      // later standalone trigger of it (its own
        if(_TRANS.geometry) _geoDissolveNode(node, tgt>0?1:-1); else node.visible=(tgt>0);
      });
      return;
    }
    if(mDef&&mDef.anim_type==='GEO_FLICKER'){ _anyMoved=true; _triggerGeoFlicker(mDef); return; }
    if(Array.isArray(def.members) && !animMixers[key]){
      // Not an error the page can recover from, but it used to be invisible: the combo advances, this part never moves.
      console.warn('[WCE] combo "'+def.name+'": part "'+m+'" has no animation loaded, so it will not move (looked for "'+key+'"). Animations that ARE loaded: '+Object.keys(animMixers).join(', '));
    }
    const fLen=Math.max(1,fracs.length);
    const curState=_snapshot[_i];
    const mFrom=Math.min(curState,fLen-1);
    const mTo=Math.min(next,fLen-1);
    if(mFrom!==mTo) _anyMoved=true;
    animState[key]=mTo;
    _playMemberSegment(key,fracs,mFrom,mTo);
  });
  // Sound mapped to the state we're transitioning into -- only when this click genuinely moved
  // something. A click that lands back on exactly where everything already was (a desynced combo
  // counter catching up, or re-clicking an already-resting control) stays silent.
  if(_anyMoved && def.sounds&&def.sounds[next]) SFX.playFile(def.sounds[next]);
  // Light button only if ≥1 drive is actually animating in _segWatch.
  // Zero-length holds (part already at target) never enter _segWatch.
  if(_trigBtn){
    const _liveKeys=drives.map(d=>d.key).filter(k=>_segWatch[k]);
    if(_liveKeys.length>0){
      _trigBtn.classList.add('playing');
      _animBtnKeys[name]=new Set(_liveKeys);
      _liveKeys.forEach(k=>{_segBtnMap[k]=name;});
    }else{
      _trigBtn.classList.remove('playing');
    }
  }

  // Keep the render loop awake while this trigger plays out (segment watchers
  // cover long clips precisely; this bridges short / clamped-hold steps).
  if(typeof _animActiveUntil!=='undefined') _animActiveUntil=performance.now()+1500;
}

// Freezes every in-flight segment belonging to `name` exactly where it
// currently sits — not at its target, not reset to its start — so a later
// resume can continue from this precise point. Bypasses _tickMixers'
// normal segment-completion handling entirely (this isn't a completion,
// it's an interruption), so the button's 'playing' class is cleared here
// directly rather than relying on that path to do it.
function _pauseKeepPlaying(name){
  _keepPlayingActive[name]=false;
  const liveKeys=[...(_animBtnKeys[name]||[])];
  const paused=[];
  liveKeys.forEach(key=>{
    const w=_segWatch[key];
    if(w){
      paused.push({key, timeA:w.timeA, timeB:w.timeB, pausedTime:w.action.time, totalMs:w.durationMs});
      w.action.paused=true;
      delete _segWatch[key];
    }
    delete _segBtnMap[key];
  });
  if(paused.length) _pausedSegments[name]=paused;
  delete _animBtnKeys[name];
  const _trigBtn=document.querySelector(`.anim-btn[data-anim-id="${name}"]`);
  if(_trigBtn) _trigBtn.classList.remove('playing');
}

// Continues each of this name's frozen segments from exactly where they were
// paused, toward their original target, over only the remaining fraction of
// their original duration — not the full step's duration again.
function _resumeKeepPlaying(name){
  const paused=_pausedSegments[name]||[];
  delete _pausedSegments[name];
  const liveKeys=new Set();
  paused.forEach(p=>{
    const key=_resolveAnimKey(p.key);
    const mx=animMixers[key];
    const clips=animClips[key]||[];
    if(!mx||!clips.length) return;
    const action=mx.clipAction(clips[0]);
    const full=Math.abs(p.timeB-p.timeA)||1e-6;
    const remain=Math.abs(p.timeB-p.pausedTime);
    const remainMs=Math.max(1,p.totalMs*(remain/full));
    action.time=p.pausedTime;
    action.play();
    action.paused=true;
    _segWatch[key]={action, timeA:p.pausedTime, timeB:p.timeB, durationMs:remainMs, startMs:performance.now()};
    _segBtnMap[key]=name;
    liveKeys.add(key);
  });
  _animBtnKeys[name]=liveKeys;
  const _trigBtn=document.querySelector(`.anim-btn[data-anim-id="${name}"]`);
  if(_trigBtn && liveKeys.size) _trigBtn.classList.add('playing');
  if(typeof _animActiveUntil!=='undefined') _animActiveUntil=performance.now()+1500;
  _scheduleKeepPlayingCheck(name);
}

// Polls (via rAF, not setInterval — ties naturally to the render loop's own
// pace and stops costing anything the instant the tab isn't being painted)
// until every one of this name's live segments has finished, then fires the
// next step automatically — unless the control was paused while waiting, in
// which case this simply stops rescheduling itself.
function _scheduleKeepPlayingCheck(name){
  if(_keepPlayingWatchers[name]) return;
  const poll=()=>{
    if(!_keepPlayingActive[name]){ delete _keepPlayingWatchers[name]; return; }
    const keys=_animBtnKeys[name];
    const stillRunning=keys && [...keys].some(k=>_segWatch[k]);
    if(stillRunning){ _keepPlayingWatchers[name]=requestAnimationFrame(poll); return; }
    delete _keepPlayingWatchers[name];
    if(!_keepPlayingActive[name]) return;
    // Real hold time at this fully-arrived state before advancing — without
    // it, the next step fired the instant the tween finished, reading as a
    // rapid, flickery cascade through states rather than a clean sequence
    // of holds and moves.
    const def=_animDefByRef(name);
    const pauseMs=_wceMs(def,'keep_playing_pause_sec','keep_playing_pause_ms',1000);
    setTimeout(()=>{
      if(!_keepPlayingActive[name]) return;   // paused during the hold
      triggerAnim(name, true);   // auto-advance to the next step
      _scheduleKeepPlayingCheck(name);
    }, pauseMs);
  };
  _keepPlayingWatchers[name]=requestAnimationFrame(poll);
}

/**
 * Drive an animation directly to an explicit target state index, bypassing
 * _stepState entirely. Used by sequences so any state — including 0 (rest) —
 * is reachable without the click-cycling hack of setting animState to target-1
 * and hoping _stepState increments correctly.
 */
function flyToAnimState(ref, targetState){
  const defs=allAnimDefs();
  const def=_animDefByRef(ref);      // "combo:X" / "control:X" (a sequence step says which); a bare name = first match
  if(!def) return;
  const name=_defId(def);

  // Same pure-visibility handling as triggerAnim — no AnimationMixer or
  // glTF clip involved, so this is what lets a Sequence step (which calls
  // this function directly, not triggerAnim) actually drive one of these.
  if(def.anim_type==='GEO_TOGGLE'){
    const nodes=(def.geo_nodes||[]).map(_findGeoTarget).filter(Boolean);
    if(!nodes.length) return;
    const tgt=targetState>0?1:0;
    animState[def.name]=tgt;
    nodes.forEach(node=>{
      if(_TRANS.geometry) _geoDissolveNode(node, tgt>0?1:-1);
      else node.visible=(tgt>0);
    });
    const btn=document.querySelector(`.anim-btn[data-anim-id="${name}"]`);
    if(btn) btn.classList.toggle('playing', tgt>0);
    if(typeof requestRender==='function') requestRender(300);
    return;
  }
  if(def.anim_type==='GEO_FLICKER'){ _triggerGeoFlicker(def); return; }

  const total=def.states??2;
  const tgt=Math.max(0,Math.min(targetState,total-1));

  // Resolve drives — same logic as triggerAnim.
  let drives;
  if(Array.isArray(def.members)){
    drives=def.members.map(m=>({
      m, key:_resolveAnimKey(m),
      fracs:(def.member_fracs&&def.member_fracs[m])||[0,1]
    }));
  }else{
    drives=[{m:def.name, key:_resolveAnimKey(def.name), fracs:def.state_fracs||[0,1]}];
  }

  // Snapshot actual current state of each drive BEFORE writing animState.
  const snap=drives.map(d=>animState[d.key]??0);

  // Commit new state.
  animState[_defStateKey(def)]=tgt;

  // Whether this actually moves anything -- a sequence step that lands a combo/control on a
  // state it (or its parts) already sit in should stay silent, same standard as triggerAnim.
  let _anyMoved=false;

  // Play each drive from its current position to the explicit target.
  drives.forEach(({m,key,fracs},i)=>{
    const mDef=Array.isArray(def.members)?defs.find(d=>d.name===m && !Array.isArray(d.members)):def;   // members are always CONTROLS
    if(mDef&&mDef.anim_type==='GEO_TOGGLE'){
      const nodes=(mDef.geo_nodes||[]).map(_findGeoTarget).filter(Boolean);
      const t=tgt>0?1:0;
      if((animState[mDef.name]?1:0)!==t) _anyMoved=true;   // actually flips visibility, not already there
      animState[mDef.name]=t;    // keep in sync, same reasoning as _stepAnim
      nodes.forEach(node=>{
        if(_TRANS.geometry) _geoDissolveNode(node, t>0?1:-1); else node.visible=(t>0);
      });
      return;
    }
    if(mDef&&mDef.anim_type==='GEO_FLICKER'){ _anyMoved=true; _triggerGeoFlicker(mDef); return; }
    const fLen=Math.max(1,fracs.length);
    const mFrom=Math.min(snap[i],fLen-1);
    const mTo=Math.min(tgt,fLen-1);
    if(mFrom!==mTo) _anyMoved=true;
    animState[key]=mTo;
    _playMemberSegment(key,fracs,mFrom,mTo);
  });

  // Button highlight — same pattern as triggerAnim.
  const _trigBtn=document.querySelector(`.anim-btn[data-anim-id="${name}"]`);
  if(_trigBtn){
    const liveKeys=drives.map(d=>d.key).filter(k=>_segWatch[k]);
    if(liveKeys.length>0){
      _trigBtn.classList.add('playing');
      _animBtnKeys[name]=new Set(liveKeys);
      liveKeys.forEach(k=>{_segBtnMap[k]=name;});
    }else{
      _trigBtn.classList.remove('playing');
    }
  }

  // Fire state-specific sound if configured -- only when something genuinely moved to get there.
  if(_anyMoved && def.sounds&&def.sounds[tgt]) SFX.playFile(def.sounds[tgt]);
  if(typeof _animActiveUntil!=='undefined') _animActiveUntil=performance.now()+1500;
}

// Snap each control/combo to its configured default_state on first load — no
// animation, just place it at the target pose. Built-ins (Explode/Hover) and
// anything without a default_state stay at rest (state 0) — EXCEPT
// Scene-Animation controls: their glTF default pose is the skin's bind pose
// (usually a T-pose), which is NOT the same as the real pose baked at frame 0
// of their NLA track. Those need an explicit snap to state 0 too, or they sit
// in bind pose until first triggered (visible as a "snap" on first play).
function _applyDefaultAnimStates(){
  const _ctrlByName={};
  ((CFG.animations||{}).controls||[]).forEach(c=>{ _ctrlByName[c.name]=c; });
  function _needsExplicitSnap(def){
    const isSpecial=d=>d && (d.anim_type==='SCENE' || d.anim_type==='GEO_TOGGLE');
    if(Array.isArray(def.members)) return def.members.some(m=>isSpecial(_ctrlByName[m]));
    return isSpecial(def);
  }
  allAnimDefs().forEach(def=>{
    if(def.builtin) return;
    const total=def.states??2;
    const ds=Math.max(0,Math.min(def.default_state||0,total-1));
    if(ds<=0 && !_needsExplicitSnap(def)){
      // "Combo default wins" (what the exporter promises): a combo that starts at rest must ALSO pull back any
      // member whose OWN control default put it somewhere else. Controls are applied first, so without this a part
      // whose control starts at state 1 stayed there while its combo believed everything was at rest -- and the
      // combo's first click then asked that part to go 0 -> 0 (no motion) while the others moved.
      const _pulled=Array.isArray(def.members) && def.members.some(m=>(animState[_resolveAnimKey(m)]||0)>0);
      if(!_pulled) return;                            // genuinely already at rest
    }
    animState[_defStateKey(def)]=ds;    // a control: its part's state; a combo: its own counter (by id)
    // Set ping-pong direction so the next click steps sensibly from this pose.
    if((def.playback_mode||'LOOP')==='PINGPONG')
      _pingDir[_defId(def)]=(ds>=total-1)?-1:1;

    let drives;
    if(Array.isArray(def.members)){
      drives=def.members.map(m=>({
        m, key:_resolveAnimKey(m),
        fracs:(def.member_fracs&&def.member_fracs[m])||[0,1]
      }));
    }else{
      drives=[{m:def.name, key:_resolveAnimKey(def.name), fracs:def.state_fracs||[0,1]}];
    }
    drives.forEach(({m,key,fracs})=>{
      // GEO_TOGGLE has no mixer at all — an instant node-visibility snap on
      // load (a fade here would be an odd thing to see on first paint).
      // GEO_FLICKER is a one-shot action; there's nothing to "load into".
      const mDef=Array.isArray(def.members)?_ctrlByName[m]:def;
      if(mDef&&mDef.anim_type==='GEO_TOGGLE'){
        const nodes=(mDef.geo_nodes||[]).map(_findGeoTarget).filter(Boolean);
        animState[mDef.name]=(ds>0)?1:0;   // keep in sync, same reasoning as _stepAnim
        nodes.forEach(node=>{ node.visible=(ds>0); });
        return;
      }
      if(mDef&&mDef.anim_type==='GEO_FLICKER') return;
      const fLen=Math.max(1,fracs.length);
      const mTo=Math.min(ds,fLen-1);
      animState[key]=mTo;
      // from==to → _playMemberSegment takes its hold branch: instant snap, no play.
      _playMemberSegment(key,fracs,mTo,mTo);
    });

    const btn=document.querySelector(`.anim-btn[data-anim-id="${_defId(def)}"]`);
    if(btn){
      btn.classList.toggle('playing',ds!==0);
    }
  });
  if(typeof requestRender==='function') requestRender(300);
}

/**
 * Play animation clip for a part.
 * state 0  = play reversed (close/retract) when single-clip toggle.
 * state >0 = play forward.
 * Mixer is always on root so GLTF node bindings resolve correctly.
 */
// Resolve a control/combo-member name to the key it was actually bound under.
// Combo members are stored as part names (which may contain spaces), while GLB
// clips get sanitized to underscores — so try both forms (and case-insensitive).
function _resolveAnimKey(name){
  if(animMixers[name]) return name;
  const us=name.replace(/ /g,'_'); if(animMixers[us]) return us;
  const sp=name.replace(/_/g,' '); if(animMixers[sp]) return sp;
  const lk=Object.keys(animMixers).find(k=>
    k.toLowerCase()===name.toLowerCase() || k.toLowerCase()===us.toLowerCase());
  if(lk) return lk;
  // Last resort, only for a name nothing above matched: ignore case, spaces and underscores TOGETHER
  // (a part called "door_l" against an animation called "Door L" used to be missed).
  const norm=s=>String(s).toLowerCase().replace(/[ _]+/g,' ').trim();
  const nn=norm(name);
  const nk=Object.keys(animMixers).find(k=>norm(k)===nn);
  return nk||name;
}

/**
 * Play a member's clip SEGMENT between two state positions and hold at the
 * target. `fracs` are normalized 0..1 positions along the single baked clip
 * (procedural: one per state; keyframe / 2-state: [0,1]). Forward or reverse is
 * inferred from the two endpoints. A zero-length segment (clamped member) just
 * holds at the pose. The interior stop is enforced by the _segWatch tick loop,
 * since three's LoopOnce only clamps at a clip's natural end.
 */
function _playMemberSegment(key,fracs,fromIdx,toIdx){
  key=_resolveAnimKey(key);
  const mx=animMixers[key];
  if(!mx){console.warn('[WCE] no mixer for',key);return;}
  const clips=animClips[key]||[];
  if(!clips.length){console.warn('[WCE] no clips for',key);return;}
  const clip=clips[0];
  const dur=clip.duration||1e-6;
  const fA=fracs.length?fracs[Math.min(fromIdx,fracs.length-1)]:0;
  const fB=fracs.length?fracs[Math.min(toIdx,fracs.length-1)]:1;
  const f0=(fA==null?0:fA), f1=(fB==null?1:fB);

  mx.stopAllAction();
  delete _segWatch[key];
  const action=mx.clipAction(clip);
  action.setLoop(THREE.LoopOnce,1);
  action.clampWhenFinished=true;
  action.reset();
  action.enabled=true;
  action.weight=1;

  const timeA=f0*dur, timeB=f1*dur;

  if(Math.abs(f1-f0)<1e-6){
    // Clamped / hold — sit at the target pose, no motion.
    action.time=timeB;
    action.paused=true;
    action.play();
    // Use 1/60 instead of 0 — Three.js requires a non-zero delta in some
    // builds to actually flush animation bindings to the scene nodes.
    // The action is paused so its time stays at timeB; only the binding
    // evaluation step runs.
    mx.update(1/60);
    return;
  }

  // Drive `action.time` ourselves every tick (see _tickMixers) instead of
  // letting Three.js auto-advance it via timeScale/play(). Three.js's
  // LoopOnce handling has a documented edge case with negative timeScale:
  // when time crosses below 0 during reverse playback, its own internal
  // finish/clamp logic snaps time to `duration` (not 0) and pauses there —
  // which is exactly the full-span reverse segment a state-loop wrap
  // produces (e.g. state 3 back to state 0). That raced against our own
  // interior-stop check and could leave a segment sailing past its target.
  // Scrubbing `time` directly sidesteps the whole mechanism: the eased
  // motion still comes from the baked keyframe curve itself, only "what
  // time is it right now" moves from Three.js's play/pause/timeScale
  // machinery to us. `play()` once to activate/register the action with
  // the mixer, then immediately pause it so nothing auto-advances it.
  action.time=timeA;
  action.play();
  action.paused=true;

  const durationMs=Math.abs(timeB-timeA)*1000;
  _segWatch[key]={action,timeA,timeB,durationMs,startMs:performance.now()};
  mx.update(0);
}

// Diagnostic for the browser console:  wceExplainCombo('HOOD')
// Prints, for that combo, what each part will do on its NEXT click and WHY a part might not move (no animation
// loaded, already at the target state, a mixer or target node shared with another part, several clips, ...).
// Read-only: it never plays anything and never changes any state.
function wceExplainCombo(name){
  const tag='[combo "'+name+'"]';
  const defs=allAnimDefs();
  const same=defs.filter(d=>d.name===name);
  if(!same.length){ console.warn(tag,'no control or combo has this name'); return; }
  const def=same.find(d=>Array.isArray(d.members));
  if(!def){ console.warn(tag,'this name belongs to a control, not a combo'); return; }
  if(same.length>1) console.log(tag,'a control with the same name exists too -- fine: they are separate ("'+_defId(def)+'" vs "control:'+name+'").');
  const total=def.states??2, mode=def.playback_mode||'LOOP';
  const snap=def.members.map(m=>animState[_resolveAnimKey(m)]??0);
  const prev=Math.max(0,...snap);
  const _id=_defId(def), savedDir=_pingDir[_id];
  const next=_stepState(prev,total,mode,_id).next;
  if(savedDir===undefined) delete _pingDir[_id]; else _pingDir[_id]=savedDir;
  console.log(tag,'trigger='+def.trigger+'  states='+total+'  mode='+mode+'  default_state='+(def.default_state||0)+'  keep_playing='+!!def.keep_playing);
  console.log(tag,'parts are at '+JSON.stringify(snap)+' -> the combo believes it is at '+prev+' and the NEXT click goes to '+next);
  const mixerOwner=new Map(), nodeOwner={}, rows=[], notes=[];
  def.members.forEach((m,i)=>{
    const key=_resolveAnimKey(m), mDef=defs.find(d=>d.name===m && !Array.isArray(d.members));
    const mx=animMixers[key], clips=animClips[key]||[], clip=clips[0];
    const fr=(def.member_fracs&&def.member_fracs[m])||[0,1];
    const fLen=Math.max(1,fr.length);
    const from=Math.min(snap[i],fLen-1), to=Math.min(next,fLen-1);
    const nodes=clip?Array.from(new Set(clip.tracks.map(t=>{ const n=t.name.split('.')[0]; const b=n.indexOf('['); return b>=0?n.slice(0,b):n; }))):[];
    let verdict;
    if(mDef && (mDef.anim_type==='GEO_TOGGLE' || mDef.anim_type==='GEO_FLICKER')) verdict='shows/hides geometry (no clip involved)';
    else if(!mDef) verdict='NO CONTROL named "'+m+'": nothing to drive';
    else if(!mx) verdict='NO ANIMATION LOADED for "'+key+'": it will not move';
    else if(!clips.length) verdict='mixer has NO CLIP: it will not move';
    else if(from===to) verdict='HOLD: already at state '+to+', so it will NOT move on this click';
    else if(Math.abs((fr[to]??1)-(fr[from]??0))<1e-6) verdict='HOLD: both states sit at the same point of the clip';
    else verdict='animates '+(Math.abs(fr[to]-fr[from])*clip.duration).toFixed(2)+'s ('+(fr[from]??0)+' -> '+(fr[to]??1)+' of the clip)';
    if(mx){
      if(mixerOwner.has(mx)) notes.push('"'+m+'" SHARES ITS MIXER with "'+mixerOwner.get(mx)+'": driving both in one click makes the second cancel the first');
      else mixerOwner.set(mx,m);
    }
    if(clips.length>1) notes.push('"'+m+'" has '+clips.length+' clips ('+clips.map(c=>c.name).join(', ')+'); only the FIRST ('+clips[0].name+') is ever played');
    nodes.forEach(n=>{
      if(nodeOwner[n] && nodeOwner[n]!==m) notes.push('parts "'+nodeOwner[n]+'" and "'+m+'" both animate the node "'+n+'": whichever mixer updates last wins, so one can hide the other');
      else nodeOwner[n]=m;
    });
    rows.push({part:m, animation_key:key, mixer:mx?'yes':'NO', clip:clip?clip.name+' ('+clip.duration.toFixed(2)+'s)':'-', animates_nodes:nodes.join(', ')||'-', control_default:(mDef&&mDef.default_state)||0, now:snap[i], goes_to:to, next_click:verdict});
  });
  console.table(rows);
  if(snap.some(s=>s!==snap[0])) notes.push('the parts are NOT all at the same state ('+JSON.stringify(snap)+'): the combo takes the highest as its position, so a part already at the target state will not move on the first click');
  if(!notes.length) console.log(tag,'no problems found in the combo definition itself.');
  notes.forEach(n=>console.warn(tag,n));
}
window.wceExplainCombo=wceExplainCombo;

/**
 * Build mixers after GLB loads.
 * Match clips to controls by: clip name match OR track target node name match.
 * Mixer always on root — required for GLTF node binding resolution.
 */
function _initAnimMixers(gltf){
  const controls=allAnimDefs();
  // Build a set of all combo-member names so we can avoid accidentally matching
  // a member clip (e.g. "HOOD_VENTS") to a combo whose name it contains ("HOOD").
  const comboMemberNames=new Set();
  (CFG.animations&&CFG.animations.combos||[]).forEach(c=>{
    (c.members||[]).forEach(m=>{comboMemberNames.add(m); comboMemberNames.add(m.replace(/ /g,'_'));});
  });
  gltf.animations.forEach(clip=>{
    if(clip.name==='Hover'||clip.name==='HoverLoop'){
      if(!_hoverMixer) _hoverMixer=new THREE.AnimationMixer(root);
      if(clip.name==='HoverLoop') _hoverLoopClip=clip; else _hoverRiseClip=clip;
      return;
    }

    // Phase 1: exact name match or ANIM_-prefixed track match (highest confidence).
    let match=controls.find(d=>{
      const s=d.name.replace(/ /g,'_');
      return clip.name===d.name || clip.name===s;
    });

    // Phase 2: track-target match (ANIM_<name> node inside the clip).
    if(!match){
      for(const track of clip.tracks){
        const nodeName=track.name.split('.')[0].replace(/\[\d+\]$/,'');
        match=controls.find(d=>{
          const s=d.name.replace(/ /g,'_');
          return nodeName==='ANIM_'+d.name || nodeName==='ANIM_'+s
              || nodeName===d.name || nodeName===s;
        });
        if(match) break;
      }
    }

    // Phase 3: substring match — but ONLY against standalone controls, never
    // against combos, and never when the clip name is itself a known combo member.
    // This prevents "HOOD_VENTS" matching the combo named "HOOD".
    // Among standalone matches, the LONGEST name wins (most specific) — so a
    // clip like "ANIM_Door_Open" matches control "Door_Open" over "Door",
    // regardless of which one happened to be scanned/created first.
    if(!match && !comboMemberNames.has(clip.name) && !comboMemberNames.has(clip.name.replace(/ /g,'_'))){
      const cnLower=clip.name.toLowerCase();
      let best=null;
      for(const d of controls){
        if(Array.isArray(d.members)) continue;   // skip combos entirely
        const s=d.name.replace(/ /g,'_');
        const hit=cnLower.includes(d.name.toLowerCase()) || cnLower.includes(s.toLowerCase());
        if(hit && (!best || d.name.length>best.name.length)) best=d;
      }
      match=best;
    }

    if(!match){
      // No standalone control def — bind under the clip's own name so combo
      // member fan-out can resolve it via _resolveAnimKey.
      const cn=clip.name;
      if(!animMixers[cn]) animMixers[cn]=new THREE.AnimationMixer(root);
      if(!animClips[cn]) animClips[cn]=[];
      animClips[cn].push(clip);
      return;
    }
    const n=match.name;
    if(!animMixers[n]) animMixers[n]=new THREE.AnimationMixer(root);
    if(!animClips[n]) animClips[n]=[];
    animClips[n].push(clip);
    if(clip.name!==n && !animMixers[clip.name]){
      animMixers[clip.name]=animMixers[n];
      animClips[clip.name]=animClips[n];
    }
  });
}

function _tickMixers(){
  const dt=_clock.getDelta();
  const now=performance.now();
  // Manually scrub every in-flight segment BEFORE the mixer update below, so
  // the paused actions get bound at the position we just computed (paused
  // actions still get their bindings re-applied on update(), they just don't
  // auto-advance) — see _playMemberSegment for why this is driven manually.
  for(const k in _segWatch){
    const w=_segWatch[k];
    if(!w||!w.action){delete _segWatch[k];continue;}
    const frac=w.durationMs>0?Math.min((now-w.startMs)/w.durationMs,1):1;
    w.action.time=w.timeA+(w.timeB-w.timeA)*frac;
    if(frac>=1){
      w.action.time=w.timeB;
      w.action.paused=true;
      delete _segWatch[k];
      // Clear this key from its definition's live set.
      const _dn=_segBtnMap[k];
      if(_dn&&_animBtnKeys[_dn]){
        _animBtnKeys[_dn].delete(k); delete _segBtnMap[k];
        if(_animBtnKeys[_dn].size===0){
          const _db=document.querySelector(`.anim-btn[data-anim-id="${_dn}"]`);
          if(_db) _db.classList.remove('playing');
          delete _animBtnKeys[_dn];
          if(typeof _wceQueueThumbSync==='function') _wceQueueThumbSync();
        }
      }
    }
  }
  Object.values(animMixers).forEach(mx=>mx.update(dt));
  if(_hoverMixer) _hoverMixer.update(dt);
  Object.values(_camSeq).forEach(st=>{ if(st.playing) st.mixers.forEach(mx=>mx.update(dt)); });
}

// ── ANIMATION FOLLOWERS ───────────────────────────────────────────────────
// Blender keeps the collection tree and the object parent tree separate, but a
// glTF node has exactly ONE parent. When an animated ANIM_ empty sits OUTSIDE
// the collections holding its children (e.g. one wheel empty next to several
// alloy-variant collections), the exporter files each child under its
// collection node, so the empty has no children and its clip moves nothing.
// CFG.anim_followers lists {object: its animated empty} as parented in Blender.
// For every listed object that is NOT already under its empty in the loaded
// model (and not under another follower, and has no clip tracks of its own),
// the empty's motion is re-applied each frame, exactly as if it were a child.
// Objects the export already nested correctly are never touched, and the
// collection nodes stay the parents, so geometry switching/dissolves are
// unaffected. Maths: with K = E0^-1 * N0 (the object's pose in the empty's
// rest frame, captured once at load) the object's local matrix each frame is
// P(t)^-1 * E(t) * K, where P is its (collection) parent and E the empty --
// shared ancestor motion (turntable etc.) cancels out.
const _wceFollowers=[];
const _wceFolTmp=new THREE.Matrix4();
function _wceInitAnimFollowers(gltf){
  _wceFollowers.length=0;
  const map=CFG.anim_followers||{};
  const names=Object.keys(map);
  if(!names.length||!root) return;
  root.updateMatrixWorld(true);
  // Nodes that carry their own clip tracks are left to those clips.
  const ownTracks=new Set();
  ((gltf&&gltf.animations)||[]).forEach(clip=>clip.tracks.forEach(tr=>{
    ownTracks.add(tr.name.split('.')[0].replace(/\[\d+\]$/,''));
  }));
  const cand=[];
  names.forEach(n=>{
    const node=findNode(n), emp=findNode(map[n]);
    if(node&&emp&&node!==emp&&node.parent) cand.push({node:node,emp:emp});
  });
  const candNodes=new Set(cand.map(c=>c.node));
  cand.forEach(c=>{
    if(ownTracks.has(c.node.name)) return;
    // Already moves with its empty (or with another follower): leave it alone.
    let p=c.node.parent, skip=false;
    while(p){ if(p===c.emp||candNodes.has(p)){ skip=true; break; } p=p.parent; }
    if(skip) return;
    // Never create a cycle: the empty must not live under the object.
    p=c.emp.parent;
    while(p){ if(p===c.node){ skip=true; break; } p=p.parent; }
    if(skip) return;
    c.emp.updateWorldMatrix(true,false);
    c.node.updateWorldMatrix(true,false);
    const K=c.emp.matrixWorld.clone().invert().multiply(c.node.matrixWorld);
    _wceFollowers.push({node:c.node, emp:c.emp, K:K});
  });
}
function _wceApplyFollowers(){
  if(!_wceFollowers.length) return;
  try{
    for(let i=0;i<_wceFollowers.length;i++){
      const f=_wceFollowers[i];
      f.emp.updateWorldMatrix(true,false);
      f.node.parent.updateWorldMatrix(true,false);
      _wceFolTmp.copy(f.node.parent.matrixWorld).invert().multiply(f.emp.matrixWorld).multiply(f.K);
      _wceFolTmp.decompose(f.node.position,f.node.quaternion,f.node.scale);
      f.node.updateMatrix();
    }
  }catch(e){ console.error('[WCE] Animation followers failed:', e); }
}
window._wceApplyFollowers=_wceApplyFollowers;

// ── CAMERA SYSTEM ─────────────────────────────────────────────────────────

const camCfg=CFG.cameras||{};
window.camCfg=camCfg;
const FLY_DURATION=camCfg.fly_duration??1.2;
const ZOOM_MIN=camCfg.zoom_min??CFG.camera.zoom_min??2.0;
const ZOOM_MAX=camCfg.zoom_max??CFG.camera.zoom_max??15.0;
// Horizontal (X, Z) offset of each zoom bound's own center, in Three.js
// axes, relative to wherever the orbit target currently is — [0,0] (a
// zoom-bound empty that's never been moved from the origin in Blender)
// reproduces the exact previous target-centered behavior with no change.
const ZOOM_MIN_OFFSET=camCfg.zoom_min_offset??CFG.camera.zoom_min_offset??[0,0];
const ZOOM_MAX_OFFSET=camCfg.zoom_max_offset??CFG.camera.zoom_max_offset??[0,0];

let _flyActive=false,_flyPending=false,_flyT=0,_flyDur=FLY_DURATION,_flyEaseIn=false,_flyEaseOut=true;
let _flyDestFov=null,_flyFromFov=null,_flyToFov=null;
let _flyDestSkipRadiusClamp=false;
// Distance-lock state for Lock Tumble/Pan cameras. minDistance===maxDistance
// (an exact, zero-width range) isn't a case OrbitControls handles cleanly —
// it was resolving to a consistent, wrong distance instead of the real
// arrival point. A small fixed epsilon gap avoids that degenerate case
// entirely. _camLockedDist is captured ONCE at arrival and never
// recalculated from the live camera position — every frame re-asserts
// against this same fixed value, so the constraint can't be silently
// overridden by anything else, but also can't drift by chasing a moving
// target either.
const _CAM_LOCK_EPS=0.02;
let _camDistanceLocked=false,_camLockedDist=0;
const _camLockedTarget=new THREE.Vector3();
function _applyCamDistanceLock(){
  if(!_camDistanceLocked) return;
  ctrl.minDistance=Math.max(0.01,_camLockedDist-_CAM_LOCK_EPS);
  ctrl.maxDistance=_camLockedDist+_CAM_LOCK_EPS;
}
// Direct, forceful correction — not just relying on min/maxDistance bounds.
// OrbitControls can carry residual internal zoom momentum (the same class
// of thing the existing pan-offset drain elsewhere already handles for
// panning) that continuously pushes toward zooming in further than
// allowed — the bounds correctly clamp it at the edge, but that edge sits
// _CAM_LOCK_EPS away from the actual intended distance, not AT it. This

  const r=Math.hypot(cam.position.x-ctrl.target.x, cam.position.z-ctrl.target.z);
  if(r<1e-4) return;
  cam.position.x=ctrl.target.x+Math.sin(_turntableAngle)*r;
  cam.position.z=ctrl.target.z+Math.cos(_turntableAngle)*r;
}
// The Auto Rotate button / thumbnail. Stopping it on purpose also switches idle auto-rotate off for the rest of
// the visit, otherwise it would start spinning again a few seconds after the visitor just turned it off.
function _wceToggleTurntable(){
  if(_turntableActive && _ttDir>0){ _ttIdleSuppressed=true; _stopTurntable(true); }
  else{ _ttIdleSuppressed=false; _startTurntable(); }   // off, or still slowing down: (re)start
}
// ---- Idle auto-rotate -------------------------------------------------------------------------------------
(function _wceInitTurntableIdle(){
  if(!_ttIdleCfg) return;
  const hover=(_ttIdleCfg.detect==='hover');
  const touch=()=>{ _ttLastActivity=performance.now(); };
  const stopIfIdleSpin=()=>{ if(_turntableActive && _ttByIdle) _stopTurntable(); };                    // the visitor grabs the view: at once
  const easeStopIfIdleSpin=()=>{ if(_turntableActive && _ttByIdle && _ttDir>0) _stopTurntable(true); };  // mouse merely moved: glide
  // Anything that shows the visitor is here postpones the idle spin...
  ['pointerdown','pointerup','wheel','keydown','touchstart','touchend'].forEach(ev=>window.addEventListener(ev,touch,{passive:true}));
  // ...but only using the 3D view itself (or the keyboard) stops a spin the idle timer started.
  canvas.addEventListener('pointerdown',stopIfIdleSpin);
  canvas.addEventListener('wheel',stopIfIdleSpin,{passive:true});
  canvas.addEventListener('touchstart',stopIfIdleSpin,{passive:true});
  window.addEventListener('keydown',stopIfIdleSpin);
  if(hover){
    let lx=null, ly=null;
    window.addEventListener('pointermove',ev=>{
      if(lx!==null && Math.hypot(ev.clientX-lx, ev.clientY-ly)<4) return;   // ignore sensor jitter
      lx=ev.clientX; ly=ev.clientY; touch(); easeStopIfIdleSpin();
    },{passive:true});
  }
})();
function _tickIdleTurntable(){
  if(!_ttIdleCfg) return;
  const now=performance.now();
  const seq=_activeCamSeqName && _camSeq[_activeCamSeqName];
  const presenting=!!window._wcePresentationActiveFlag;
  // The loading screen (#ld) stays up until the model AND the first environment are ready (plus any minimum hold).
  // While it is showing, the countdown is held at zero, so the delay is counted from the moment the visitor can
  // actually see the scene. (Looked up here, not via ldEl: that const is declared further down the module.)
  if(!_ttLdEl) _ttLdEl=document.getElementById('ld');
  const loading=!!(_ttLdEl && _ttLdEl.style.display!=='none' && !_ttLdEl.classList.contains('hidden'));
  // Not our turn: something else owns the camera, the visitor is mid-drag, a camera lock is on, the tab is hidden,
  // Presentation mode is running without the "Run in Presentation Mode" option, or the visitor switched it off.
  const blocked=loading || _flyActive || _flyPending || _userInteracting || _camDistanceLocked || _xrActive || document.hidden
             || !!(seq && seq.playing) || _ttIdleSuppressed
             || (presenting && !_ttIdleCfg.in_presentation);
  if(blocked){
    _ttLastActivity=now;   // the delay is counted from when the blocker ends
    if(_turntableActive && _ttByIdle) _stopTurntable();
    return;
  }
  if(_turntableActive) return;
  if(now-_ttLastActivity >= (_ttIdleCfg.delay||4)*1000) _startTurntable(true);
}

const _dipEl=()=>document.getElementById('dip');

/**
 * Dip to black: fade out → call fn → fade in.
 * dipDur = ms for each half (fade-out + fade-in).
 */
function _dip(fn, dipDur=350){
  const el=_dipEl(); if(!el){fn();return;}
  el.style.transition=`opacity ${dipDur}ms ease`;
  el.style.opacity='1';
  setTimeout(()=>{
    fn();
    el.style.opacity='0';
  }, dipDur+20);  // slight buffer so the cut lands during full black
}

function _stopAllCameraSequences(){
  Object.keys(_camSeq).forEach(name=>_stopCameraSequence(name));
}
function _camSeqLabel(seqName){
  const d=(camCfg.camera_sequences||[]).find(s=>s.name===seqName);
  return ((d&&(d.label||d.name))||seqName).replace(/_/g,' ');
}
function _startCameraSequence(seqName){
  const st=_camSeq[seqName];
  if(!st || !st.clips.length) return;
  const seqDef=(camCfg.camera_sequences||[]).find(s=>s.name===seqName);
  if(seqDef && seqDef.sound) SFX.playFile(seqDef.sound);

  st.savedTarget.copy(ctrl.target);
  _stopTurntable();
  // Mutual exclusion with any OTHER currently-playing camera sequence --
  // only one can ever drive the render camera at once.
  Object.keys(_camSeq).forEach(name=>{ if(name!==seqName) _stopCameraSequence(name); });
  _flyActive=false;
  st.playing=true; st.idx=0;
  _activeCamSeqName=seqName;
  _transitionToSegment(seqName,0);
  const btn=document.querySelector('.camseq-btn[data-seq="'+seqName+'"]');
  if(btn){btn.classList.add('playing');btn.querySelector('span').textContent='STOP';}
}
function _stopCameraSequence(seqName){
  const st=_camSeq[seqName];
  if(!st || !st.playing) return;

  st.playing=false;
  st.mixers.forEach(mx=>mx.stopAllAction());
  st.currentAction=null;
  st.transitioning=false; st.flying=false; st.flyOnComplete=null;
  if(_activeCamSeqName===seqName) _activeCamSeqName=null;
  // Fade back up if we're mid-dip
  const el=_dipEl();if(el) el.style.opacity='0';
  const btn=document.querySelector('.camseq-btn[data-seq="'+seqName+'"]');
  if(btn){btn.classList.remove('playing');btn.querySelector('span').textContent=_camSeqLabel(seqName);}
  ctrl.target.copy(st.savedTarget);
}
const _camSeqScratchPos=new THREE.Vector3(), _camSeqScratchQuat=new THREE.Quaternion();
function _computeCamSeqPose(seqName, idx){
  // Pure computation -- evaluates segment `idx`'s clip at its opening frame
  // (t=0) into scratch objects, WITHOUT touching cam/ctrl. Used both to jump
  // straight there (Snap/Dip arrival) and as a Fly transition's destination
  // to tween toward. This does prime the mixer/action to frame 0 as a side
  // effect (needed either way before real playback starts), so callers
  // don't need to separately reset it themselves.
  const st=_camSeq[seqName];
  if(!st) return null;
  const node=st.nodes[idx],clip=st.clips[idx],mx=st.mixers[idx];
  if(!node||!clip||!mx) return null;
  mx.stopAllAction();
  const action=mx.clipAction(clip);
  action.reset(); action.play(); action.paused=true; action.time=0;
  mx.update(0);
  node.updateWorldMatrix(true,false);
  node.getWorldPosition(_camSeqScratchPos);
  node.getWorldQuaternion(_camSeqScratchQuat);
  const fw=new THREE.Vector3(0,0,-1).applyQuaternion(_camSeqScratchQuat);
  const target=_camSeqScratchPos.clone().add(fw.multiplyScalar(5));
  let fov=null, focal=null;
  const fovTrack=st.fovTracks[idx];
  if(fovTrack){
    focal=_wceSampleFovTrack(fovTrack,0);
    fov=_computeVFov(focal, st.sensorWidths[idx]);
  }
  return {pos:_camSeqScratchPos.clone(), quat:_camSeqScratchQuat.clone(), target, fov, focal, sensor:st.sensorWidths[idx]};
}
function _poseAtCamSeqStart(seqName, idx){
  // Snap the RENDER camera straight to the opening frame (t=0) of segment `idx`.
  const pose=_computeCamSeqPose(seqName, idx);
  if(!pose) return false;
  cam.position.copy(pose.pos);
  cam.quaternion.copy(pose.quat);
  ctrl.target.copy(pose.target);
  if(pose.fov!=null){ cam.fov=pose.fov; cam.updateProjectionMatrix(); _activeCamFocal=pose.focal; _activeCamSensor=pose.sensor; }
  cam.updateMatrixWorld();
  return true;
}

function _beginSegmentPlayback(seqName, idx){
  // Actually starts segment `idx`'s baked camera clip playing, and fires its
  // embedded mini-sequence at the same moment. Called once the ARRIVAL at
  // this segment (Snap jump / Dip fade / Fly tween) has already happened --
  // this function itself never touches the transition.
  const st=_camSeq[seqName];
  if(!st || !st.playing) return;
  st.idx=idx;
  st.mixers.forEach(mx=>mx.stopAllAction());
  const clip=st.clips[idx];
  const mx=st.mixers[idx]||st.mixers[0];
  if(!mx||!clip){_stopCameraSequence(seqName);return;}

  // The camera clip's own 'finished' event AND this segment's mini-sequence
  // must BOTH complete before advancing, whichever takes longer -- a slow
  // mini-sequence effectively stretches this segment's duration rather than
  // getting cut off by the camera clip ending.
  const action=mx.clipAction(clip);
  action.setLoop(THREE.LoopOnce,1);
  action.clampWhenFinished=true;
  action.reset().play();
  st.currentAction=action;

  let clipDone=false, miniDone=false;
  const tryAdvance=()=>{
    // st.playing guards against a segment that was already stopped (the
    // artist hit Stop, or a different trigger interrupted this sequence)
    // from resurrecting itself once its lingering mini-sequence finishes.
    if(clipDone && miniDone && st.playing) _transitionToSegment(seqName, idx+1);
  };
  mx.addEventListener('finished',function onF(){
    mx.removeEventListener('finished',onF);
    clipDone=true; tryAdvance();
  });
  const steps=st.segmentSteps[idx]||[];
  if(!steps.length){ miniDone=true; tryAdvance(); }
  else _runSteps(steps).then(()=>{ miniDone=true; tryAdvance(); });
}

function _transitionToSegment(seqName, idx){
  const st=_camSeq[seqName];
  if(!st) return;
  if(idx>=st.clips.length){
    // End of sequence — either fly straight to the artist-chosen Rest
    // Camera (a continuous hand-off, no black frame, ALWAYS a fly
    // regardless of that camera's own configured transition), or fall back
    // to the old behaviour: dip, then snap to segment 1's opening pose
    // with orbit controls handed back.
    const seqDef=(camCfg.camera_sequences||[]).find(s=>s.name===seqName);
    const restCam=seqDef && seqDef.rest_camera;
    if(restCam){
      st.transitioning=false;
      _stopCameraSequence(seqName);
      flyToCamera(restCam, 'fly');
    } else {
      st.transitioning=true;
      _dip(()=>{ st.transitioning=false; _stopCameraSequence(seqName); _poseAtCamSeqStart(seqName,0); });
    }
    return;
  }
  const trans=st.transitions[idx]||{type:'dip',flyDuration:1.2,easeIn:false,easeOut:true,dipDuration:0.4};
  if(trans.type==='snap'){
    st.transitioning=false;
    _poseAtCamSeqStart(seqName, idx);
    _beginSegmentPlayback(seqName, idx);
  } else if(trans.type==='fly'){
    const pose=_computeCamSeqPose(seqName, idx);
    if(!pose){ _beginSegmentPlayback(seqName, idx); return; }
    // Tween from wherever the camera currently sits (the end of the
    // PREVIOUS segment's clip, or wherever the visitor's view was if this
    // is the sequence's opening segment) to this segment's opening frame.
    st.transitioning=true; st.flying=true; st.flyT=0;
    st.flyDur=trans.flyDuration>0?trans.flyDuration:1.2;
    st.flyEaseIn=trans.easeIn; st.flyEaseOut=trans.easeOut;
    st.flyFromPos.copy(cam.position); st.flyFromQuat.copy(cam.quaternion); st.flyFromFov=cam.fov;
    st.flyToPos.copy(pose.pos); st.flyToQuat.copy(pose.quat); st.flyToFov=(pose.fov!=null?pose.fov:cam.fov);
    st.flyOnComplete=()=>{ _beginSegmentPlayback(seqName, idx); };
  } else {
    // dip (default)
    st.transitioning=true;
    _dip(()=>{
      st.transitioning=false;
      _poseAtCamSeqStart(seqName, idx);
      _beginSegmentPlayback(seqName, idx);
    }, (trans.dipDuration!=null?trans.dipDuration:0.4)*1000);
  }
}

function _tickCamSeqFly(seqName, dt){
  const st=_camSeq[seqName];
  if(!st || !st.flying) return;
  st.flyT += dt/st.flyDur;
  const arriving = st.flyT>=1;
  if(arriving) st.flyT=1;
  let t=st.flyT;
  if(st.flyEaseIn && st.flyEaseOut) t=t*t*(3-2*t);
  else if(st.flyEaseIn) t=t*t;
  else if(st.flyEaseOut) t=t*(2-t);
  cam.position.lerpVectors(st.flyFromPos, st.flyToPos, t);
  cam.quaternion.copy(st.flyFromQuat).slerp(st.flyToQuat, t);
  if(st.flyFromFov!=null && st.flyToFov!=null){
    cam.fov = THREE.MathUtils.lerp(st.flyFromFov, st.flyToFov, t);
    cam.updateProjectionMatrix();
  }
  const fw=new THREE.Vector3(0,0,-1).applyQuaternion(cam.quaternion);
  ctrl.target.copy(cam.position).add(fw.multiplyScalar(5));
  cam.updateMatrixWorld();
  if(arriving){
    st.flying=false; st.transitioning=false;
    const cb=st.flyOnComplete; st.flyOnComplete=null;
    if(cb) cb();
  }
}

/**
 * Given a clip, return the node in `root` that it animates a transform on.
 * The render camera follows THIS node, so it must be the node the tracks bind to.
 */
function _resolveTrackNode(clip){
  if(!root||!clip) return null;
  for(const tr of clip.tracks){
    const prop=tr.name.split('.').pop();
    if(prop!=='position'&&prop!=='quaternion'&&prop!=='rotation'&&prop!=='scale') continue;
    const nodeName=tr.name.split('.')[0].replace(/\[\d+\]$/,'');
    const safe=nodeName.replace(/ /g,'_');
    let found=null;
    root.traverse(o=>{ if(!found&&(o.name===nodeName||o.name===safe)) found=o; });
    if(found) return found;
  }
  return null;
}

function _initCameraSequences(gltf){
  (camCfg.camera_sequences||[]).forEach(seqDef=>{
    const st={mixers:[],clips:[],nodes:[],fovTracks:[],sensorWidths:[],segmentSteps:[],transitions:[],
              playing:false,idx:0,currentAction:null,savedTarget:new THREE.Vector3(),
              // Per-segment Fly-transition tween state -- only ever active
              // for the ONE sequence currently driving the camera at a time
              // (mutual exclusion is enforced elsewhere), so this living on
              // every sequence's own state (rather than one shared global)
              // just means it's already scoped correctly with no extra work.
              transitioning:false, flying:false, flyT:0, flyDur:1.2, flyEaseIn:false, flyEaseOut:true,
              flyFromPos:new THREE.Vector3(), flyFromQuat:new THREE.Quaternion(), flyFromFov:null,
              flyToPos:new THREE.Vector3(), flyToQuat:new THREE.Quaternion(), flyToFov:null,
              flyOnComplete:null};
    (seqDef.segments||[]).forEach(entry=>{
      const safeName = entry.name.replace(/ /g, '_');

      // 1. Resolve the actual camera node in the loaded scene by name.
      let camNode = null;
      if(root) root.traverse(o=>{ if(!camNode&&(o.name===entry.name || o.name===safeName)) camNode=o; });

      // 2. Prefer the clip that actually animates this camera node (track-target
      //    match). Loose name 'includes' matching can wrongly grab a part clip.
      let clip=null;
      if(camNode){
        clip=gltf.animations.find(a=>a.tracks.some(t=>{
          const nn=t.name.split('.')[0].replace(/\[\d+\]$/,'');
          return nn===camNode.name||nn===entry.name||nn===safeName;
        }));
      }
      // 3. Fallbacks: track-target by name, then clip-name match.
      if(!clip){
        clip=gltf.animations.find(a=>a.tracks.some(t=>{
          const nn=t.name.split('.')[0].replace(/\[\d+\]$/,'');
          return nn===entry.name||nn===safeName;
        }));
      }
      if(!clip){
        clip=gltf.animations.find(a=>
          a.name===entry.name||a.name===safeName||
          a.name.toLowerCase().includes(entry.name.toLowerCase())||
          entry.name.toLowerCase().includes(a.name.toLowerCase())
        );
      }
      if(!clip){
        console.warn('[WCE] camera sequence "'+seqDef.name+'": no clip found for camera',entry.name);
        return;
      }

      // 4. If name lookup failed, derive the node straight from the matched clip's
      //    transform tracks. Getting this wrong (null node) is what made the
      //    sequence merely dip to black instead of flying the camera.
      if(!camNode) camNode=_resolveTrackNode(clip);
      if(!camNode) console.warn('[WCE] camera sequence "'+seqDef.name+'": camera node not found for',entry.name,'— camera will not move');

      st.mixers.push(new THREE.AnimationMixer(root));
      st.clips.push(clip);
      st.nodes.push(camNode);
      // Pushed in lockstep with the arrays above (same index) -- null for a
      // camera with no animated lens / no steps, so lookups can just check
      // truthiness without needing a separate length check.
      st.fovTracks.push(entry.fov_track||null);
      st.sensorWidths.push(entry.sensor_width_mm||null);
      st.segmentSteps.push(entry.steps||[]);
      st.transitions.push({
        type: entry.transition||'dip',
        flyDuration: entry.fly_duration!=null?entry.fly_duration:1.2,
        easeIn: !!entry.ease_in,
        easeOut: entry.ease_out!=null?!!entry.ease_out:true,
        dipDuration: entry.dip_duration!=null?entry.dip_duration:0.4,
      });
    });
    _camSeq[seqDef.name]=st;
  });
}

// ── HOTSPOT SYSTEM ───────────────────────────────────────────────────────

const hotspots=[];
// Flat list of occludable meshes, built once when the model loads (see the
// root.traverse() in the gltf load callback). Geo-subset switching only
// toggles .visible on these same objects — they're never added/removed from
// the scene graph — so a one-time flat list avoids re-walking the full
// hierarchy on every single occlusion raycast (the costly part once there
// are several hotspots, since each one raycasts independently).
let _occluderMeshes=[];

function _rgbCss(c){
  // c = [r,g,b] floats 0-1  →  css rgb string
  if(!c||c.length<3) return 'var(--hot)';
  return `rgb(${Math.round(c[0]*255)},${Math.round(c[1]*255)},${Math.round(c[2]*255)})`;
}

function _makeHotspotEl(color, scale){
  const css=_rgbCss(color);
  const mult = (scale || 0.25) / 0.25; 
  const el=document.createElement('div');
  el.className='hs-sprite clickable';
  el.style.transform = `translate(-50%,-50%) scale(${mult})`;
  el.innerHTML=`<div class="hs-ring" style="border-color:${css};box-shadow:0 0 8px ${css}44"></div>`+
               `<div class="hs-dot"  style="background:${css};box-shadow:0 0 6px ${css}"></div>`;
  return el;
}

function _hsGlowPx(scale){
  // On-screen glow radius (px): ring is 44px wide, sprite scales by scale/0.25,
  // pulse expands to ~1.4x and the box-shadow adds a little — sample that area.
  const mult=(scale||0.25)/0.25;
  return 24*mult;
}

// If this hotspot/image-trigger/annotation was parented under an animated
// (PROCEDURAL) control at export time, this resolves the actual live node
// to follow plus its local-space offset from that node — returns null for
// anything not parented under an animated control, which is the common
// case and keeps those exactly as frozen export-time points as before.
function _wceResolveTrack(def){
  if(!def || !def.track_node) return null;
  const node=findNode(def.track_node);
  if(!node) return null;
  const off=def.track_offset||[0,0,0];
  return {node, offset:new THREE.Vector3(off[0],off[1],off[2])};
}

// -- Materials/Geometries auto-cycling animations --------------------------
// Unlike animation controls, a trigger here is ALWAYS purely Play/Pause for
// an ongoing auto-cycle through that system's own variants -- there's no
// single-step mode, since jumping straight to one specific variant is
// already handled by that system's own normal sidebar button (suppressed
// only for whichever ones an enabled entry has claimed).
const _matGeoActive={};      // sourceKey -> true while actively cycling
const _matGeoWatchers={};    // sourceKey -> setTimeout handle for the next step

// Resolve one named value of a Material/Geometry animation to its subset definition.
function _matGeoResolve(kind, def, variantName){
  // Lowest-tier entries: a single container (its own materials) or a single geo package (its own leaves).
  if(def.source_type==='container'){ const _st={}; _st[def.container]=variantName; return {name:variantName, state:_st}; }
  if(def.source_type==='geo_variant'){ const _ch=(def.variant_chains||{})[variantName]; return (_ch&&_ch.length)?{name:variantName, chain:_ch, state:null}:undefined; }
  const pool = kind==='MAT'
    ? (CFG.mat_subsets||[]).concat(CFG.global_mat_sets||[])
    : (CFG.geometry_subsets||[]);
  // Match by name ONLY within the right scope -- two different
  // categories can easily share a variant name (e.g. both have an
  // option called 'Red'), and matching name alone would silently
  // resolve to whichever one happens to come first in the pool,
  // making a second animated category appear to just keep playing
  // the first one's states instead of its own.
  return (kind==='MAT')
    ? (def.source_key==='__global_sets__'
        ? pool.find(x=>x.name===variantName && x.is_global)
        : pool.find(x=>x.name===variantName && x.category===def.source_key && !x.is_global))
    : pool.find(x=>x.name===variantName);
}

// Which of THIS animation's own values is exactly what is on screen right now -- because something
// else applied it (a side-panel button, a thumbnail, a Variant, a sequence step, another
// animation, ...)? Returns its index in play_order, or -1 when the live state matches none of them.
// A value counts as showing only when EVERY part of its assignment matches the live state
// (matSt: container -> material, geoSt: the visible variant of each slot).
function _matGeoShowingIdx(kind, def){
  const order = def.play_order||[];
  const hits = [];
  order.forEach((name, i)=>{
    const s = _matGeoResolve(kind, def, name);
    if(s && s.chain){ if(s.chain.every(g=>!!geoSt[String(g.child).replace(/ /g,'_')])) hits.push({i:i, n:s.chain.length}); return; }
    if(!s || !s.state) return;
    const entries = Object.entries(s.state);
    if(!entries.length) return;
    const on = (kind==='MAT')
      ? entries.every(e=>matSt[e[0]]===e[1])
      : entries.every(e=>!!geoSt[String(e[1]).replace(/ /g,'_')]);
    if(on) hits.push({i:i, n:entries.length});
  });
  if(!hits.length) return -1;
  // Several values can be satisfied at once (one being a subset of another): prefer the one this
  // animation itself last applied, otherwise the most specific match (the one with most parts).
  const own = hits.find(h=>h.i===def._idx);
  if(own) return own.i;
  hits.sort((a,b)=>(b.n-a.n)||(a.i-b.i));
  return hits[0].i;
}

function _matGeoApplyVariant(kind, def, variantName){
  const s = _matGeoResolve(kind, def, variantName);
  if(!s) return;
  const transKey = kind==='MAT' ? 'mat_ms' : 'geo_ms';
  const orig = _TRANS[transKey];
  { const _tm=_wceMs(def,'transition_sec','transition_ms',null); if(_tm!=null) _TRANS[transKey] = _tm; }
  if(s.chain){ s.chain.forEach(g=>{ if(g.child && g.siblings && g.siblings.length) applyGeoToggle(g.child, g.siblings); }); }
  else if(def.source_type==='container'){ Object.entries(s.state).forEach(([c,m])=>{ applyMat(c,m); matSt[c]=m; }); refreshActive(); if(typeof _updateAnnotationVisibility==='function')_updateAnnotationVisibility(); refreshAdvMat(matSt); }
  else if(kind==='MAT'){ applyMatSubset(s.state, def.source_key); refreshAdvMat(s.state); }
  else { applyGeoSubset(s.state); }
  _TRANS[transKey] = orig;
}

function _matGeoStep(kind, def){
  const order = def.play_order||[];
  if(!order.length) return;
  // Re-anchor before every step: if one of this animation's own values is what is showing right
  // now (something else applied it), continue from THAT value in this animation's order -- and
  // wrap around -- instead of from wherever this animation itself last was. If the live state
  // matches none of its values (or it is simply the value this animation applied), nothing changes.
  const showing = _matGeoShowingIdx(kind, def);
  if(showing >= 0) def._idx = showing;
  const next = ((def._idx!=null?def._idx:-1)+1) % order.length;
  if(showing >= 0 && next === showing) return;     // its only value, already showing: nothing to move on to
  def._idx = next;
  _matGeoApplyVariant(kind, def, order[def._idx]);
}

function _matGeoScheduleNext(kind, def){
  const key = def.source_key;
  if(_matGeoWatchers[key]) return;

function triggerMatGeoAnim(kind, sourceKey){

  const def = list.find(d=>d.source_key===sourceKey);

  const key = def.source_key;
  if(_matGeoActive[key]){
    _matGeoActive[key] = false;
    if(_matGeoWatchers[key]){ clearTimeout(_matGeoWatchers[key]); delete _matGeoWatchers[key]; }

}

    }, seq.mesh_hover);

  }

    setTimeout(()=>{ try{ _wceHoverPrewarm(); }catch(err){ console.warn('[WCE] Hover prewarm failed:', err); } }, 600);
    canvas.addEventListener('pointermove', _wceOnHoverMove);

function _wceHandleMeshTriggerClick(e){
  if(!root) return;
  // Ignore a click whose press and release landed far enough apart --
  // that's a camera-orbit drag that happened to end over the mesh,
  // not an intended tap on it.
  const _dx=e.clientX-_meshClickDownX, _dy=e.clientY-_meshClickDownY;
  if((_dx*_dx+_dy*_dy) > _MESH_CLICK_DRAG_TOLERANCE_PX*_MESH_CLICK_DRAG_TOLERANCE_PX) return;
  const rect=canvas.getBoundingClientRect();
  mouse.x=((e.clientX-rect.left)/rect.width)*2-1;
  mouse.y=-((e.clientY-rect.top)/rect.height)*2+1;
  raycaster.setFromCamera(mouse, cam);
  const hits=raycaster.intersectObject(root, true);
  const _h0=_wceHoverFirstHit(hits);
  if(!_h0) return;
  // Only the NEAREST hit is what's actually visible at the clicked point --
  // intersectObject is purely geometric and returns every mesh anywhere
  // along the ray's full length, including ones on the far/back side of
  // the model that the near surface is currently blocking from view.
  // Walking every hit (as this used to) meant a click on a plain, non-
  // trigger front face could still fire a trigger mesh hidden behind it.
  // hits[0] (three.js sorts intersections by ascending distance) is the
  // one surface the camera can actually see, so only its own parent chain
  // is ever eligible to fire -- exact match first, then the dot-stripped
  // fallback, both scoped to that same nearest hit.
  let o=_h0.object;
  while(o){
    const list=_wceMeshMapGet(_meshTriggerMap, _meshTriggerMapNorm, _meshTriggerNormOwner, o);
    if(list){ _wceFireMeshTriggers(list); return; }
    o=o.parent;
  }
}

// ── 3D Annotations — purely informational markers (text or looping video on

// optimized for many markers), just with its own quiet-until-hover visual

const _annotationDefs=[];
let _annotLeaveTimer=null;

function _closeAnnotationPopup(){

function _stateMatchesSubset(current, subsetState){
  return Object.entries(subsetState||{}).every(([k,v])=>current[k]===v);
}
function _annotationConditionMet(a){

  if(a.link_type==='geo_subset'){

    // meaningful "hover" state at all — pointerenter/pointerleave behave

      // right at the marker's edge, that jitter alone can trigger enter/leave

      // pointer re-enters before it fires, absorbs that without adding any

  }
