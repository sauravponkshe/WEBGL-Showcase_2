<html lang="en">

<title>3D Configurator</title>
<meta name="application-name" content="3D Configurator"/>
<meta name="apple-mobile-web-app-title" content="3D Configurator"/>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{--bg:#0a0a0b;--panel:#101013;--border:#1c1c22;--accent:#c8a96e;--a2:#4a8cff;--ok:#4caf7d;--hot:#ff6b35;--cam:#9b59b6;--text:#e2ddd6;--muted:#52526a;--pw:300px}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Rajdhani',sans-serif}
canvas{display:block}
/* All HUD lives in this stage; WCEUIS sizes it to (viewport / s) and scales it by s (see WCEUIS in ui.js).
   :where() keeps the child rule at zero specificity so class rules such as .wce-overlay-shape{pointer-events:none} still win. */
#wce-ui-stage{position:fixed;left:0;top:0;width:100%;height:100%;z-index:6;transform-origin:0 0;pointer-events:none}
:where(#wce-ui-stage)>*{pointer-events:auto}
/* Everything the artist positions freely lives in this layer. Its size is the reference canvas in a phone view's
   cropped axis (WCEUIS), so a % here means % of the DESIGNED canvas. The identity transform makes it the containing
   block of its position:fixed children. The side panel / loader stay in the stage: they must hug the real screen. */
#wce-ui-canvas{position:absolute;left:0;top:0;width:100%;height:100%;z-index:6;transform:translate(0,0);pointer-events:none}
:where(#wce-ui-canvas)>*{pointer-events:auto}
#panel{position:fixed;top:0;right:0;width:var(--pw);height:100%;background:var(--panel-bg,var(--panel));border-left:1px solid var(--border);display:flex;flex-direction:column;z-index:10;transition:transform 0.3s cubic-bezier(0.2,0.8,0.2,1)}
#panel.closed{transform:translateX(100%)}
#ptab{position:absolute;top:50%;left:-28px;width:28px;height:60px;transform:translateY(-50%);background:var(--panel);border:1px solid var(--border);border-right:none;border-radius:6px 0 0 6px;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;z-index:11;transition:color 0.15s}
#ptab:hover{color:var(--accent)}
/* was @media (max-width:768px): now decided on the STAGE width by WCEUIS, so a scaled tablet/desktop window agrees with the Designer view. */
.wce-narrow{--pw:85%}
#ph{padding:22px 18px 14px;border-bottom:1px solid var(--border);flex-shrink:0}
#ph h1{font-size:17px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--accent)}
#ph p{font-size:10px;color:var(--muted);letter-spacing:.14em;margin-top:3px;font-family:'Inconsolata',monospace}
#tabnav{display:flex;border-bottom:1px solid var(--border);flex-shrink:0}
.tnb{flex:1;padding:8px 4px;background:transparent;border:none;border-bottom:2px solid transparent;color:var(--muted);font-family:'Rajdhani',sans-serif;font-size:10px;letter-spacing:.2em;text-transform:uppercase;cursor:pointer;transition:all .18s}
.tnb:hover{color:var(--text)}
.tnb.active{border-bottom-color:var(--accent);color:var(--accent)}
.tabpane{display:none}.tabpane.active{display:block}
body.wce-panel-combined #tabnav{display:none}
body.wce-panel-combined .tabpane{display:block !important}
body.wce-panel-combined .tabpane:not(:first-child){border-top:1px solid var(--border);margin-top:14px;padding-top:14px}
#pb{flex:1;overflow-y:auto;padding:14px 14px 24px;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
.sec{margin-bottom:18px}
.st{font-size:9px;letter-spacing:.28em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;display:flex;align-items:center;gap:8px}
.st::after{content:'';flex:1;height:1px;background:var(--border)}
.vg{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.vc{padding:9px 10px;background:var(--bg);border:1px solid var(--border);border-radius:4px;cursor:pointer;transition:background .08s,color .08s,border-color .08s,opacity .08s;font-size:12px;letter-spacing:.07em;text-align:center;color:var(--muted)}
.vc:hover{border-color:var(--accent);color:var(--text)}.vc.active{border-color:var(--accent);color:var(--accent);background:#161208}
.gl{font-size:9px;letter-spacing:.18em;color:var(--muted);text-transform:uppercase;margin:10px 0 5px}
.tr{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:4px}
.tb{padding:5px 11px;background:var(--bg);border:1px solid var(--border);border-radius:3px;cursor:pointer;transition:all .15s;font-family:'Rajdhani',sans-serif;font-size:12px;letter-spacing:.05em;color:var(--muted)}
.tb:hover{border-color:var(--a2);color:var(--text)}.tb.active{border-color:var(--a2);color:var(--a2);background:#080f1e}
.pg{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-bottom:5px}
.pb2{padding:7px 9px;background:var(--bg);border:1px solid var(--border);border-radius:3px;cursor:pointer;transition:all .15s;font-family:'Rajdhani',sans-serif;font-size:11px;letter-spacing:.07em;color:var(--muted);text-align:center}
.pb2:hover{border-color:var(--ok);color:var(--text)}.pb2.active{border-color:var(--ok);color:var(--ok);background:#071410}
.gb{width:100%;margin-bottom:5px;padding:8px 12px;background:var(--bg);border:1px solid var(--border);border-radius:3px;cursor:pointer;transition:all .15s;font-family:'Rajdhani',sans-serif;font-size:12px;letter-spacing:.08em;color:var(--muted);text-align:left;display:flex;align-items:center;gap:8px}
.gb::before{content:'◈';font-size:10px;color:var(--accent)}
.gb:hover{border-color:var(--accent);color:var(--text)}.gb.active{border-color:var(--accent);color:var(--accent);background:#161208}
.at{width:100%;padding:7px;background:transparent;border:1px solid var(--border);border-radius:3px;color:var(--muted);font-family:'Rajdhani',sans-serif;font-size:10px;letter-spacing:.18em;text-transform:uppercase;cursor:pointer;margin-top:14px;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:7px}
.at:hover{border-color:var(--muted);color:var(--text)}
#as{display:none;margin-top:14px}#as.open{display:block}
.sr{margin-bottom:7px}.sr label{display:block;font-size:9px;letter-spacing:.18em;color:var(--muted);text-transform:uppercase;margin-bottom:3px}
.sr select{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:5px 9px;border-radius:3px;font-family:'Rajdhani',sans-serif;font-size:13px;outline:none;cursor:pointer;appearance:none}
.sr select:focus{border-color:var(--a2)}
#ld{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;transition:opacity .5s}
#ld.hidden{opacity:0;pointer-events:none}
#lbw{position:relative;width:180px;height:1px;margin-top:18px;--lbw-op:1}
#lbw::before{content:'';position:absolute;left:0;top:0;right:0;bottom:0;background:var(--border);opacity:var(--lbw-op)}
#lb{position:relative;height:100%;width:0%;background:var(--accent);transition:width .25s}
#lt{font-size:10px;letter-spacing:.3em;color:var(--muted);margin-top:10px;font-family:'Inconsolata',monospace}
#st{position:fixed;bottom:14px;left:18px;font-size:9px;letter-spacing:.2em;color:var(--muted);font-family:'Inconsolata',monospace;z-index:10}
</style>
<style id="wce-startup-overrides">
#ld{background-color:#000000}






#lt{font-size:10px !important;font-weight:400 !important}
</style>
<style>
.nested-grp{margin-left:10px;padding-left:8px;border-left:1px solid var(--border);margin-top:6px;display:none}
.nested-grp.open{display:block}
.anim-btn{width:100%;margin-bottom:5px;padding:8px 12px;background:var(--bg);border:1px solid var(--border);border-radius:3px;cursor:pointer;transition:background .08s,color .08s,border-color .08s,opacity .08s;font-family:'Rajdhani',sans-serif;font-size:12px;letter-spacing:.08em;color:var(--muted);text-align:left;display:flex;align-items:center;gap:8px}
.anim-btn:hover{border-color:var(--accent);color:var(--text)}
.anim-btn.playing{border-color:var(--accent);color:var(--accent);background:#161208}
.anim-btn .anim-play-icon{margin-left:auto;font-size:10px;color:var(--accent);opacity:0;transition:opacity .15s}
.anim-btn.playing .anim-play-icon{opacity:1}
.cam-btn{width:100%;margin-bottom:5px;padding:8px 12px;background:var(--bg);border:1px solid var(--border);border-radius:3px;cursor:pointer;transition:background .08s,color .08s,border-color .08s,opacity .08s;font-family:'Rajdhani',sans-serif;font-size:12px;letter-spacing:.08em;color:var(--muted);text-align:left;display:flex;align-items:center;gap:8px}
.cam-btn::before{content:'◎';font-size:10px;color:var(--cam)}
.cam-btn:hover{border-color:var(--cam);color:var(--text)}
.cam-btn.active{border-color:var(--cam);color:var(--cam);background:#100a18}
.tt-btn{width:100%;padding:8px 12px;background:var(--bg);border:1px solid var(--border);border-radius:3px;cursor:pointer;transition:background .08s,color .08s,border-color .08s,opacity .08s;font-family:'Rajdhani',sans-serif;font-size:12px;letter-spacing:.08em;color:var(--muted);text-align:left;display:flex;align-items:center;gap:8px;margin-bottom:5px}
.tt-btn::before{content:'↻';font-size:13px;color:var(--cam)}
.tt-btn:hover{border-color:var(--cam);color:var(--text)}
.tt-btn.active{border-color:var(--cam);color:var(--cam);background:#100a18}
.cin-btn{width:100%;padding:9px 12px;background:var(--bg);border:1px solid var(--hot);border-radius:3px;cursor:pointer;transition:background .08s,color .08s,border-color .08s,opacity .08s;font-family:'Rajdhani',sans-serif;font-size:12px;letter-spacing:.1em;color:var(--hot);text-align:left;display:flex;align-items:center;gap:8px;margin-bottom:8px}
.cin-btn::before{content:'▶';font-size:10px}
.cin-btn:hover{background:#1a0d08;color:var(--text)}
.cin-btn.playing{background:#1a0d08;color:var(--text)}
#ar-btn{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;z-index:9;padding:9px 16px;background:var(--accent);border:1px solid var(--accent);border-radius:4px;color:#0b0b0b;font-family:'Rajdhani',sans-serif;font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;display:flex;align-items:center;gap:8px;transition:all .15s;box-shadow:0 2px 14px rgba(0,0,0,.35)}
#ar-btn:hover{filter:brightness(1.1)}
#ar-btn:active{transform:translateX(-50%) scale(.97)}
#ar-exit{position:fixed;top:14px;right:14px;z-index:10000;padding:8px 14px;background:rgba(0,0,0,.6);border:1px solid #fff;border-radius:4px;color:#fff;font-family:'Rajdhani',sans-serif;font-size:11px;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;display:none}
.wce-overlay-action-btn{position:fixed;z-index:6;padding:7px 11px;background:var(--panel);border:1px solid var(--border);border-radius:4px;color:var(--muted);font-family:'Rajdhani',sans-serif;font-size:10px;letter-spacing:.18em;text-transform:uppercase;cursor:pointer;display:flex;align-items:center;gap:7px;transition:all .15s;opacity:.85}
.wce-overlay-action-btn:hover{border-color:var(--accent);color:var(--text);opacity:1}
.wce-overlay-action-btn.wce-presentation-active{color:var(--accent);border-color:var(--accent);opacity:1}
#ar-hint{position:fixed;left:50%;transform:translateX(-50%);bottom:64px;z-index:10000;padding:8px 14px;background:rgba(0,0,0,.6);color:#fff;border-radius:4px;font-family:'Rajdhani',sans-serif;font-size:11px;letter-spacing:.08em;display:none;text-align:center}
.cin-btn.playing::before{content:'■'}
#hotspot-layer{position:fixed;inset:0;pointer-events:none;z-index:5}
.hs-sprite{position:absolute;pointer-events:none;transform:translate(-50%,-50%);display:none}
.hs-ring{width:44px;height:44px;border-radius:50%;border:2px solid var(--hot);opacity:.85;animation:hs-pulse 1.8s ease-in-out infinite}
.hs-dot{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:9px;height:9px;border-radius:50%;background:var(--hot)}
@keyframes hs-pulse{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.4);opacity:.35}}
.hs-sprite.clickable{pointer-events:auto;cursor:pointer}
.annot-marker{position:absolute;pointer-events:auto;cursor:pointer;transform:translate(-50%,-50%);display:none;border-radius:50%;border:2px solid #000;box-sizing:border-box;transition:box-shadow .2s ease,transform .2s ease}
body.wce-cascade-open .annot-marker,
body.wce-cascade-open .hs-sprite,
body.wce-cascade-open #hotspot-layer > img{display:none !important}
.annot-marker:hover{transform:translate(-50%,-50%) scale(1.15)}
.annot-popup{position:fixed;z-index:10001;max-width:320px;background:rgba(10,10,12,.92);border:1px solid var(--accent,#c8a96e);border-radius:6px;padding:14px 16px;color:#fff;font-family:'Rajdhani',sans-serif;font-size:14px;line-height:1.5;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.annot-popup video{width:100%;border-radius:4px;display:block}
.annot-popup-close{position:absolute;top:6px;right:8px;cursor:pointer;font-size:16px;opacity:.7;line-height:1}
.annot-popup-close:hover{opacity:1}

.wce-overlay-text{position:fixed;z-index:6;pointer-events:none;font-family:'Rajdhani',sans-serif;font-weight:600;text-shadow:0 1px 3px rgba(0,0,0,.6);white-space:nowrap}

.wce-overlay-group{position:fixed;z-index:5;background:rgba(16,16,19,.85);border:1px solid rgba(255,255,255,.15);border-radius:8px;overflow:hidden;transition:width .25s ease}
.wce-group-header{display:flex;align-items:center;gap:6px;padding:6px 10px;cursor:pointer;font-family:'Rajdhani',sans-serif;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--text);background:rgba(255,255,255,.06);position:relative;min-height:28px}
.wce-group-header-content{position:absolute;left:0;top:0;right:0;bottom:0}
body:not(.wce-editing-mode) .wce-group-header{transition:transform .25s ease,height .25s ease,width .25s ease}
.wce-group-arrow{font-size:9px;color:var(--accent);flex-shrink:0}
.wce-group-hdrshape{width:0;height:0;flex-shrink:0;border-style:solid;display:none}
.wce-group-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex-shrink:0}
.wce-group-body{position:relative;overflow:hidden}
body:not(.wce-editing-mode) .wce-group-body{transition:height .25s ease,width .25s ease}
.wce-group-body .wce-overlay-thumb,.wce-group-body .wce-overlay-text{position:absolute}
.wce-group-header-content .wce-overlay-thumb,.wce-group-header-content .wce-overlay-text,.wce-group-header-content .wce-overlay-shape{position:absolute}
.wce-overlay-section-slider{position:fixed;z-index:6;display:flex;flex-direction:column;gap:8px;font-family:'Rajdhani',sans-serif}
.wce-sec-row{display:flex;align-items:center;gap:8px}
.wce-sec-axislabel{font-size:10px;color:#fff;width:14px;flex-shrink:0;text-align:center;font-weight:600;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.wce-sec-axisbtn{flex-shrink:0;width:22px;height:22px;border-radius:4px;border:1px solid rgba(255,255,255,.35);background:rgba(0,0,0,.35);color:#fff;font-size:10px;cursor:pointer;padding:0;font-family:'Rajdhani',sans-serif}
.wce-sec-axisbtn.active{border-color:transparent;color:#000}
.wce-sec-radios{display:flex;gap:4px}
.wce-sec-radio{flex:1;text-align:center;padding:4px 0;font-size:10px;border-radius:4px;background:rgba(0,0,0,.35);color:#fff;cursor:pointer;user-select:none}

const scene=new THREE.Scene();

//  1. The old scene-wide CFG.grade.ambient_intensity (kept for back-compat).

const _ambientLight = new THREE.AmbientLight(0xffffff, ambInt);

const cam=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,0.1,500);

// and its FOV had already been correctly set — a resize event (or anything

// camera-specific FOV with the main camera's, with no relation to whichever
// camera the visitor actually had active at the time.
let _activeCamFocal=null,_activeCamSensor=null;

// Vertical FOV derived from the Scene's camera focal length + sensor width
// (physically correct horizontal→vertical conversion at the CURRENT aspect,
// so resizing the window keeps the same "lens feel" as Blender) — falls
// back to the default 45° if no active perspective camera was found.
function _computeVFov(focal, sensorW){
  if(!focal || !sensorW) return null;

  const vFov=2*Math.atan(Math.tan(hFov/2)/cam.aspect);

// Linear interpolation over a [[t_seconds, focal_length_mm], ...] track

// first/last value outside the track's own range rather than extrapolating,
// since a clip can run slightly past its last sample due to floating-point
// timing.
function _wceSampleFovTrack(track, t){
  if(!track || !track.length) return null;
  if(t<=track[0][0]) return track[0][1];
  if(t>=track[track.length-1][0]) return track[track.length-1][1];
  for(let i=0;i<track.length-1;i++){
    const a=track[i], b=track[i+1];
    if(t>=a[0] && t<=b[0]){

function _envEuler(){
  const r=(CFG.grade && CFG.grade.env_rotation)||[0,0,0];

  // Z (azimuth) → three Y. three's azimuth runs opposite to Blender's, so the
  // Y term is NEGATED to keep +30° in Blender = +30° in the web.
  const x=(r[0]||0)*d2r;

// ever for runtime grading, which no longer happens on this side at all)

// A .ktx2 extension means this file went through the same WebGL Optimized

      // below — three.js's CompressedTexture doesn't support changing it
      // after the fact (the data is already baked in whatever orientation
      // the KTX2 file itself stores), so matching _equirectTex's flipY

// Flatten Ground + Ocean. The dome is a sky: it writes no depth. The sea is drawn after it (see-through pass), so it
// painted over the floor even where the floor is ABOVE the water, and over the dome wall / sky wherever the sea lies
// behind them (the sea disc is much larger than the dome). With the ocean on, a depth-only copy of the dome (same
// geometry, same facing, no colour) is drawn right after it; the sea then depth-tests against it, so the floor and
// the dome show wherever they are in front of the water and the sea ends at the dome wall. Without the ocean nothing
// is added, and from outside the dome (back faces culled, like the dome itself) it writes nothing either.
function _wceGroundDepthMesh(sky){

    m.renderOrder=1001; m.frustumCulled=false; m.name='PONK_GROUND_DEPTH';

function _wceDropGroundSky(){
  if(!_groundSky) return;

function _buildGroundedSkybox(){

  // once it's been determined none is needed) — used by the initial page
  // load below to actually wait for the ground image before declaring
  // itself ready, rather than resolving immediately and letting the ground
  // pop in a moment later. Every caller that doesn't care about this
  // (switching environments after the page has already loaded) can simply
  // ignore the returned Promise — that's harmless, exactly like calling
  // this used to work before it returned anything at all.
  return new Promise((resolveBuilt)=>{
    const h=CFG.hdri||{};

    // otherwise switching to an environment that has background on but
    // Flatten Ground off hits the early return below and never reaches
    // cleanup, leaving the PREVIOUS environment's ground mesh sitting in
    // the scene even though the current one doesn't want one at all.
    _wceDropGroundSky();
    if(!h.flatten_ground || !h.background || !_equirectTex){ resolveBuilt(); return; }

    // ground_skybox_file (a baked/converted WebP/JPEG/PNG, already
    // correctly graded — see _wce_write_ground_skybox_image on the Python
    // export side) is loaded via a plain <img>, entirely separate from
    // _equirectTex/RGBELoader — an additional async step this function
    // didn't need before. Rather than reworking every caller to be
    // async-aware, an unloaded file just kicks off the load and returns;
    // the completion callback re-invokes this same function once it's
    // ready, by which point it'll hit the cache below and proceed
    // synchronously same as always. _groundSkyGen (already used further
    // down to guard the compileAsync callback) does double duty here too —
    // if a newer call supersedes this one before the image finishes
    // loading, the stale callback simply does nothing instead of building
    // an already-obsolete ground mesh.
    let _groundSourceTex=null;

      const cached=_groundSkyboxImageCache[h.ground_skybox_file];
      if(cached){

      } else {
        _groundSkyGen++;
        const _pendingGen=_groundSkyGen;
        _wceLoadGroundSkyboxImage(h.ground_skybox_file, (tex)=>{
          _groundSkyboxImageCache[h.ground_skybox_file]=tex;
          if(_pendingGen===_groundSkyGen) _buildGroundedSkybox().then(resolveBuilt);
          else resolveBuilt();
        }, (e)=>{
          console.warn('[WCE] ground/sky image failed to load, falling back to the HDRI itself:',h.ground_skybox_file,e);
          if(_pendingGen===_groundSkyGen){ h.ground_skybox_file=null; _buildGroundedSkybox().then(resolveBuilt); }
          else resolveBuilt();
        });
        return;
      }
    }

    // Ground Height is the floor's distance BELOW the dome centre, so it must be
    // negative. GroundedSkybox throws on a height <= 0 (which used to leave the ground
    // missing), so anything else -- an older export, 0, NaN -- is corrected with a
    // clear console note instead of failing.
    let floorZ = (h.ground_height != null) ? Number(h.ground_height) : -1.0;
    if(!(floorZ <= -0.01)){

    // Ground mesh rotation/scale/offset are manual, web-only controls — fully
    // independent of the Scene's HDRI light rotation/scale (CFG.grade.env_*),
    // which only drive scene.environment/background above.
    const scaleMultiplier = Math.max(0.001, Math.abs(h.ground_scale != null ? h.ground_scale : 1));

    const shaderHeight = -floorZ * scaleMultiplier;
    let shaderRadius = groundRadius * scaleMultiplier;
    shaderRadius = Math.max(shaderRadius, 0.01);

    try{

      // already correctly graded (see _wce_write_ground_skybox_image on
      // the Python export side); ground_skybox_file set means use that,
      // otherwise fall straight back to the raw HDRI texture, exactly as
      // when Flatten Ground has no override and no grading at all.

      const rotZ=(h.ground_rotation_z||0)*Math.PI/180;

      const offX=(h.ground_offset&&h.ground_offset[0])||0;
      const offY=(h.ground_offset&&h.ground_offset[1])||0;

      // it never touches the shape math above (shaderHeight/shaderRadius).
      // Blender Z and three.js Y are the same up-axis here.

      // Blender's ground plane (X,Y) → three.js (X,Z); three's Y stays vertical.
      // Y needs the same Blender→three negation used everywhere else this
      // axis swap happens (rotation above, _envEuler(), world position export,
      // etc.) — Blender's +Y maps to three's -Z, not +Z. Offset X needs no

      // ever visibly reversed.

      // any background/skybox-style object should), meaning it can only ever
      // correctly hide behind something by testing against a depth value
      // that ALREADY exists in the buffer — it never writes one of its own
      // for anything else to test against. That means it has to draw LAST,
      // after every normal depth-writing object has already established its
      // real depth, not first. A previous attempt forcing this object to
      // draw FIRST (a very low renderOrder) made the bug permanent instead of
      // fixing it, confirming the correct direction is the opposite: this
      // object needs to be reliably last, regardless of scene insertion
      // order or Three.js's own internal sort heuristics for same-priority
      // objects — which is exactly the ambiguity that differed between a
      // fresh page load (ground added to the scene before the model exists
      // yet) and a later rebuild (added once the model's fully settled in),
      // and why only the rebuild ever rendered correctly.
      _groundSky.renderOrder=1000;

      scene.add(_groundSky);
      try{
        if((CFG.ocean&&CFG.ocean.enabled)||window.WCE_OCEAN_TUNER){ const _gd=_wceGroundDepthMesh(_groundSky); if(_gd) _groundSky.add(_gd); }
      }catch(_e){}
      // Wait for GroundedSkybox's shader to actually finish compiling, rather
      // than guessing at a fixed duration — WebGL shader compilation is
      // non-blocking, so a newly-created material can sit uncompiled (and
      // therefore undrawn) for a stretch of time otherwise. compileAsync's
      // Promise resolves at the exact moment this object can render without
      // that stall, so a render is explicitly guaranteed right then. Passed
      // _groundSky itself (not the whole scene) — compiling the entire scene
      // here needlessly re-touches every other material too, and if the
      // ground gets rebuilt again (another environment switch) before that
      // broader compile's polling finishes, it can end up referencing a
      // WebGL program that's since been disposed, throwing "Program object
      // expected". _groundSkyGen guards the same scenario for this pass too —
      // if a newer ground mesh replaces this one before the compile settles,
      // the stale callback below simply does nothing.
      _groundSkyGen++;
      const _thisGroundGen=_groundSkyGen;
      if(typeof renderer!=='undefined' && renderer && typeof cam!=='undefined' && typeof renderer.compileAsync==='function'){
        renderer.compileAsync(_groundSky, cam, scene).then(()=>{
          if(_thisGroundGen===_groundSkyGen && typeof requestRender==='function') requestRender(500);
        }).catch(()=>{});
      } else if(typeof renderer!=='undefined' && renderer && typeof cam!=='undefined'){
        try{ renderer.compile(_groundSky, cam, scene); }catch(e){}
      }
      // Generous fallback window regardless — covers browsers/versions where
      // compileAsync isn't available, or any other reason a frame doesn't
      // make it through right away.
      if(typeof requestRender==='function') requestRender(4000);
    }catch(e){console.warn('[WCE] grounded skybox unavailable:',e);}
    resolveBuilt();

function _envEulerZ(rotZdeg){

function _applyEnvironmentAndLight(item){

  // choices, additively alongside the always-on common layers

  // regardless of what's picked here. Mirrors applyGeoToggle's
  // node-visibility approach, reusing the same findNode mechanism since
  // these are exported the same way GEOMETRIES_ collections already are.
  const envSets=CFG.environment_sets||[];
  const lightSets=CFG.light_sets||[];
  const envChoice=(item&&item.environment)?item.environment.replace(/ /g,'_'):null;
  const lightChoice=(item&&item.light)?item.light.replace(/ /g,'_'):null;
  _wceCurrentLightChoice = lightChoice;   // read by _wceRecomputeAreaLight below (and from ui.js's geometry-triggered resync)

  envSets.forEach(name=>{
    const n=findNode(name);

    // Always on, unconditionally — no longer tied to whether a specific
    // ENVIRONMENTS_<name> switch is also active.
    const cn=findNode('ENVIRONMENTS_COMMON');
    if(cn) cn.visible=true;

  // found and fixed, not reverted away from again). Root cause, confirmed
  // via direct console instrumentation: _applyEnvironmentAndLight() can
  // run — correctly, as part of its own normal page-load sequence —
  // BEFORE a given light has gone through its own one-time setup (the
  // block below in _onModelLoaded that computes and stores
  // wceBaseIntensity in the first place). Whichever of the model load or
  // the HDRI/environment load's own async chain happens to finish certain
  // steps first isn't fixed — it can vary with network timing — so this
  // isn't a one-time ordering fluke to patch around; it's a genuine race.
  // When the race lands this way, this loop would try to turn the light
  // off (a rig that isn't the active one) by writing directly to
  // intensity, on a light whose "on" reference value doesn't exist yet —
  // permanently zeroing the ONLY value setup captures moments later,
  // baking in a corrupted "on" brightness for the rest of the session.
  // Skipping any light setup hasn't reached yet leaves its intensity
  // untouched no matter which of the two async chains wins the race —
  // setup, whenever it actually runs, then captures the real, uncorrupted
  // value instead. The tiny window before setup runs (where such a light
  // would sit at its raw, undivided intensity) is never actually visible —
  // it's entirely behind the loading screen, which already waits for
  // initial HDRI/ground readiness before revealing anything.
  lightSets.forEach(name=>{
    const n=findNode(name);
    if(!n) return;
    n.visible=true;
    const on=(name.replace(/ /g,'_')===lightChoice);
    n.traverse(child=>{
      if(!child.isLight) return;
      if(child.userData.wceBaseIntensity===undefined) return;   // not set up yet — a later call handles it correctly
      const mobileOff = child.userData.wceDisableMobile && _wceIsMobileView();
      child.intensity = (on && !mobileOff) ? child.userData.wceBaseIntensity : 0;
    });

    const ln=findNode('LIGHTS');

  }

  // all — KHR_lights_punctual doesn't cover area lights — so they can't
  // ride along with the node-visibility switching above. They're added
  // directly to the Three.js scene instead (see the GLTFLoader callback),
  // each tagged with which rig it came from at export time. Recomputed
  // here too, using the exact same on/off rule as the mesh-based lights
  // above, so an environment that doesn't include a given rig no longer
  // keeps that rig's area lights lit forever. See _wceRecomputeAreaLight
  // for why this is an intensity toggle, not .visible.
  _areaLights.forEach(_wceRecomputeAreaLight);
}

function _applyHDRITexture(item,tex,envRT){

  // before declaring the initial HDRI "ready" — otherwise the loading
  // screen/model-ready gate could open before the ground mesh has actually
  // arrived, showing everything else correctly but with the ground popping
  // in visibly a moment later. Environment switches later in the session

function _loadHDRIItem(item){

  // deliberate state (solid black + flat ambient) rather than whatever
  // Three.js's own defaults happen to leave it in.

  if(cached){ _applyHDRITexture(item,cached.tex,cached.envRT); return; }

  // safety pass, PMREM generation) — deferred until the model itself has
  // fully finished loading, so the two don't compete for memory/CPU at

  // time any later, manual environment switch calls this again, so this
  // adds no delay at all past the first load.

  // nothing below this line needs to know which one actually ran.

  // unconditionally, on every device rather than only where needed: some
  // older iOS GPUs claim to support smooth (linear) filtering of full
  // 32-bit float textures via OES_texture_float_linear, but the extension
  // silently doesn't actually work on them — a documented, known-
  // inconsistent gap in how iOS reports this capability (it can report
  // "supported" and then quietly behave as if it weren't). Half-float
  // linear filtering doesn't have this problem — it's part of the core
  // WebGL2 spec, not an optional extension with unreliable support — so
  // using it everywhere sidesteps the whole unreliable-detection problem
  // rather than trying to trust a capability check that can't be trusted
  // even when it reports the capability as present. The precision
  // difference isn't visually meaningful for HDRI lighting either way.
  // An earlier version of this forced full-float decoding first, then
  // manually converted every value to half-float afterward in a second
  // JS pass — that briefly held two full-size copies of the data in
  // memory at once, plus millions of individual conversion function
  // calls on the main thread, both of which turned out to be exactly
  // heavy enough to crash on memory-constrained mobile devices (the
  // problem this whole change exists to fix in the first place). Letting
  // the loader decode straight to half-float avoids both costs entirely.

    // light source) that overflows half-float's range (~65504). The
    // loader's own native half-float conversion does NOT protect against
    // this — it deliberately converts an overflowing value to Infinity/NaN
    // (confirmed directly in RGBELoader's own source), which desktop GPUs
    // often tolerate silently but iOS Safari does not: it throws "total
    // float value out of range" and fails the whole texture upload
    // outright. This checks each already-half-float value for that
    // specific broken bit pattern (all 5 exponent bits set — the half-float
    // encoding for Infinity/NaN) and clamps only those to a safe, finite
    // value — a plain integer comparison per value, not a full decode and
    // re-encode round trip, so this stays cheap even over a large texture.
    const _hdriData = t.image && t.image.data;

    // instead of a raw equirect lookup.

    _applyHDRITexture(item,t,_envRT);

  });
}

const _TRANS=Object.assign({}, CFG.transitions||{});

_TRANS.geo_ms=_wceMs(CFG.transitions,'geo_sec','geo_ms',180);
window._TRANS=_TRANS;

const _geoTweens=[];   // {meshes:[{mesh, origMats, clones}], dir, t, dur, hideAtEnd:[nodes]}

// The overlay holds the OLD material while the real mesh shows the NEW one. It used to be a plain
// Mesh whose position / rotation / scale were copied once, at the moment of the click -- so while an
// animation was playing it stayed frozen on the pose of that first frame (and a skinned or shape-key

// Wave sweep frame: the planes are in WORLD space, so they must move with the mesh when it is

  // settle node visibility, so we never strand a mesh on a clone or hidden state.
  const meshSet=new Set(meshes);

const _geoFlickerTimers={};

  const nodes=(def.geo_nodes||[]).map(_findGeoTarget).filter(Boolean);

  if(_geoFlickerTimers[def.name]) _geoFlickerTimers[def.name].forEach(t=>clearTimeout(t));
  const count=Math.max(1, def.flicker_count||5);
  const totalMs=Math.max(100, (def.flicker_duration||1.5)*1000);
  const endsOn=(def.flicker_end_state||'ON')!=='OFF';
  // count*2 alternating OFF/ON steps always naturally lands on ON (the
  // pattern starts OFF and count*2 is always even, so the last index is
  // odd → showing=true). Ending OFF instead just needs one more half-step
  // tacked on at the end to flip it back down. This is already exact, so
  // there's no extra "settle" step needed after the loop — an earlier
  // version had one anyway, which fired a redundant fade every single time
  // regardless of whether it was needed, showing up as a phantom extra
  // flicker right at the end of every real one.
  const totalSteps=count*2+(endsOn?0:1);
